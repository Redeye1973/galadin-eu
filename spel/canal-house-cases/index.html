  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Une haute pièce donnant sur le canal. Des livres jusqu'au plafond, un bureau près de la fenêtre, une cheminée surmontée d'une pendule. Le notaire est toujours assis dans son fauteuil.",
  "De notaris": "Le notaire",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra : « Pas de blessure, pas de lutte. Mais regardez les lèvres : bleues. Et les pupilles sont dilatées. » Lievens : « Ce n'est pas le cœur, docteur. C'est quelque chose qu'il a bu. » Sur le bureau, une plaque : E. Brandsma, notaire.",
  "Het portglas": "Le verre de porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Un verre à moitié vide, avec un dépôt au fond. Lievens le hume. « Du porto. Et quelque chose d'amer en dessous. De la digitale pourprée, Hoekstra. De la digitaline. Pour un cardiaque, un remède ; pour un homme en bonne santé, un poison. » La bouteille de porto est sur le buffet, intacte depuis que la domestique l'y a posée.",
  "De pendule": "La pendule",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "La pendule de la cheminée s'est arrêtée sur minuit moins dix. Lievens la soulève : dans la poussière du manteau de cheminée se dessine un rectangle, décalé d'un pouce par rapport au pied. « On l'a soulevée, puis remise en place. Et une pendule que l'on soulève s'arrête. Qui veut nous faire croire qu'il est mort à minuit moins dix, Hoekstra ? Quelqu'un qui a un bon alibi pour minuit moins dix. »",
  "De kaars": "La bougie",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Une bougie sur le bureau, consumée jusqu'à n'être plus qu'un moignon d'un pouce. Griet dit en avoir allumé une neuve à neuf heures et demie, en apportant le porto ; une telle bougie dure quatre heures. « Elle avait donc brûlé une heure quand sa main est tombée dessus et l'a éteinte », dit Lievens. « Il est mort entre dix et onze heures, et non à minuit moins dix. La pendule ment. »",
  "Het testament": "Le testament",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Un testament tout frais, signé hier et pas encore déposé à l'étude : tout « à mon épouse Cornelia Brandsma-de Wit » et au Burgerweeshuis, l'orphelinat de la ville. L'ancien testament, posé à côté et barré d'un trait, ne nommait qu'un seul héritier : « mon neveu et clerc Reinier ». Lievens : « Un homme déshérité hier, Hoekstra, a aujourd'hui une raison. »",
  "Een brief": "Une lettre",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Une lettre de la compagnie de navigation Veenstra & Co., signée D. Veenstra : « Je vous supplie de m'accorder un délai pour la dette jusqu'au printemps. Ne me poussez pas à des actes désespérés. » Hoekstra : « Une menace ! » Lievens : « Un homme qui supplie, docteur. Et un homme qui supplie n'empoisonne pas, le soir même, le seul qui puisse lui accorder un délai. »",
  "Het raam": "La fenêtre",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "La fenêtre est verrouillée de l'intérieur ; le loquet est pris dans la peinture et la poussière. Personne n'est passé par ici. « Celui qui a fait cela, docteur, est entré par la porte. Et celui qui est entré par la porte était déjà dans la maison. »",
  "De prullenmand": "La corbeille à papier",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Un billet froissé : « Mon oncle, il faut que je vous parle ce soir encore du testament. R. » L'encre est étalée sur le côté gauche de chaque ligne. Lievens : « Écrit par un gaucher, avec une plume encore humide. Tout à l'heure, regardez les mains, Hoekstra. »",
  "De briefopener": "Le coupe-papier",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Un coupe-papier en argent, propre et à sa place. « Il n'a pas servi », dit Lievens sans lever les yeux. « Un empoisonneur n'a pas besoin de couteau. »",
  "De keuken": "La cuisine",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "En bas, au fond de la maison. Un fourneau, un égouttoir garni de verres, l'armoire de la gouvernante et la porte de derrière, qui donne sur la ruelle.",
  "Het medicijnkastje": "L'armoire à pharmacie",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "L'armoire de Griet Jansen, la gouvernante, avec ses gouttes pour le cœur : un flacon de teinture de digitaline du pharmacien, rempli la semaine dernière, presque vide à présent. La pipette qui va avec a disparu. Griet : « J'en prends cinq gouttes par jour, monsieur. Pas un demi-flacon. »",
  "Het glazenrek": "L'égouttoir",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "À neuf heures et demie, Griet a monté un seul verre de porto, comme chaque soir. Sur l'égouttoir se trouve un second verre à porto, lavé et remis en place, mais encore humide à l'intérieur. Lievens : « Encore humide à minuit. Quelqu'un a bu avec lui, Hoekstra, puis a lavé son verre. Un invité ne lave pas son verre. Quelqu'un de la maison, si. »",
  "De achterdeur": "La porte de derrière",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet verrouille la porte de derrière chaque soir à dix heures, puis la porte d'entrée ; cette nuit n'a pas fait exception. « Et M. Veenstra ? » « Il est parti à neuf heures, monsieur, par la porte d'entrée. Je l'ai reconduit moi-même ; un homme aussi grand, avec une barbe aussi rousse, cela ne s'oublie pas. » Après dix heures, il n'y avait donc personne dans la maison, hormis la famille et moi-même.",
  "Het huishoudboek": "Le livre de ménage",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Le livre de ménage de Griet : « 9 nov. Madame au Stadsschouwburg, Carmen, avec les dames Van Eeghen. Voiture commandée pour minuit et demi. » Lievens : « Madame est rentrée entre minuit et une heure. Si la pendule disait vrai, ce pourrait être elle. Mais la pendule ment. »",
  "Het fornuis": "Le fourneau",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Le fourneau est froid ; on ne s'est pas servi de la cuisine depuis onze heures. Il ne s'est rien passé ici.",
  "De gang en de kapstok": "Le couloir et le portemanteau",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Le couloir de l'étage, entre le cabinet de travail et les chambres. Un portemanteau chargé de manteaux, un porte-parapluies, la porte de la chambre du neveu.",
  "De overjas aan de haak": "Le pardessus à la patère",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Le manteau du neveu, Reinier. Dans la poche intérieure : une pipette de verre à poire de caoutchouc, la pipette du flacon de Griet. Sur la manche droite, une tache de porto. « Il a versé de la main gauche, dit Lievens, et renversé sur la droite. Un gaucher avec de l'encre aux doigts et une pipette dans la poche. Hoekstra, je crois que nous avons terminé. »",
  "De schoenen bij de deur": "Les chaussures près de la porte",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trois paires de chaussures, toutes sèches ; il a plu toute la nuit. Personne de cette maison n'est sorti cette nuit. Seuls les souliers du soir de Madame sont mouillés, près de la porte d'entrée : elle revenait de l'opéra.",
  "Een operaprogramma": "Un programme d'opéra",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Sur le guéridon : le programme de Carmen, Stadsschouwburg, 9 novembre, lever du rideau à huit heures, avec le billet d'entrée de Madame glissé dedans. Hoekstra : « Un alibi jusqu'après minuit. » Lievens : « Un alibi pour minuit moins dix. Pas pour l'heure qu'indique la bougie. »",
  "De kamer van de neef": "La chambre du neveu",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, le neveu, loge dans la maison. Il dit s'être couché à dix heures et n'avoir rien entendu. Il est gaucher : il a de l'encre à l'index gauche. Hoekstra demande s'il était jaloux de sa tante. « Jaloux ? dit Lievens. Non. Déshérité. »",
  "De paraplubak": "Le porte-parapluies",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Un parapluie qui ruisselle : celui du docteur Hoekstra. « Je vous avais bien dit de le prendre », dit Lievens, satisfait.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens alluma sa pipe. « C'était le neveu, Hoekstra. Hier, Reinier a lu le nouveau testament et a vu qu'il n'hériterait plus de rien. Il a écrit un billet à son oncle, il est entré dans le cabinet de travail après dix heures avec un second verre, et il leur a servi du porto à tous deux : le sien pur, celui de son oncle avec un demi-flacon des gouttes pour le cœur de Griet. La digitaline arrête un cœur. Un médecin de famille voit un vieil homme à son bureau et pense : le cœur. Il avait presque raison. »",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "« Ensuite il a lavé son verre, a mis la pendule sur minuit moins dix, et il est allé se coucher. À minuit moins dix, voyez-vous, il dormait déjà depuis une heure, et sa tante était encore au théâtre. Un alibi impeccable pour une heure à laquelle personne n'est mort. Il a oublié la bougie. Et il a oublié qu'une pipette n'a rien à faire dans une poche intérieure. »",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "La police vint chercher Reinier Brandsma à une heure. L'orphelinat reçut son argent. Et moi, qui avais failli oublier mon parapluie, je mis tout cela par écrit.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Maidin fhliuch i mí na Samhna 1908 a bhí ann nuair a sheas cailín aimsire an nótaire Everhardus Brandsma ag an doras againn ar an Keizersgracht. \"Tá an nótaire marbh, a Dhochtúir. Ina sheomra staidéir, ag a dheasc. Deir dochtúir an teaghlaigh: an croí. Ach deir Bean Jansen, bean an tí, nach bhfuil sé sin ceart, agus chuir sí chuig an Uasal Lievens mé.\"",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Bhí a chóta air cheana féin ag Lievens. \"Nótaire a fhaigheann bás ag a dheasc tráthnóna, a Hoekstra, agus uacht úr faoina lámh. Más é an croí a bhí ann, íosfaidh mé mo hata.\" D'fhéach sé suas ar an spéir. \"Tóg do scáth fearthainne leat. Agus coinnigh súil ar an gclog.\"",

  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: \"Gan chréacht, gan chomhrac. Ach féach ar na liopaí: gorm. Agus tá na mic imrisc leathnaithe.\" Lievens: \"Ní hé an croí é sin, a Dhochtúir. Is rud éigin é a d'ól sé.\" Ar an deasc tá pláta ainm: E. Brandsma, nótaire.",
  "Het portglas": "An ghloine phóirt",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Gloine, leathfholamh, le dríodar ar a tóin. Bolaíonn Lievens í. \"Fíon póirt. Agus rud éigin searbh faoi. Lus mór, a Hoekstra. Digitalis. Do dhuine a bhfuil galar croí air is leigheas é; do dhuine sláintiúil is nimh é.\" Tá buidéal an fhíona póirt ar an gcófra taobh, gan bhaint leis ó leag an cailín aimsire síos é.",
  "De pendule": "An clog matail",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Tá an clog matail ar an matal stoptha ag deich chun a dó dhéag. Tógann Lievens suas é: sa deannach ar an matal tá dronuilleog, leithead ordóige in aice lena bhonn. \"Tógadh suas é agus cuireadh ar ais é. Agus stopann clog luascáin nuair a thógtar é. Cé atá ag iarraidh go gcreidfimis go bhfuair sé bás ag deich chun a dó dhéag, a Hoekstra? Duine a bhfuil ailibí maith aige do dheich chun a dó dhéag.\"",
  "De kaars": "An choinneal",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Coinneal ar an deasc, dóite síos go stumpa ar fhad ordóige. Deir Griet gur las sí coinneal úr ag leathuair tar éis a naoi nuair a thug sí an fíon póirt isteach; dónn a leithéid de choinneal ar feadh ceithre huaire. \"Mar sin bhí sí ar lasadh le huair an chloig nuair a thit a lámh uirthi agus gur mhúch sí í,\" a deir Lievens. \"Fuair sé bás idir a deich agus a haon déag, ní ag deich chun a dó dhéag. Tá an clog ag insint bréige.\"",
  "Het testament": "An uacht",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Uacht úr, sínithe inné agus gan a bheith taiscthe fós san oifig: gach rud do \"mo bhean chéile Cornelia Brandsma-de Wit\" agus don Burgerweeshuis, dílleachtlann na cathrach. Sa seanuacht, atá ina luí lena taobh agus líne tríthi, níor luadh ach oidhre amháin: \"mo nia agus mo chléireach Reinier.\" Lievens: \"Fear a díoidhreachtaíodh inné, a Hoekstra, tá cúis aige inniu.\"",
  "Een brief": "Litir",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Litir ó chomhlacht loingis Veenstra & Co., sínithe ag D. Veenstra: \"Impím ort an fiach a chur siar go dtí an t-earrach. Ná brúigh mé chun gníomhartha éadóchais.\" Hoekstra: \"Bagairt!\" Lievens: \"Fear atá ag impí, a Dhochtúir. Agus ní nimhíonn fear atá ag impí, an tráthnóna céanna, an t-aon duine amháin atá in ann am a thabhairt dó.\"",
  "Het raam": "An fhuinneog",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Tá an fhuinneog boltaithe ón taobh istigh; tá an bolta greamaithe go daingean le péint agus deannach. Níor tháinig aon duine isteach an bealach seo. \"Cibé duine a rinne é, a Dhochtúir, tháinig sé tríd an doras. Agus cibé duine a tháinig tríd an doras, bhí sé sa teach cheana féin.\"",
  "De prullenmand": "An ciseán páipéir",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Nóta craptha: \"A uncail, caithfidh mé labhairt leat anocht faoin uacht. R.\" Tá an dúch smeartha ar thaobh na láimhe clé de gach líne. Lievens: \"Fear ciotach a scríobh é, le peann a bhí fós fliuch. Coinnigh súil ar lámha daoine ar ball, a Hoekstra.\"",
  "De briefopener": "An t-osclóir litreacha",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Osclóir litreacha airgid, glan agus ina áit féin. \"Níor úsáideadh é,\" a deir Lievens gan breathnú suas. \"Níl gá ag nimheadóir le scian.\"",
  "De keuken": "An chistin",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Thíos staighre, ar chúl an tí. Sorn, raca gloiní, cófra bhean an tí agus an doras cúil amach chuig an gcúlsráid.",
  "Het medicijnkastje": "An cófra leigheasanna",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Cófra Griet Jansen, bean an tí, agus a braonta croí ann: buidéal beag tinchtúir digitalis ón gceimiceoir, líonta an tseachtain seo caite, beagnach folamh anois. Tá an pípéad a ghabhann leis ar iarraidh. Griet: \"Glacaim cúig bhraon sa lá, a dhuine uasail. Ní leath buidéil.\"",
  "Het glazenrek": "An raca gloiní",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Ag leathuair tar éis a naoi thug Griet gloine amháin fíona póirt suas staighre, mar a dhéanadh sí gach tráthnóna. Sa raca tá an dara gloine phóirt, nite agus curtha ar ais, ach fós fliuch istigh. Lievens: \"Fós fliuch ag meán oíche. D'ól duine éigin in éineacht leis, a Hoekstra, agus nigh sé a ghloine ina dhiaidh sin. Ní níonn aoi a ghloine. Níonn duine de mhuintir an tí í.\"",
  "De achterdeur": "An doras cúil",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Cuireann Griet bolta ar an doras cúil gach tráthnóna ag a deich a chlog agus ar an doras tosaigh ina dhiaidh sin; ní raibh aon difríocht aréir. \"Agus an tUasal Veenstra?\" \"D'imigh sé ag a naoi, a dhuine uasail, tríd an doras tosaigh. Lig mé féin amach é; ní dhéanann tú dearmad ar fhear chomh mór sin le féasóg chomh rua sin.\" Mar sin, tar éis a deich ní raibh aon duine sa teach ach an teaghlach agus mé féin.",
  "Het huishoudboek": "Leabhar an tí",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Leabhar tí Griet: \"9 Samh. An bhean uasal chuig an Stadsschouwburg, Carmen, leis na mná uaisle Van Eeghen. Carráiste ordaithe do leathuair tar éis a dó dhéag.\" Lievens: \"Tháinig an bhean uasal abhaile idir a dó dhéag agus a haon. Dá mbeadh an clog ceart, d'fhéadfadh gurbh ise a bhí ann. Ach tá an clog ag insint bréige.\"",
  "Het fornuis": "An sorn",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Tá an sorn fuar; níor úsáideadh an chistin ó bhí a haon déag a chlog ann. Níor tharla aon rud anseo.",
  "De gang en de kapstok": "An pasáiste agus an crochadán cótaí",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "An pasáiste thuas staighre, idir an seomra staidéir agus na seomraí codlata. Crochadán le cótaí, seastán scáth fearthainne, an doras chuig seomra an nia.",
  "De overjas aan de haak": "An cóta mór ar an mbacán",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Cóta an nia, Reinier. Sa phóca istigh: pípéad gloine le caipín rubair, an pípéad ó bhuidéal beag Griet. Ar an muinchille dheas tá smál fíona póirt. \"Lena lámh chlé a dhoirt sé,\" a deir Lievens, \"agus is ar a thaobh deas a dhoirt sé braon. Fear ciotach agus dúch ar a mhéara agus pípéad ina phóca. A Hoekstra, creidim go bhfuil ár ngnó déanta.\"",
  "De schoenen bij de deur": "Na bróga in aice an dorais",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trí phéire bróg, iad uile tirim; bhí sé ag cur báistí ar feadh na hoíche. Ní raibh aon duine den teach seo amuigh aréir. Níl fliuch ach bróga tráthnóna na mná uaisle in aice an dorais tosaigh: tháinig sí ón gceoldráma.",
  "Een operaprogramma": "Clár ceoldráma",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Ar an mbord beag: clár Carmen, Stadsschouwburg, 9 Samhain, ag tosú ag a hocht, agus ticéad na mná uaisle istigh ann. Hoekstra: \"Ailibí go dtí tar éis meán oíche.\" Lievens: \"Ailibí do dheich chun a dó dhéag. Ní don am a insíonn an choinneal.\"",
  "De kamer van de neef": "Seomra an nia",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Codlaíonn Reinier Brandsma, an nia, sa teach. Deir sé go ndeachaigh sé a luí ag a deich agus nár chuala sé faic. Tá sé ciotach: tá dúch ar a chorrmhéar chlé. Fiafraíonn Hoekstra de an raibh éad air lena aintín. \"Éad?\" a deir Lievens. \"Ní hea. Díoidhreachtú.\"",
  "De paraplubak": "An seastán scáth fearthainne",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Scáth fearthainne ag sileadh: scáth an Dochtúra Hoekstra. \"Dúirt mé leat é a thabhairt leat,\" a deir Lievens go sásta.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Las Lievens a phíopa. \"An nia a bhí ann, a Hoekstra. Inné léigh Reinier an uacht nua agus chonaic sé nach bhfaigheadh sé faic níos mó mar oidhreacht. Scríobh sé nóta chuig a uncail, tháinig sé isteach sa seomra staidéir tar éis a deich a chlog le dara gloine, agus dhoirt sé fíon póirt don bheirt acu: a ghloine féin glan, gloine a uncail le leath buidéil de bhraonta croí Griet. Stopann digitalis croí. Feiceann dochtúir teaghlaigh seanfhear ag a dheasc agus ceapann sé: an croí. Is beag nach raibh an ceart aige.\"",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "\"Ansin nigh sé a ghloine, chuir sé an clog matail ar dheich chun a dó dhéag, agus chuaigh sé a luí. Ag deich chun a dó dhéag, tar éis an tsaoil, bheadh sé ina chodladh le huair an chloig, agus a aintín fós san amharclann. Ailibí néata d'am nach bhfuair aon duine bás ann. Rinne sé dearmad ar an gcoinneal. Agus rinne sé dearmad nach bhfuil áit ag pípéad i bpóca istigh.\"",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Tháinig na póilíní faoi choinne Reinier Brandsma ag a haon a chlog. Fuair an dílleachtlann a chuid airgid. Agus mise, a bhí beagnach tar éis dearmad a dhéanamh ar mo scáth fearthainne, scríobh mé síos é ar fad.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Bilo je kišno jutro u studenome 1908. kad je sluškinja notara Everhardusa Brandsme stajala na našem pragu na Keizersgrachtu. „Notar je mrtav, doktore. U svojoj radnoj sobi, za pisaćim stolom. Obiteljski liječnik kaže: srce. Ali gospođa Jansen, domaćica, kaže da nešto nije u redu, i poslala me gospodinu Lievensu.“",

  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Visoka soba uz kanal. Knjige do stropa, pisaći stol kraj prozora, kamin sa satom na polici. Notar još sjedi u svojem naslonjaču.",
  "De notaris": "Notar",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Nema rane, nema tragova borbe. Ali pogledajte usne: modre. I zjenice su proširene.“ Lievens: „To nije srce, doktore. To je nešto što je popio.“ Na pisaćem stolu stoji pločica s imenom: E. Brandsma, notar.",
  "Het portglas": "Čaša porta",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Čaša, napola prazna, s talogom na dnu. Lievens je pomiriše. „Porto. A ispod toga nešto gorko. Naprstak, Hoekstra. Digitalis. Srčanom bolesniku lijek, zdravu čovjeku otrov.“ Boca porta stoji na kredencu, netaknuta otkako ju je sluškinja ondje odložila.",
  "De pendule": "Sat na kaminu",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Sat na polici kamina stao je u deset do dvanaest. Lievens ga podiže: u prašini na polici vidi se pravokutnik, palac uz njegovo podnožje. „Netko ga je podigao i vratio na mjesto. A sat s njihalom koji podigneš stane. Tko želi da povjerujemo da je umro u deset do dvanaest, Hoekstra? Netko tko za deset do dvanaest ima dobar alibi.“",
  "De kaars": "Svijeća",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Svijeća na pisaćem stolu, dogorjela do patrljka dugog kao palac. Griet kaže da je u pola deset upalila novu svijeću kad je donijela porto; takva svijeća gori četiri sata. „Onda je gorjela tek sat vremena kad je na nju pala njegova ruka i ugasila je,“ kaže Lievens. „Umro je između deset i jedanaest sati, a ne u deset do dvanaest. Sat laže.“",
  "Het testament": "Oporuka",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Svježa oporuka, jučer potpisana i još nepohranjena u uredu: sve „mojoj supruzi Corneliji Brandsma-de Wit“ i Burgerweeshuisu, gradskom sirotištu. Stara oporuka, koja leži pokraj nje precrtana, navodila je samo jednog nasljednika: „mojeg nećaka i pisara Reiniera“. Lievens: „Čovjek koji je jučer razbaštinjen, Hoekstra, danas ima razlog.“",
  "Een brief": "Pismo",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Pismo brodarske tvrtke Veenstra & Co., potpisano D. Veenstra: „Preklinjem vas, odgodite dug do proljeća. Ne tjerajte me na očajnička djela.“ Hoekstra: „Prijetnja!“ Lievens: „Čovjek koji preklinje, doktore. A čovjek koji preklinje ne truje iste večeri jedinoga koji mu može dati odgodu.“",
  "Het raam": "Prozor",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Prozor je iznutra zatvoren zasunom; zasun je čvrsto zaglavljen bojom i prašinom. Ovuda nitko nije ušao. „Tko god je to učinio, doktore, ušao je kroz vrata. A tko je ušao kroz vrata, bio je u kući.“",
  "De prullenmand": "Koš za papir",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Zgužvana cedulja: „Striče, večeras moram još razgovarati s vama o oporuci. R.“ Tinta je razmazana s lijeve strane svakog retka. Lievens: „Pisao je ljevak, perom koje je još bilo mokro. Poslije pripazite na ruke, Hoekstra.“",
  "De briefopener": "Nož za papir",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Srebrni nož za papir, čist i na svojem mjestu. „Nije korišten,“ kaže Lievens ne podižući pogled. „Trovaču ne treba nož.“",
  "De keuken": "Kuhinja",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Dolje, u stražnjem dijelu kuće. Štednjak, stalak s čašama, ormarić domaćice i stražnja vrata prema uličici.",
  "Het medicijnkastje": "Ormarić s lijekovima",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Ormarić Griet Jansen, domaćice, s njezinim kapima za srce: bočica tinkture digitalisa iz ljekarne, napunjena prošlog tjedna, sada gotovo prazna. Pipeta koja ide uz nju nedostaje. Griet: „Uzimam pet kapi na dan, gospodine. Ne pola bočice.“",
  "Het glazenrek": "Stalak za čaše",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet je u pola deset, kao i svake večeri, odnijela gore jednu čašu porta. Na stalku stoji druga čaša za porto, oprana i vraćena na mjesto, ali iznutra još mokra. Lievens: „U ponoć još mokra. Netko je pio s njim, Hoekstra, i zatim oprao svoju čašu. Gost ne pere svoju čašu. Ukućanin da.“",
  "De achterdeur": "Stražnja vrata",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet svake večeri u deset sati zasunom zaključa stražnja vrata, a zatim i ulazna; sinoć nije bilo drukčije. „A gospodin Veenstra?“ „On je otišao u devet, gospodine, kroz ulazna vrata. Sama sam ga ispratila; tako krupnog čovjeka s tako riđom bradom ne zaboravljaš.“ Nakon deset sati, dakle, u kući nije bilo nikoga osim obitelji i mene.",
  "Het huishoudboek": "Kućna knjiga",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Grietina kućna knjiga: „9. stud. Gospođa u Stadsschouwburg, Carmen, s gospođama Van Eeghen. Kočija naručena za pola jedan.“ Lievens: „Gospođa je došla kući između ponoći i jednog sata. Da je sat pokazivao točno, mogla je to biti ona. Ali sat laže.“",
  "Het fornuis": "Štednjak",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Štednjak je hladan; kuhinja se ne koristi od jedanaest sati. Ovdje se ništa nije dogodilo.",
  "De gang en de kapstok": "Hodnik i vješalica",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Hodnik na katu, između radne sobe i spavaćih soba. Vješalica s kaputima, stalak za kišobrane, vrata nećakove sobe.",
  "De overjas aan de haak": "Kaput na kuki",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Nećakov kaput, Reinierov. U unutarnjem džepu: staklena pipeta s gumenom kapicom, pipeta s Grietine bočice. Na desnom rukavu mrlja od porta. „Točio je lijevom,“ kaže Lievens, „a polio se po desnoj. Ljevak s tintom na prstima i pipetom u džepu. Hoekstra, mislim da smo gotovi.“",
  "De schoenen bij de deur": "Cipele kraj vrata",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tri para cipela, sve suhe; cijelu je noć padala kiša. Nitko iz ove kuće noćas nije bio vani. Samo gospođine večernje cipele stoje mokre kraj ulaznih vrata: došla je iz opere.",
  "Een operaprogramma": "Program opere",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na stoliću: program Carmen, Stadsschouwburg, 9. studenoga, početak u osam sati, s gospođinom ulaznicom unutra. Hoekstra: „Alibi do iza ponoći.“ Lievens: „Alibi za deset do dvanaest. Ne za vrijeme koje pokazuje svijeća.“",
  "De kamer van de neef": "Nećakova soba",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, nećak, spava u kući. Kaže da je u deset otišao na spavanje i ništa nije čuo. Ljevak je: na lijevom kažiprstu ima tinte. Hoekstra pita je li bio ljubomoran na strinu. „Ljubomoran?“ kaže Lievens. „Ne. Razbaštinjen.“",
  "De paraplubak": "Stalak za kišobrane",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Kišobran s kojega kaplje: kišobran doktora Hoekstre. „Rekao sam vam da ga ponesete,“ zadovoljno kaže Lievens.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens je zapalio lulu. „Bio je to nećak, Hoekstra. Reinier je jučer pročitao novu oporuku i vidio da više neće naslijediti ništa. Napisao je stricu ceduljicu, nakon deset sati ušao u radnu sobu s drugom čašom i obojici natočio porta: sebi čistog, stricu s pola bočice Grietinih kapi za srce. Digitalis zaustavi srce. Obiteljski liječnik vidi starca za pisaćim stolom i pomisli: srce. Gotovo je bio u pravu.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Zatim je oprao svoju čašu, namjestio sat na deset do dvanaest i otišao na spavanje. U deset do dvanaest, naime, već je sat vremena spavao, a strina mu je još bila u kazalištu. Uredan alibi za vrijeme u kojem nitko nije umro. Zaboravio je svijeću. I zaboravio je da pipeti nije mjesto u unutarnjem džepu.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policija je Reiniera Brandsmu odvela u jedan sat. Sirotište je dobilo njegov novac. A ja, koji sam umalo zaboravio kišobran, sve sam zapisao.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Esős novemberi reggel volt 1908-ban, amikor Everhardus Brandsma közjegyző szolgálólánya megállt a küszöbünkön a Keizersgrachton. „A közjegyző úr meghalt, doktor úr. A dolgozószobájában, az íróasztalánál. A háziorvos azt mondja: a szíve. De Jansen asszony, a házvezetőnő, azt mondja, hogy ez nem stimmel, és engem Lievens úrhoz küldött.”",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievensen már rajta volt a kabát. „Egy közjegyző, aki este hal meg az íróasztalánál, Hoekstra, friss végrendelettel a keze alatt. Ha az a szíve volt, megeszem a kalapomat.” Felnézett az égre. „Hozza magával az esernyőjét. És figyeljen az órára.”",

  "De notaris": "A közjegyző",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Nincs seb, nincs dulakodás. De nézze az ajkát: kék. És a pupillái kitágultak.” Lievens: „Ez nem a szív, doktor. Ez valami, amit megivott.” Az íróasztalon névtábla áll: E. Brandsma, közjegyző.",
  "Het portglas": "A portóis pohár",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Egy pohár, félig üresen, alján üledék. Lievens megszagolja. „Portói. És alatta valami keserű. Gyűszűvirág, Hoekstra. Digitálisz. Egy szívbetegnek orvosság, egy egészséges embernek méreg.” A portóis üveg a tálalószekrényen áll, érintetlenül, mióta a szolgálólány odatette.",
  "De pendule": "Az ingaóra",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "A kandallópárkányon álló ingaóra tíz perccel éjfél előtt megállt. Lievens felemeli: a párkány porában egy téglalap látszik, egy hüvelyknyire az óra talpától. „Felemelték és visszatették. Az ingaóra pedig, ha felemelik, megáll. Ki akarja elhitetni velünk, hogy tíz perccel éjfél előtt halt meg, Hoekstra? Valaki, akinek tíz perccel éjfél előtt jó alibije van.”",
  "De kaars": "A gyertya",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Gyertya az íróasztalon, hüvelyknyi csonkká égve. Griet azt mondja, fél tízkor gyújtott új gyertyát, amikor felvitte a portóit; egy ilyen gyertya négy órán át ég. „Akkor egy órája égett, amikor a keze ráesett és eloltotta” – mondja Lievens. „Tíz és tizenegy óra között halt meg, nem tíz perccel éjfél előtt. Az óra hazudik.”",
  "Het testament": "A végrendelet",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Friss végrendelet, tegnap írták alá, és még nem helyezték letétbe az irodában: mindent „feleségemre, Cornelia Brandsma-de Witre” és a Burgerweeshuisra, a városi árvaházra hagy. A régi végrendelet, amely áthúzva fekszik mellette, csak egyetlen örököst nevezett meg: „unokaöcsémet és írnokomat, Reiniert”. Lievens: „Aki tegnap elveszítette az örökségét, Hoekstra, annak ma indítéka van.”",
  "Een brief": "Egy levél",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Levél a Veenstra & Co. hajózási társaságtól, aláírója D. Veenstra: „Könyörgöm, halassza el az adósságot tavaszig. Ne kergessen kétségbeesett tettekbe.” Hoekstra: „Fenyegetés!” Lievens: „Egy ember, aki könyörög, doktor. Aki pedig könyörög, az nem mérgezi meg még aznap este azt az egyetlent, aki haladékot adhat neki.”",
  "Het raam": "Az ablak",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Az ablak belülről be van reteszelve; a retesz beragadt a festéktől és a portól. Erre senki sem jött be. „Aki tette, doktor, az ajtón jött. Aki pedig az ajtón jött, az már a házban volt.”",
  "De prullenmand": "A papírkosár",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Egy összegyűrt cédula: „Bácsikám, még ma este beszélnem kell önnel a végrendeletről. R.” A tinta minden sor bal oldalán elkenődött. Lievens: „Balkezes írta, még nedves tollal. Nemsokára figyeljen a kezekre, Hoekstra.”",
  "De briefopener": "A levélbontó kés",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Ezüst levélbontó kés, tisztán, a helyén. „Nem használták” – mondja Lievens, fel sem nézve. „A méregkeverőnek nincs szüksége késre.”",
  "De keuken": "A konyha",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Lent, a ház hátsó részében. Tűzhely, pohártartó, a házvezetőnő szekrénye és a hátsó ajtó a sikátorra.",
  "Het medicijnkastje": "A gyógyszeres szekrényke",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Griet Jansennek, a házvezetőnőnek a szekrénykéje a szívcseppjeivel: egy üvegcse digitálisztinktúra a patikából, a múlt héten töltötték, most majdnem üres. A hozzá tartozó pipetta hiányzik. Griet: „Napi öt cseppet veszek be, uram. Nem fél üveggel.”",
  "Het glazenrek": "A pohártartó",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet fél tízkor felvitt egy pohár portóit, mint minden este. A tartóban áll egy második portóis pohár, elmosva és visszatéve, de belül még nedves. Lievens: „Éjfélkor még nedves. Valaki vele ivott, Hoekstra, és utána elmosta a poharát. Egy vendég nem mossa el a poharát. Egy házbeli igen.”",
  "De achterdeur": "A hátsó ajtó",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet minden este tízkor bereteszeli a hátsó ajtót, utána a bejáratit; tegnap éjjel sem volt másként. „És Veenstra úr?” „Ő kilenckor ment el, uram, a bejárati ajtón. Magam kísértem ki; egy ilyen nagydarab, ilyen vörös szakállú embert nem felejt el az ember.” Tíz óra után tehát senki sem volt a házban, csak a család és jómagam.",
  "Het huishoudboek": "A háztartási könyv",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griet háztartási könyve: „Nov. 9. A nagyságos asszony a Stadsschouwburgba, Carmen, a Van Eeghen hölgyekkel. Kocsi fél egyre rendelve.” Lievens: „A nagyságos asszony tizenkét és egy óra között ért haza. Ha az óra pontos lett volna, ő is lehetett volna. De az óra hazudik.”",
  "Het fornuis": "A tűzhely",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "A tűzhely hideg; a konyhát tizenegy óra óta nem használták. Itt nem történt semmi.",
  "De gang en de kapstok": "A folyosó és a fogas",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Az emeleti folyosó a dolgozószoba és a hálószobák között. Fogas kabátokkal, esernyőtartó, az unokaöcs szobájának ajtaja.",
  "De overjas aan de haak": "A kabát a fogason",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Az unokaöcs, Reinier kabátja. A belső zsebben: egy gumipumpás üvegpipetta, Griet üvegcséjének pipettája. A jobb kabátujján portóifolt. „Bal kézzel töltött” – mondja Lievens –, „és a jobbjára löttyintett. Egy balkezes, tintás ujjakkal és pipettával a zsebében. Hoekstra, azt hiszem, végeztünk.”",
  "De schoenen bij de deur": "A cipők az ajtónál",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Három pár cipő, mind száraz; egész éjjel esett. Ebből a házból éjjel senki sem járt kint. Csak a nagyságos asszony estélyi cipője áll vizesen a bejárati ajtónál: ő az operából jött.",
  "Een operaprogramma": "Egy operaműsor",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Az asztalkán: a Carmen műsorfüzete, Stadsschouwburg, november 9., kezdés nyolckor, benne a nagyságos asszony belépőjegye. Hoekstra: „Alibi éjfél utánig.” Lievens: „Alibi arra az időre, amikor tíz perc híján éjfél volt. Nem arra, amelyet a gyertya mutat.”",
  "De kamer van de neef": "Az unokaöcs szobája",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, az unokaöcs, a házban lakik. Azt mondja, tízkor lefeküdt, és semmit sem hallott. Balkezes: a bal mutatóujján tinta van. Hoekstra megkérdezi, féltékeny volt-e a nagynénjére. „Féltékeny?” – mondja Lievens. „Nem. Kitagadott.”",
  "De paraplubak": "Az esernyőtartó",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Egy csöpögő esernyő: Hoekstra doktoré. „Mondtam, hogy hozza magával” – mondja Lievens elégedetten.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens rágyújtott a pipájára. „Az unokaöcs volt, Hoekstra. Reinier tegnap elolvasta az új végrendeletet, és látta, hogy semmit sem fog örökölni. Írt a nagybátyjának egy cédulát, tíz óra után bement a dolgozószobába egy második pohárral, és mindkettőjüknek töltött portóit: a magáét tisztán, a nagybátyjáét Griet szívcseppjeinek fél üvegével. A digitálisz megállítja a szívet. A háziorvos lát egy öregembert az íróasztalánál, és azt gondolja: a szíve. Majdnem igaza volt.”",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Aztán elmosta a poharát, úgy állította be az ingaórát, hogy tíz perc híján éjfélt mutasson, és lefeküdt. Tíz perccel éjfél előtt ugyanis már egy órája aludt, a nagynénje pedig még a színházban volt. Takaros alibi egy olyan időpontra, amikor senki sem halt meg. Megfeledkezett a gyertyáról. És megfeledkezett arról, hogy a pipetta nem a belső zsebbe való.”",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "A rendőrség egy órakor vitte el Reinier Brandsmát. Az árvaház megkapta a pénzét. Én pedig, aki majdnem ottfelejtettem az esernyőmet, mindezt leírtam.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Era una piovosa mattina di novembre del 1908 quando la domestica del notaio Everhardus Brandsma si presentò alla nostra porta, sul Keizersgracht. «Il notaio è morto, dottore. Nel suo studio, alla scrivania. Il medico di famiglia dice: il cuore. Ma la signora Jansen, la governante, dice che qualcosa non torna, e mi ha mandata dal signor Lievens.»",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens aveva già indossato il cappotto. «Un notaio che muore la sera alla sua scrivania, Hoekstra, con un testamento appena firmato sotto la mano. Se è stato il cuore, mi mangio il cappello.» Alzò gli occhi al cielo. «Prenda l'ombrello. E faccia attenzione all'orologio.»",

  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Un'alta stanza che dà sul canale. Libri fino al soffitto, una scrivania accanto alla finestra, una mensola di camino con un orologio a pendolo. Il notaio è ancora seduto nella sua poltrona.",

  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: «Nessuna ferita, nessuna colluttazione. Ma guardi le labbra: blu. E le pupille sono dilatate.» Lievens: «Questo non è il cuore, dottore. È qualcosa che ha bevuto.» Sulla scrivania c'è una targhetta: E. Brandsma, notaio.",
  "Het portglas": "Il bicchiere di porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Un bicchiere mezzo vuoto, con un deposito sul fondo. Lievens lo annusa. «Porto. E sotto, qualcosa di amaro. Digitale purpurea, Hoekstra. Digitalina. Per un malato di cuore una medicina, per un uomo sano un veleno.» La bottiglia di porto è sulla credenza, intatta da quando la domestica ve l'ha posata.",
  "De pendule": "L'orologio a pendolo",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "L'orologio a pendolo sulla mensola del camino è fermo a mezzanotte meno dieci. Lievens lo solleva: nella polvere della mensola si vede un rettangolo, spostato di un pollice rispetto al piede. «È stato sollevato e rimesso a posto. E un orologio a pendolo che si solleva si ferma. Chi vuole farci credere che sia morto a mezzanotte meno dieci, Hoekstra? Qualcuno che a mezzanotte meno dieci ha un buon alibi.»",
  "De kaars": "La candela",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Una candela sulla scrivania, consumata fino a un mozzicone di un pollice. Griet dice di averne accesa una nuova alle nove e mezza, quando servì il porto; una candela così dura quattro ore. «Allora bruciava da un'ora quando la sua mano vi cadde sopra e la spense», dice Lievens. «È morto tra le dieci e le undici, non a mezzanotte meno dieci. L'orologio mente.»",
  "Het testament": "Il testamento",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Un testamento nuovo, firmato ieri e non ancora depositato in ufficio: tutto «a mia moglie Cornelia Brandsma-de Wit» e al Burgerweeshuis, l'orfanotrofio cittadino. Il vecchio testamento, lì accanto e cancellato con un tratto di penna, nominava un solo erede: «mio nipote e scrivano Reinier». Lievens: «Un uomo diseredato ieri, Hoekstra, oggi ha un motivo.»",
  "Een brief": "Una lettera",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Una lettera della compagnia di navigazione Veenstra & Co., firmata D. Veenstra: «La supplico di concedermi una proroga del debito fino alla primavera. Non mi spinga a gesti disperati.» Hoekstra: «Una minaccia!» Lievens: «Un uomo che supplica, dottore. E un uomo che supplica non avvelena, quella sera stessa, l'unico che può concedergli una proroga.»",
  "Het raam": "La finestra",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "La finestra è sprangata dall'interno; il chiavistello è bloccato da vernice e polvere. Di qui non è passato nessuno. «Chi l'ha fatto, dottore, è entrato dalla porta. E chi è entrato dalla porta era già in casa.»",
  "De prullenmand": "Il cestino della carta",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Un biglietto accartocciato: «Zio, devo parlarle ancora stasera del testamento. R.» L'inchiostro è sbavato sul lato sinistro di ogni riga. Lievens: «Scritto da un mancino, con una penna ancora bagnata. Più tardi guardi le mani, Hoekstra.»",
  "De briefopener": "Il tagliacarte",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Un tagliacarte d'argento, pulito e al suo posto. «Non è stato usato», dice Lievens senza alzare lo sguardo. «A un avvelenatore non serve un coltello.»",
  "De keuken": "La cucina",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Al pianterreno, sul retro della casa. Un fornello, una rastrelliera di bicchieri, l'armadio della governante e la porta di servizio che dà sul vicolo.",
  "Het medicijnkastje": "L'armadietto dei medicinali",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "L'armadietto di Griet Jansen, la governante, con le sue gocce per il cuore: una boccetta di tintura di digitalina della farmacia, riempita la settimana scorsa e ora quasi vuota. Manca la pipetta che l'accompagna. Griet: «Ne prendo cinque gocce al giorno, signore. Non mezza boccetta.»",
  "Het glazenrek": "La rastrelliera",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Alle nove e mezza Griet portò di sopra un solo bicchiere di porto, come ogni sera. Nella rastrelliera c'è un secondo bicchiere da porto, lavato e rimesso a posto, ma ancora bagnato all'interno. Lievens: «Ancora bagnato a mezzanotte. Qualcuno ha bevuto con lui, Hoekstra, e poi ha lavato il proprio bicchiere. Un ospite non lava il suo bicchiere. Uno di casa sì.»",
  "De achterdeur": "La porta di servizio",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet sbarra la porta di servizio ogni sera alle dieci, e dopo quella d'ingresso; stanotte non è stato diverso. «E il signor Veenstra?» «Se n'è andato alle nove, signore, dalla porta d'ingresso. L'ho accompagnato io; un omone così, con una barba così rossa, non si dimentica.» Dopo le dieci, dunque, in casa non c'era nessuno se non la famiglia e io.",
  "Het huishoudboek": "Il libro dei conti",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Il libro dei conti di Griet: «9 nov. La signora allo Stadsschouwburg, Carmen, con le signore Van Eeghen. Carrozza ordinata per mezzanotte e mezza.» Lievens: «La signora è rientrata tra mezzanotte e l'una. Se l'orologio fosse giusto, potrebbe essere stata lei. Ma l'orologio mente.»",
  "Het fornuis": "Il fornello",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Il fornello è freddo; la cucina non è stata usata dalle undici. Qui non è successo niente.",
  "De gang en de kapstok": "Il corridoio e l'attaccapanni",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Il corridoio di sopra, tra lo studio e le camere da letto. Un attaccapanni con dei cappotti, un portaombrelli, la porta della camera del nipote.",
  "De overjas aan de haak": "Il soprabito appeso",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Il soprabito del nipote, Reinier. Nella tasca interna: una pipetta di vetro con una pompetta di gomma, la pipetta della boccetta di Griet. Sulla manica destra, una macchia di porto. «Ha versato con la sinistra», dice Lievens, «e si è macchiato a destra. Un mancino con l'inchiostro sulle dita e una pipetta in tasca. Hoekstra, credo che abbiamo finito.»",
  "De schoenen bij de deur": "Le scarpe accanto alla porta",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tre paia di scarpe, tutte asciutte; ha piovuto tutta la notte. Nessuno di questa casa è uscito stanotte. Solo le scarpette da sera della signora sono bagnate accanto alla porta d'ingresso: tornava dall'opera.",
  "Een operaprogramma": "Un programma d'opera",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Sul tavolino: il programma di Carmen, Stadsschouwburg, 9 novembre, inizio alle otto, con dentro il biglietto della signora. Hoekstra: «Un alibi fino a dopo mezzanotte.» Lievens: «Un alibi per mezzanotte meno dieci. Non per l'ora che indica la candela.»",
  "De kamer van de neef": "La camera del nipote",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, il nipote, dorme in casa. Dice di essere andato a letto alle dieci e di non aver sentito nulla. È mancino: ha dell'inchiostro sull'indice sinistro. Hoekstra chiede se fosse geloso della zia. «Geloso?» dice Lievens. «No. Diseredato.»",
  "De paraplubak": "Il portaombrelli",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Un ombrello gocciolante: quello del dottor Hoekstra. «Le avevo detto di portarlo», dice Lievens soddisfatto.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens accese la pipa. «È stato il nipote, Hoekstra. Ieri Reinier ha letto il nuovo testamento e ha visto che non avrebbe più ereditato nulla. Ha scritto un biglietto allo zio, è entrato nello studio dopo le dieci con un secondo bicchiere e ha versato del porto a entrambi: il suo pulito, quello dello zio con mezza boccetta delle gocce per il cuore di Griet. La digitalina ferma un cuore. Un medico di famiglia vede un vecchio alla sua scrivania e pensa: il cuore. Aveva quasi ragione.»",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "«Poi ha lavato il suo bicchiere, ha messo l'orologio su mezzanotte meno dieci ed è andato a letto. A mezzanotte meno dieci, dopotutto, dormiva già da un'ora, e la zia era ancora a teatro. Un alibi impeccabile per un'ora in cui non è morto nessuno. Ha dimenticato la candela. E ha dimenticato che una pipetta non sta in una tasca interna.»",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "La polizia venne a prendere Reinier Brandsma all'una. L'orfanotrofio ebbe il suo denaro. E io, che per poco non avevo dimenticato l'ombrello, misi tutto per iscritto.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Buvo drėgnas 1908-ųjų lapkričio rytas, kai notaro Everharduso Brandsmos tarnaitė stovėjo ant mūsų namo laiptų prie Keizersgracht kanalo. „Notaras mirė, daktare. Savo kabinete, prie rašomojo stalo. Šeimos gydytojas sako: širdis. Bet ponia Jansen, ekonomė, sako, kad kažkas čia ne taip, ir ji atsiuntė mane pas poną Lievensą.“",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievensas jau buvo apsivilkęs paltą. „Notaras, kuris vakare miršta prie savo rašomojo stalo, Hoekstra, su šviežiu testamentu po ranka. Jei tai buvo širdis, suvalgysiu savo skrybėlę.“ Jis pažvelgė į dangų. „Pasiimkite skėtį. Ir atkreipkite dėmesį į laikrodį.“",
