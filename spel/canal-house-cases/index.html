  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Ο δράστης: {dader}. Το θύμα: {slachtoffer}. Το δηλητήριο: {gif}. Το ποτό όπου το έριξε: {drank}. Ο τόπος: {plaats}. Η ώρα: {tijd}. Το κίνητρο: {reden}. Έπειτα, για να παραποιήσει την ώρα του θανάτου, ο δράστης ξανάβαλε κάτι στη θέση του: {ding}.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "ένας ηλικιωμένος κύριος με γκρίζες φαβορίτες και γυαλιά ανάγνωσης",
  "een dame van achter in de dertig in een avondjurk met parels": "μια κυρία λίγο πριν από τα σαράντα, με βραδινή τουαλέτα και μαργαριτάρια",
  "een jongeman met inkt aan zijn linkerhand": "ένας νεαρός με μελάνι στο αριστερό του χέρι",
  "een zware man met een rode baard": "ένας εύσωμος άντρας με κόκκινα γένια",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "μια ηλικιωμένη γυναίκα με μια αρμαθιά κλειδιά στην ποδιά της",
  "een man met een dokterstas en een natte paraplu": "ένας άντρας με ιατρική τσάντα και βρεγμένη ομπρέλα",
  "De studeerkamer": "Το σπουδαστήριο",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Ένα ψηλοτάβανο δωμάτιο που βλέπει στο κανάλι. Βιβλία ως το ταβάνι, ένα γραφείο δίπλα στο παράθυρο, ένα τζάκι με ένα ρολόι πάνω στο ράφι του. Ο συμβολαιογράφος κάθεται ακόμη στην καρέκλα του.",
  "De notaris": "Ο συμβολαιογράφος",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Χούκστρα: «Καμία πληγή, κανένα ίχνος πάλης. Κοιτάξτε όμως τα χείλη: μπλε. Και οι κόρες των ματιών είναι διεσταλμένες.» Λίβενς: «Αυτό δεν είναι η καρδιά, γιατρέ. Είναι κάτι που ήπιε.» Πάνω στο γραφείο υπάρχει ένα πινακίδιο με το όνομα: Ε. Μπράντσμα, συμβολαιογράφος.",
  "Het portglas": "Το ποτήρι του πόρτο",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Ένα ποτήρι, μισοάδειο, με κατακάθι στον πάτο. Ο Λίβενς το μυρίζει. «Πόρτο. Κι από κάτω κάτι πικρό. Δακτυλίτιδα, Χούκστρα· digitalis, όπως τη λένε οι γιατροί. Σε έναν καρδιοπαθή φάρμακο, σε έναν υγιή άνθρωπο δηλητήριο.» Το μπουκάλι με το πόρτο βρίσκεται στον μπουφέ, ανέγγιχτο από τη στιγμή που το άφησε εκεί η υπηρέτρια.",
  "De pendule": "Το ρολόι του τζακιού",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Το ρολόι πάνω στο τζάκι έχει σταματήσει στις δώδεκα παρά δέκα. Ο Λίβενς το σηκώνει: στη σκόνη του ραφιού διακρίνεται ένα ορθογώνιο, ένα δάχτυλο δίπλα από τη βάση του. «Το σήκωσαν και το ξανάβαλαν στη θέση του. Κι ένα ρολόι με εκκρεμές, όταν το σηκώσεις, σταματά. Ποιος θέλει να πιστέψουμε ότι πέθανε στις δώδεκα παρά δέκα, Χούκστρα; Κάποιος που για τις δώδεκα παρά δέκα έχει καλό άλλοθι.»",
  "De kaars": "Το κερί",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Ένα κερί πάνω στο γραφείο, καμένο ως ένα κομματάκι μήκους ενός δαχτύλου. Η Χριτ λέει ότι άναψε ένα καινούργιο κερί στις εννιάμισι, όταν έφερε το πόρτο· ένα τέτοιο κερί καίει τέσσερις ώρες. «Είχε λοιπόν καεί μία ώρα, όταν το χέρι του έπεσε πάνω του και το έσβησε», λέει ο Λίβενς. «Πέθανε μεταξύ δέκα και έντεκα, όχι στις δώδεκα παρά δέκα. Το ρολόι λέει ψέματα.»",
  "Het testament": "Η διαθήκη",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Μια καινούργια διαθήκη, υπογεγραμμένη χθες και όχι ακόμη κατατεθειμένη στο γραφείο: τα πάντα στη «σύζυγό μου Κορνέλια Μπράντσμα-ντε Βιτ» και στο Μπούρχερβεϊσχάους, το ορφανοτροφείο της πόλης. Η παλιά διαθήκη, που βρίσκεται δίπλα, διαγραμμένη με μια γραμμή, όριζε έναν μόνο κληρονόμο: «τον ανιψιό και υπάλληλό μου Ράινιρ». Λίβενς: «Ένας άνθρωπος που αποκληρώθηκε χθες, Χούκστρα, έχει σήμερα κίνητρο.»",
  "Een brief": "Μια επιστολή",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Μια επιστολή από τη ναυτιλιακή εταιρεία Φέενστρα & Σία, με την υπογραφή Ντ. Φέενστρα: «Σας ικετεύω να αναβάλετε το χρέος ως την άνοιξη. Μη με σπρώξετε σε απονενοημένες πράξεις.» Χούκστρα: «Απειλή!» Λίβενς: «Ένας άνθρωπος που ικετεύει, γιατρέ. Κι ένας άνθρωπος που ικετεύει δεν δηλητηριάζει το ίδιο βράδυ τον μόνο που μπορεί να του δώσει αναβολή.»",
  "Het raam": "Το παράθυρο",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Το παράθυρο είναι αμπαρωμένο από μέσα· ο σύρτης έχει κολλήσει από μπογιά και σκόνη. Κανείς δεν μπήκε από εδώ. «Όποιος το έκανε, γιατρέ, ήρθε από την πόρτα. Κι όποιος ήρθε από την πόρτα, ήταν μέσα στο σπίτι.»",
  "De prullenmand": "Το καλάθι των αχρήστων",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Ένα τσαλακωμένο σημείωμα: «Θείε, πρέπει να σας μιλήσω απόψε για τη διαθήκη. Ρ.» Το μελάνι είναι μουτζουρωμένο στην αριστερή άκρη κάθε γραμμής. Λίβενς: «Γραμμένο από αριστερόχειρα, με πένα που ήταν ακόμη νωπή. Σε λίγο κοιτάξτε τα χέρια, Χούκστρα.»",
  "De briefopener": "Ο χαρτοκόπτης",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Ένας ασημένιος χαρτοκόπτης, καθαρός και στη θέση του. «Δεν χρησιμοποιήθηκε», λέει ο Λίβενς χωρίς να σηκώσει το βλέμμα. «Ένας δηλητηριαστής δεν χρειάζεται μαχαίρι.»",
  "De keuken": "Η κουζίνα",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Κάτω, στο πίσω μέρος του σπιτιού. Μια εστία για το μαγείρεμα, μια ραφιέρα με ποτήρια, το ντουλάπι της οικονόμου και η πίσω πόρτα προς το σοκάκι.",
  "Het medicijnkastje": "Το φαρμακοντούλαπο",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Το ντουλαπάκι της Χριτ Γιάνσεν, της οικονόμου, με τις σταγόνες της για την καρδιά: ένα μπουκαλάκι βάμμα δακτυλίτιδας από το φαρμακείο, γεμισμένο την περασμένη εβδομάδα, τώρα σχεδόν άδειο. Το σταγονόμετρο που πάει μαζί του λείπει. Χριτ: «Παίρνω πέντε σταγόνες τη μέρα, κύριε. Όχι μισό μπουκαλάκι.»",
  "Het glazenrek": "Η ραφιέρα με τα ποτήρια",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Στις εννιάμισι η Χριτ ανέβασε ένα ποτήρι πόρτο, όπως κάθε βράδυ. Στη ραφιέρα βρίσκεται ένα δεύτερο ποτήρι του πόρτο, πλυμένο και βαλμένο πίσω στη θέση του, όμως ακόμη βρεγμένο από μέσα. Λίβενς: «Ακόμη βρεγμένο τα μεσάνυχτα. Κάποιος έπινε μαζί του, Χούκστρα, κι ύστερα έπλυνε το ποτήρι του. Ένας επισκέπτης δεν πλένει το ποτήρι του. Κάποιος του σπιτιού, ναι.»",
  "De achterdeur": "Η πίσω πόρτα",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Η Χριτ αμπαρώνει την πίσω πόρτα κάθε βράδυ στις δέκα και την εξώπορτα αμέσως μετά· χθες βράδυ δεν έγινε αλλιώς. «Κι ο κύριος Φέενστρα;» «Έφυγε στις εννιά, κύριε, από την εξώπορτα. Τον ξεπροβόδισα η ίδια· έναν τόσο μεγαλόσωμο άντρα με τέτοια κόκκινα γένια δεν τον ξεχνάς.» Μετά τις δέκα, λοιπόν, δεν ήταν κανείς στο σπίτι εκτός από την οικογένεια κι εμένα.",
  "Het huishoudboek": "Το βιβλίο του νοικοκυριού",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Το βιβλίο του νοικοκυριού της Χριτ: «9 Νοεμ. Η κυρία στο Στατσχάουμπουρχ, “Κάρμεν”, με τις κυρίες Φαν Έχεν. Άμαξα παραγγελμένη για τις δωδεκάμισι.» Λίβενς: «Η κυρία γύρισε σπίτι μεταξύ δώδεκα και μίας. Αν το ρολόι ήταν σωστό, θα μπορούσε να ήταν εκείνη. Όμως το ρολόι λέει ψέματα.»",
  "Het fornuis": "Η εστία",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Η εστία είναι κρύα· η κουζίνα δεν έχει χρησιμοποιηθεί από τις έντεκα. Εδώ δεν συνέβη τίποτα.",
  "De gang en de kapstok": "Ο διάδρομος και η κρεμάστρα",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Ο διάδρομος του επάνω ορόφου, ανάμεσα στο σπουδαστήριο και στις κρεβατοκάμαρες. Μια κρεμάστρα με παλτά, μια ομπρελοθήκη, η πόρτα προς το δωμάτιο του ανιψιού.",
  "De overjas aan de haak": "Το πανωφόρι στον γάντζο",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Το παλτό του ανιψιού, του Ράινιρ. Στην εσωτερική τσέπη: ένα γυάλινο σταγονόμετρο με λαστιχένιο πουάρ, το σταγονόμετρο από το μπουκαλάκι της Χριτ. Στο δεξί μανίκι ένας λεκές από πόρτο. «Σέρβιρε με το αριστερό», λέει ο Λίβενς, «και λέκιασε το δεξί. Ένας αριστερόχειρας με μελάνι στα δάχτυλα κι ένα σταγονόμετρο στην τσέπη. Χούκστρα, πιστεύω πως τελειώσαμε.»",
  "De schoenen bij de deur": "Τα παπούτσια δίπλα στην πόρτα",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Τρία ζευγάρια παπούτσια, όλα στεγνά· έβρεχε όλη τη νύχτα. Κανείς από αυτό το σπίτι δεν βγήκε έξω χθες βράδυ. Μόνο τα βραδινά παπούτσια της κυρίας είναι βρεγμένα, δίπλα στην εξώπορτα: εκείνη γύρισε από την όπερα.",
  "Een operaprogramma": "Ένα πρόγραμμα της όπερας",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Πάνω στο τραπεζάκι: το πρόγραμμα της «Κάρμεν», Στατσχάουμπουρχ, 9 Νοεμβρίου, έναρξη στις οκτώ, με το εισιτήριο της κυρίας μέσα. Χούκστρα: «Άλλοθι ως μετά τα μεσάνυχτα.» Λίβενς: «Άλλοθι για τις δώδεκα παρά δέκα. Όχι για την ώρα που δείχνει το κερί.»",
  "De kamer van de neef": "Το δωμάτιο του ανιψιού",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Ο Ράινιρ Μπράντσμα, ο ανιψιός, μένει στο σπίτι. Λέει ότι πήγε για ύπνο στις δέκα και δεν άκουσε τίποτα. Είναι αριστερόχειρας: έχει μελάνι στον αριστερό του δείκτη. Ο Χούκστρα ρωτά αν τον έτρωγε η ζήλια για τη θεία του. «Ζήλια;» λέει ο Λίβενς. «Όχι. Αποκλήρωση.»",
  "De paraplubak": "Η ομπρελοθήκη",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Μια ομπρέλα που στάζει: του γιατρού Χούκστρα. «Σας είχα πει να την πάρετε μαζί σας», λέει ο Λίβενς ικανοποιημένος.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Ο Λίβενς άναψε την πίπα του. «Ήταν ο ανιψιός, Χούκστρα. Χθες ο Ράινιρ διάβασε την καινούργια διαθήκη και είδε ότι δεν θα κληρονομούσε πια τίποτα. Έγραψε στον θείο του ένα σημείωμα, μπήκε μετά τις δέκα στο σπουδαστήριο μ' ένα δεύτερο ποτήρι και έβαλε πόρτο και στους δύο: το δικό του καθαρό, του θείου του με μισό μπουκαλάκι από τις σταγόνες της Χριτ για την καρδιά. Η δακτυλίτιδα σταματά την καρδιά. Ένας οικογενειακός γιατρός βλέπει έναν ηλικιωμένο στο γραφείο του και σκέφτεται: η καρδιά. Παραλίγο να είχε δίκιο.»",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "«Ύστερα έπλυνε το ποτήρι του, γύρισε το ρολόι του τζακιού στις δώδεκα παρά δέκα και πήγε για ύπνο. Στις δώδεκα παρά δέκα, άλλωστε, κοιμόταν ήδη μία ώρα, κι η θεία του βρισκόταν ακόμη στο θέατρο. Ένα άψογο άλλοθι για μια ώρα κατά την οποία δεν πέθανε κανείς. Ξέχασε το κερί. Και ξέχασε ότι ένα σταγονόμετρο δεν έχει θέση σε μια εσωτερική τσέπη.»",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Η αστυνομία ήρθε να πάρει τον Ράινιρ Μπράντσμα στη μία. Το ορφανοτροφείο πήρε τα χρήματά του. Κι εγώ, που λίγο έλειψε να ξεχάσω την ομπρέλα μου, τα κατέγραψα όλα.",
});

  "Bekijk de scènes, tik op wat je opvalt, verzamel woorden en vul het dossier in. Geen tijdsdruk: een goede speurder leest alles twee keer.": "Study the scenes, tap whatever strikes you, collect words and complete the dossier. No time pressure: a good detective reads everything twice.",

  "Amsterdam": "Amsterdam",
  "Uit de aantekeningen van dokter Bram Hoekstra.": "From the notes of Dr Bram Hoekstra.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "It was a wet November morning in 1908 when the maid of the notary Everhardus Brandsma stood on our doorstep on the Keizersgracht. \"The notary is dead, Doctor. In his study, at his desk. The family doctor says: the heart. But Mrs Jansen, the housekeeper, says it isn't right, and she has sent me to Mr Lievens.\"",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens already had his coat on. \"A notary who dies at his desk in the evening, Hoekstra, with a fresh will under his hand. If that was the heart, I shall eat my hat.\" He looked up at the sky. \"Take your umbrella. And mind the clock.\"",
  "Reinier Brandsma": "Reinier Brandsma",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "{dader} poisoned {slachtoffer} with {gif} in {drank}, in {plaats}, between {tijd} o'clock, because of {reden}. Afterwards the murderer put {ding} back to falsify the time of death.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "an elderly gentleman with grey side-whiskers and reading spectacles",
  "een dame van achter in de dertig in een avondjurk met parels": "a lady in her late thirties in an evening gown with pearls",
  "een jongeman met inkt aan zijn linkerhand": "a young man with ink on his left hand",
  "een zware man met een rode baard": "a heavy man with a red beard",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "an elderly woman with a bunch of keys at her apron",
  "een man met een dokterstas en een natte paraplu": "a man with a doctor's bag and a wet umbrella",
  "De studeerkamer": "The study",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "A tall room on the canal. Books up to the ceiling, a desk by the window, a mantelpiece with a mantel clock. The notary is still sitting in his chair.",
  "De notaris": "The notary",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: \"No wound, no struggle. But look at the lips: blue. And the pupils are dilated.\" Lievens: \"That is not the heart, Doctor. That is something he drank.\" On the desk stands a nameplate: E. Brandsma, notary.",
  "Het portglas": "The port glass",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "A glass, half empty, with sediment at the bottom. Lievens sniffs it. \"Port. And something bitter beneath it. Foxglove, Hoekstra. Digitalis. In a heart patient a medicine, in a healthy man a poison.\" The bottle of port stands on the sideboard, untouched since the maid set it down.",
  "De pendule": "The mantel clock",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "The mantel clock on the chimneypiece has stopped at ten to twelve. Lievens lifts it: in the dust on the mantel there is a rectangle, a thumb's breadth beside its foot. \"It has been lifted and put back. And a pendulum clock that is lifted stops. Who wants us to believe that he died at ten to twelve, Hoekstra? Someone who has a good alibi for ten to twelve.\"",
  "De kaars": "The candle",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "A candle on the desk, burnt down to a stub the length of a thumb. Griet says she lit a fresh candle at half past nine when she brought the port; a candle like that burns for four hours. \"Then it had burned for an hour when his hand fell on it and put it out,\" says Lievens. \"He died between ten and eleven, not at ten to twelve. The clock lies.\"",
  "Het testament": "The will",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "A fresh will, signed yesterday and not yet deposited at the office: everything to \"my wife Cornelia Brandsma-de Wit\" and to the Burgerweeshuis, the city orphanage. The old will, lying beside it with a line struck through it, named only one heir: \"my nephew and clerk Reinier.\" Lievens: \"A man who was disinherited yesterday, Hoekstra, has a reason today.\"",
  "Een brief": "A letter",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "A letter from the shipping firm Veenstra & Co., signed D. Veenstra: \"I beg you to defer the debt until the spring. Do not drive me to desperate deeds.\" Hoekstra: \"A threat!\" Lievens: \"A man who begs, Doctor. And a man who begs does not, that same evening, poison the only person who can grant him time.\"",
  "Het raam": "The window",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "The window is bolted from the inside; the bolt is stuck fast with paint and dust. No one came in this way. \"Whoever did it, Doctor, came through the door. And whoever came through the door was already in the house.\"",
  "De prullenmand": "The wastepaper basket",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "A crumpled note: \"Uncle, I must speak to you tonight about the will. R.\" The ink is smudged on the left side of every line. Lievens: \"Written by a left-handed man, with a pen that was still wet. Watch people's hands presently, Hoekstra.\"",
  "De briefopener": "The paper knife",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "A silver paper knife, clean and in its place. \"Not used,\" says Lievens without looking up. \"A poisoner has no need of a knife.\"",
  "De keuken": "The kitchen",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Downstairs, at the back of the house. A range, a rack of glasses, the housekeeper's cupboard and the back door to the alley.",
  "Het medicijnkastje": "The medicine cabinet",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "The cabinet of Griet Jansen, the housekeeper, with her heart drops: a little bottle of digitalis tincture from the chemist, filled last week, now nearly empty. The pipette that belongs with it is missing. Griet: \"I take five drops a day, sir. Not half a bottle.\"",
  "Het glazenrek": "The glass rack",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "At half past nine Griet took one glass of port upstairs, as she did every evening. In the rack stands a second port glass, washed and put back, but still wet inside. Lievens: \"Still wet at midnight. Someone drank with him, Hoekstra, and washed his glass afterwards. A guest does not wash his glass. Someone of the household does.\"",
  "De achterdeur": "The back door",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet bolts the back door every evening at ten o'clock and the front door after it; last night was no different. \"And Mr Veenstra?\" \"He left at nine, sir, by the front door. I showed him out myself; you don't forget a big man with a red beard like that.\" So after ten there was no one in the house but the family and myself.",
  "Het huishoudboek": "The household book",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griet's household book: \"9 Nov. Madam to the Stadsschouwburg, Carmen, with the Van Eeghen ladies. Carriage ordered for half past twelve.\" Lievens: \"Madam came home between twelve and one. If the clock were right, it could have been her. But the clock lies.\"",
  "Het fornuis": "The range",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "The range is cold; the kitchen has not been used since eleven o'clock. Nothing happened here.",
  "De gang en de kapstok": "The hallway and the coat rack",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "The upstairs hallway, between the study and the bedrooms. A coat rack with coats, an umbrella stand, the door to the nephew's room.",
  "De overjas aan de haak": "The overcoat on the hook",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "The nephew's coat, Reinier's. In the inside pocket: a glass pipette with a rubber bulb, the pipette from Griet's little bottle. On the right sleeve a stain of port. \"He poured with his left hand,\" says Lievens, \"and spilled on his right. A left-handed man with ink on his fingers and a pipette in his pocket. Hoekstra, I believe we are done.\"",
  "De schoenen bij de deur": "The shoes by the door",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Three pairs of shoes, all dry; it has rained all night. No one from this house went out last night. Only Madam's evening shoes stand wet by the front door: she came from the opera.",
  "Een operaprogramma": "An opera programme",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "On the side table: the programme of Carmen, Stadsschouwburg, 9 November, curtain at eight, with Madam's ticket inside it. Hoekstra: \"An alibi until after midnight.\" Lievens: \"An alibi for ten to twelve. Not for the time the candle tells.\"",
  "De kamer van de neef": "The nephew's room",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, the nephew, sleeps in the house. He says he went to bed at ten and heard nothing. He is left-handed: there is ink on his left forefinger. Hoekstra asks whether he was jealous of his aunt. \"Jealous?\" says Lievens. \"No. Disinherited.\"",
  "De paraplubak": "The umbrella stand",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "A dripping umbrella: Dr Hoekstra's. \"I did tell you to bring it,\" says Lievens, satisfied.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens lit his pipe. \"It was the nephew, Hoekstra. Yesterday Reinier read the new will and saw that he would inherit nothing more. He wrote his uncle a note, came into the study after ten o'clock with a second glass, and poured port for them both: his own clean, his uncle's with half a bottle of Griet's heart drops. Digitalis stops a heart. A family doctor sees an old man at his desk and thinks: the heart. He was very nearly right.\"",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "\"Then he washed his glass, set the mantel clock to ten to twelve, and went to bed. At ten to twelve, after all, he had been asleep for an hour, and his aunt was still at the theatre. A tidy alibi for a time at which nobody died. He forgot the candle. And he forgot that a pipette does not belong in an inside pocket.\"",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "The police came for Reinier Brandsma at one o'clock. The orphanage received his money. And I, who had nearly forgotten my umbrella, wrote it all down.",
});

  "Amsterdam": "Ámsterdam",
  "Uit de aantekeningen van dokter Bram Hoekstra.": "De las notas del doctor Bram Hoekstra.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Era una húmeda mañana de noviembre de 1908 cuando la criada del notario Everhardus Brandsma se presentó a nuestra puerta, en el Keizersgracht. «El notario ha muerto, doctor. En su despacho, sentado a su escritorio. El médico de cabecera dice: el corazón. Pero la señora Jansen, el ama de llaves, dice que algo no cuadra, y me ha enviado a buscar al señor Lievens.»",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens ya se había puesto el abrigo. «Un notario que muere de noche ante su escritorio, Hoekstra, con un testamento recién firmado bajo la mano. Si eso ha sido el corazón, me como el sombrero.» Miró al cielo. «Llévese usted el paraguas. Y fíjese en el reloj.»",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "{dader} envenenó a su víctima, {slachtoffer}, con {gif} en {drank}, en {plaats}, entre {tijd}, por {reden}. Después, el culpable volvió a poner {ding} en su sitio para falsear la hora de la muerte.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "un caballero de edad con patillas grises y lentes de leer",
  "een dame van achter in de dertig in een avondjurk met parels": "una dama de casi cuarenta años, con traje de noche y perlas",
  "een jongeman met inkt aan zijn linkerhand": "un joven con tinta en la mano izquierda",
  "een zware man met een rode baard": "un hombre corpulento de barba roja",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "una mujer entrada en años con un manojo de llaves en el delantal",
  "een man met een dokterstas en een natte paraplu": "un hombre con un maletín de médico y un paraguas mojado",
  "De studeerkamer": "El despacho",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Una estancia de techos altos que da al canal. Libros hasta el techo, un escritorio junto a la ventana, una repisa de chimenea con un reloj de péndulo. El notario sigue sentado en su sillón.",
  "De notaris": "El notario",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: «Ninguna herida, ninguna lucha. Pero mire los labios: azules. Y las pupilas, dilatadas.» Lievens: «Eso no es el corazón, doctor. Es algo que ha bebido.» Sobre el escritorio hay una placa con su nombre: E. Brandsma, notario.",
  "Het portglas": "La copa de oporto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Una copa medio vacía, con poso en el fondo. Lievens la huele. «Oporto. Y algo amargo por debajo. Dedalera, Hoekstra. Digitalina. Para un enfermo del corazón, una medicina; para un hombre sano, un veneno.» La botella de oporto está en el aparador, intacta desde que la criada la dejó allí.",
  "De pendule": "El reloj de la repisa",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "El reloj de la repisa de la chimenea se ha parado en las doce menos diez. Lievens lo levanta: en el polvo de la repisa se ve un rectángulo, a un dedo de su pie. «Lo han levantado y vuelto a dejar. Y un reloj de péndulo que se levanta se para. ¿Quién quiere hacernos creer que murió a las doce menos diez, Hoekstra? Alguien que tiene una buena coartada para las doce menos diez.»",
  "De kaars": "La vela",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Una vela sobre el escritorio, consumida hasta quedar en un cabo del tamaño de un pulgar. Griet dice que encendió una vela nueva a las nueve y media, cuando subió el oporto; una vela así arde cuatro horas. «Entonces llevaba una hora encendida cuando su mano cayó sobre ella y la apagó», dice Lievens. «Murió entre las diez y las once, no a las doce menos diez. El reloj miente.»",
  "Het testament": "El testamento",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Un testamento recién hecho, firmado ayer y aún sin depositar en la notaría: todo «a mi esposa Cornelia Brandsma-de Wit» y al Burgerweeshuis, el orfanato de la ciudad. El testamento antiguo, que está al lado tachado con una raya, nombraba un solo heredero: «mi sobrino y pasante Reinier». Lievens: «Un hombre desheredado ayer, Hoekstra, tiene hoy un motivo.»",
  "Een brief": "Una carta",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Una carta de la naviera Veenstra & Co., firmada por D. Veenstra: «Le suplico que me aplace la deuda hasta la primavera. No me empuje a actos desesperados.» Hoekstra: «¡Una amenaza!» Lievens: «Un hombre que suplica, doctor. Y un hombre que suplica no envenena esa misma noche al único que puede concederle un aplazamiento.»",
  "Het raam": "La ventana",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "La ventana está cerrada por dentro; el pestillo está trabado por la pintura y el polvo. Nadie ha entrado por aquí. «Quien lo hizo, doctor, entró por la puerta. Y quien entró por la puerta estaba ya en la casa.»",
  "De prullenmand": "La papelera",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Una nota arrugada: «Tío, necesito hablarle esta misma noche del testamento. R.» La tinta está corrida en el lado izquierdo de cada línea. Lievens: «Escrito por un zurdo, con una pluma aún húmeda. Dentro de un rato, fíjese en las manos, Hoekstra.»",
  "De briefopener": "El abrecartas",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Un abrecartas de plata, limpio y en su sitio. «No se ha usado», dice Lievens sin levantar la vista. «Un envenenador no necesita cuchillo.»",
  "De keuken": "La cocina",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Abajo, al fondo de la casa. Un fogón, un escurridor con copas, el armario del ama de llaves y la puerta trasera que da al callejón.",
  "Het medicijnkastje": "El botiquín",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "El botiquín de Griet Jansen, el ama de llaves, con sus gotas para el corazón: un frasquito de tintura de digitalina de la botica, llenado la semana pasada y ahora casi vacío. Falta la pipeta que lo acompaña. Griet: «Tomo cinco gotas al día, señor. No medio frasco.»",
  "Het glazenrek": "El escurridor",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "A las nueve y media Griet subió una sola copa de oporto, como todas las noches. En el escurridor hay una segunda copa de oporto, lavada y puesta en su sitio, pero todavía húmeda por dentro. Lievens: «Aún húmeda a medianoche. Alguien bebió con él, Hoekstra, y después lavó su copa. Un invitado no lava su copa. Alguien de la casa, sí.»",
  "De achterdeur": "La puerta trasera",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet echa el cerrojo a la puerta trasera todas las noches a las diez, y después a la principal; anoche no fue distinto. «¿Y el señor Veenstra?» «Se marchó a las nueve, señor, por la puerta principal. Yo misma lo acompañé; a un hombre tan grande y con una barba tan roja no se le olvida.» Así que después de las diez no había en la casa nadie más que la familia y yo.",
  "Het huishoudboek": "El libro de cuentas",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "El libro de cuentas de Griet: «9 nov. La señora al Stadsschouwburg, Carmen, con las damas Van Eeghen. Coche encargado para las doce y media.» Lievens: «La señora volvió a casa entre las doce y la una. Si el reloj estuviera en lo cierto, podría haber sido ella. Pero el reloj miente.»",
  "Het fornuis": "El fogón",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "El fogón está frío; la cocina no se ha usado desde las once. Aquí no ha pasado nada.",
  "De gang en de kapstok": "El pasillo y el perchero",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "El pasillo de arriba, entre el despacho y los dormitorios. Un perchero con abrigos, un paragüero y la puerta del cuarto del sobrino.",
  "De overjas aan de haak": "El gabán colgado",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "El gabán del sobrino, Reinier. En el bolsillo interior: una pipeta de cristal con perilla de goma, la pipeta del frasquito de Griet. En la manga derecha, una mancha de oporto. «Sirvió con la izquierda», dice Lievens, «y se manchó la derecha. Un zurdo con tinta en los dedos y una pipeta en el bolsillo. Hoekstra, creo que hemos terminado.»",
  "De schoenen bij de deur": "Los zapatos junto a la puerta",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tres pares de zapatos, todos secos; ha llovido toda la noche. Nadie de esta casa ha salido esta noche. Solo los zapatos de noche de la señora están mojados junto a la puerta principal: venía de la ópera.",
  "Een operaprogramma": "Un programa de ópera",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Sobre la mesita: el programa de Carmen, Stadsschouwburg, 9 de noviembre, comienzo a las ocho, con la entrada de la señora dentro. Hoekstra: «Una coartada hasta pasada la medianoche.» Lievens: «Una coartada para las doce menos diez. No para la hora que marca la vela.»",
  "De kamer van de neef": "El cuarto del sobrino",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, el sobrino, duerme en la casa. Dice que se acostó a las diez y que no oyó nada. Es zurdo: tiene tinta en el índice izquierdo. Hoekstra le pregunta si tenía celos de su tía. «¿Celos?», dice Lievens. «No. Desheredado.»",
  "De paraplubak": "El paragüero",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Un paraguas que gotea: el del doctor Hoekstra. «Ya le dije que lo trajera», dice Lievens, satisfecho.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens encendió su pipa. «Fue el sobrino, Hoekstra. Ayer Reinier leyó el nuevo testamento y vio que ya no heredaría nada. Escribió una nota a su tío, entró en el despacho pasadas las diez con una segunda copa y les sirvió oporto a los dos: la suya, limpia; la de su tío, con medio frasco de las gotas para el corazón de Griet. La digitalina detiene un corazón. Un médico de cabecera ve a un anciano ante su escritorio y piensa: el corazón. Casi tenía razón.»",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "«Después lavó su copa, puso el reloj en las doce menos diez y se fue a la cama. A las doce menos diez, al fin y al cabo, él llevaba ya una hora dormido, y su tía seguía en el teatro. Una coartada impecable para una hora a la que no murió nadie. Olvidó la vela. Y olvidó que una pipeta no se guarda en un bolsillo interior.»",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "La policía vino a buscar a Reinier Brandsma a la una. El orfanato recibió su dinero. Y yo, que casi había olvidado mi paraguas, lo puse todo por escrito.",
});

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Süüdlane: {dader}. Ohver: {slachtoffer}. Mürk: {gif}, segatuna sellesse joogisse: {drank}. Koht: {plaats}. Aeg: {tijd}. Motiiv: {reden}. Seejärel pani süüdlane surmaaja võltsimiseks tagasi paika selle eseme: {ding}.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "eakas härrasmees hallide põskhabemete ja lugemisprillidega",

  "De studeerkamer": "Kabinet",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Kõrge tuba kanali ääres. Raamatud laeni, kirjutuslaud akna all, kaminasimss, millel seisab pendelkell. Notar istub ikka veel oma toolil.",
  "De notaris": "Notar",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Ei haava ega märke võitlusest. Aga vaadake huuli: sinised. Ja pupillid on laienenud.” Lievens: „See pole süda, doktor. See on miski, mida ta jõi.” Kirjutuslaual seisab nimesilt: E. Brandsma, notar.",
  "Het portglas": "Portveiniklaas",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Klaas, pooltühi, põhjas sete. Lievens nuusutab seda. „Portvein. Ja selle all midagi kibedat. Sõrmkübarat, Hoekstra. Digitaalist. Südamehaigele ravim, tervele mehele mürk.” Portveinipudel seisab puhvetkapil puutumata sellest ajast, kui teenijatüdruk selle sinna pani.",
  "De pendule": "Pendelkell",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Kaminasimsil seisev pendelkell on seisma jäänud kümme minutit enne südaööd. Lievens tõstab selle üles: simsi tolmus on ristkülik, pöidla laiuse kaugusel kella jalast. „Seda on tõstetud ja tagasi pandud. Ja pendelkell, mida tõstetakse, jääb seisma. Kes tahab, et me usuksime, et ta suri kümme minutit enne südaööd, Hoekstra? Keegi, kellel on kümme minutit enne südaööd hea alibi.”",
  "De kaars": "Küünal",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Küünal kirjutuslaual, põlenud pöidlapikkuseks jupiks. Griet ütleb, et süütas poole kümne ajal uue küünla, kui portveini tõi; selline küünal põleb neli tundi. „Siis oli see põlenud tunni, kui ta käsi sellele langes ja selle kustutas,” ütleb Lievens. „Ta suri kella kümne ja üheteistkümne vahel, mitte kümme minutit enne südaööd. Kell valetab.”",
  "Het testament": "Testament",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Värske testament, eile allkirjastatud ja veel kontorisse hoiule andmata: kõik „minu abikaasale Cornelia Brandsma-de Witile” ja Burgerweeshuisile, linna orbudekodule. Vana testament, mis lebab läbikriipsutatuna selle kõrval, nimetas vaid ühte pärijat: „minu vennapoeg ja kirjur Reinier.” Lievens: „Mees, kes eile pärandist ilma jäeti, Hoekstra, on täna saanud motiivi.”",
  "Een brief": "Kiri",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Kiri laevandusfirmalt Veenstra & Co., allkirjastanud D. Veenstra: „Anun teid lükata võla tähtaeg kevadeni. Ärge ajage mind meeleheitlike tegudeni.” Hoekstra: „Ähvardus!” Lievens: „Mees, kes anub, doktor. Ja mees, kes anub, ei mürgita samal õhtul ainsat, kes saab talle ajapikendust anda.”",
  "Het raam": "Aken",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Aken on seestpoolt riivis; riiv on värvi ja tolmuga kinni jäänud. Siitkaudu pole keegi tulnud. „Kes seda tegi, doktor, tuli uksest. Ja kes uksest tuli, oli juba majas.”",
  "De prullenmand": "Paberikorv",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Kortsutatud sedel: „Onu, ma pean teiega täna õhtul veel testamendist rääkima. R.” Tint on iga rea vasakult poolt laiali määritud. Lievens: „Kirjutanud vasakukäeline, sulega, mis oli veel märg. Vaadake varsti inimeste käsi, Hoekstra.”",
  "De briefopener": "Paberinuga",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Hõbedane paberinuga, puhas ja omal kohal. „Kasutamata,” ütleb Lievens üles vaatamata. „Mürgitaja ei vaja nuga.”",
  "De keuken": "Köök",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "All, maja tagaosas. Pliit, klaasiriiul, majapidajanna kapp ja tagauks kõrvaltänavale.",
  "Het medicijnkastje": "Ravimikapp",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Majapidajanna Griet Jansenile kuuluv kapp tema südametilkadega: apteegist toodud pudelike digitaalisetinktuuri, eelmisel nädalal täidetud, nüüd peaaegu tühi. Juurde kuuluv pipett on kadunud. Griet: „Ma võtan viis tilka päevas, härra. Mitte pool pudelit.”",
  "Het glazenrek": "Klaasiriiul",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet viis poole kümne ajal üles ühe klaasi portveini, nagu igal õhtul. Riiulis seisab teine portveiniklaas, pestud ja tagasi pandud, kuid seest veel märg. Lievens: „Keskööl ikka veel märg. Keegi jõi koos temaga, Hoekstra, ja pesi pärast oma klaasi ära. Külaline oma klaasi ei pese. Majaelanik peseb.”",
  "De achterdeur": "Tagauks",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet paneb tagaukse igal õhtul kell kümme riivi ja seejärel välisukse; eile öösel polnud teisiti. „Ja härra Veenstra?” „Tema lahkus kell üheksa, härra, välisuksest. Saatsin ta ise välja; nii suurt meest nii punase habemega ei unusta.” Pärast kella kümmet polnud majas seega kedagi peale perekonna ja minu enda.",
  "Het huishoudboek": "Majapidamisraamat",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Grieti majapidamisraamat: „9. nov. Proua Stadsschouwburgi, Carmen, koos prouadega Van Eeghen. Tõld tellitud pool üheks.” Lievens: „Proua tuli koju kella kaheteistkümne ja ühe vahel. Kui kell oleks õiget aega näidanud, võinuks see olla tema. Aga kell valetab.”",
  "Het fornuis": "Pliit",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Pliit on külm; kööki pole kella üheteistkümnest saadik kasutatud. Siin pole midagi juhtunud.",
  "De gang en de kapstok": "Koridor ja nagi",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Ülemise korruse koridor kabineti ja magamistubade vahel. Nagi mantlitega, vihmavarjuhoidja, uks vennapoja tuppa.",
  "De overjas aan de haak": "Mantel varna otsas",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Vennapoja, Reinieri mantel. Sisetaskus: kummipalliga klaaspipett, Grieti pudelikese pipett. Paremal varrukal portveiniplekk. „Ta valas vasaku käega,” ütleb Lievens, „ja loksutas paremale. Vasakukäeline, tint sõrmedel ja pipett taskus. Hoekstra, ma usun, et oleme valmis.”",
  "De schoenen bij de deur": "Kingad ukse juures",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Kolm paari kingi, kõik kuivad; terve öö on sadanud. Keegi sellest majast pole öösel väljas käinud. Ainult proua õhtukingad seisavad märgadena välisukse juures: ta tuli ooperist.",
  "Een operaprogramma": "Ooperi kava",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Laual: Carmeni kava, Stadsschouwburg, 9. november, algus kell kaheksa, vahel proua pääsmik. Hoekstra: „Alibi südaööst kauemaks.” Lievens: „Alibi ajaks kümme minutit enne südaööd. Mitte ajaks, mida küünal näitab.”",
  "De kamer van de neef": "Vennapoja tuba",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Vennapoeg Reinier Brandsma elab majas. Ta ütleb, et läks kell kümme magama ega kuulnud midagi. Ta on vasakukäeline: tema vasakul nimetissõrmel on tinti. Hoekstra küsib, kas ta oli oma tädi peale armukade. „Armukade?” ütleb Lievens. „Ei. Pärandist ilma jäetud.”",
  "De paraplubak": "Vihmavarjuhoidja",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Tilkuv vihmavari: doktor Hoekstra oma. „Ma ju ütlesin, et võtke see kaasa,” ütleb Lievens rahulolevalt.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens süütas piibu. „See oli vennapoeg, Hoekstra. Reinier luges eile uut testamenti ja nägi, et ta ei päri enam midagi. Ta kirjutas onule sedeli, tuli pärast kella kümmet teise klaasiga kabinetti ja valas neile mõlemale portveini: enda oma puhtalt, onu omasse pool pudelit Grieti südametilku. Digitaalis peatab südame. Perearst näeb vana meest oma kirjutuslaua taga ja mõtleb: süda. Tal oli peaaegu õigus.”",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Seejärel pesi ta oma klaasi, seadis pendelkella näitama kümme minutit enne südaööd ja läks magama. Kümme minutit enne südaööd oli ta ju juba tund aega maganud ja tema tädi alles teatris. Korralik alibi ajaks, mil keegi ei surnud. Ta unustas küünla. Ja ta unustas, et pipett ei kuulu sisetaskusse.”",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Politsei viis Reinier Brandsma kell üks ära. Orbudekodu sai tema raha. Ja mina, kes ma vihmavarju peaaegu unustanud olin, panin selle kõik kirja.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Oli sateinen marraskuun aamu vuonna 1908, kun notaari Everhardus Brandsman palvelustyttö seisoi ovellamme Keizersgrachtilla. ”Notaari on kuollut, tohtori. Työhuoneessaan, kirjoituspöytänsä ääressä. Perhelääkäri sanoo: sydän. Mutta rouva Jansen, taloudenhoitaja, sanoo, ettei se pidä paikkaansa, ja hän lähetti minut herra Lievensin luo.”",

  "een oudere heer met grijze bakkebaarden en een leesbril": "iäkäs herrasmies, jolla on harmaat poskiparrat ja lukulasit",
  "een dame van achter in de dertig in een avondjurk met parels": "lähes nelikymmenvuotias rouva iltapuvussa ja helmissä",
  "een jongeman met inkt aan zijn linkerhand": "nuori mies, jonka vasemmassa kädessä on mustetta",
  "een zware man met een rode baard": "roteva mies, jolla on punainen parta",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "iäkäs nainen, jonka esiliinassa riippuu avainnippu",
  "een man met een dokterstas en een natte paraplu": "mies, jolla on lääkärinlaukku ja märkä sateenvarjo",
  "De studeerkamer": "Työhuone",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Korkea huone kanavan varrella. Kirjoja kattoon asti, kirjoituspöytä ikkunan luona, takanreunus ja sillä heilurikello. Notaari istuu yhä tuolissaan.",
  "De notaris": "Notaari",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: ”Ei haavaa, ei merkkejä kamppailusta. Mutta katsokaa huulia: siniset. Ja pupillit ovat laajentuneet.” Lievens: ”Se ei ole sydän, tohtori. Se on jotakin, mitä hän on juonut.” Kirjoituspöydällä on nimikyltti: E. Brandsma, notaari.",
  "Het portglas": "Portviinilasi",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Lasi, puoliksi tyhjä, pohjalla sakkaa. Lievens nuuhkaisee sitä. ”Portviiniä. Ja sen alla jotakin kitkerää. Sormustinkukkaa, Hoekstra. Digitalista. Sydänpotilaalle lääke, terveelle miehelle myrkky.” Portviinipullo seisoo senkillä koskemattomana siitä asti, kun palvelustyttö sen sinne laski.",
  "De pendule": "Heilurikello",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Takanreunuksen heilurikello on pysähtynyt kymmentä vaille kaksitoista. Lievens nostaa sen: reunuksen pölyssä näkyy suorakaide, peukalon leveyden päässä kellon jalasta. ”Se on nostettu ja pantu takaisin. Ja heilurikello, joka nostetaan, pysähtyy. Kuka haluaa meidän uskovan, että hän kuoli kymmentä vaille kaksitoista, Hoekstra? Joku, jolla on kymmentä vaille kaksitoista hyvä alibi.”",
  "De kaars": "Kynttilä",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Kynttilä kirjoituspöydällä, palanut peukalon mittaiseksi tyngäksi. Griet kertoo sytyttäneensä uuden kynttilän puoli kymmeneltä, kun toi portviinin; sellainen kynttilä palaa neljä tuntia. ”Silloin se oli palanut tunnin, kun hänen kätensä putosi sen päälle ja sammutti sen”, sanoo Lievens. ”Hän kuoli kymmenen ja yhdentoista välillä, ei kymmentä vaille kaksitoista. Kello valehtelee.”",
  "Het testament": "Testamentti",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Tuore testamentti, allekirjoitettu eilen eikä vielä talletettu toimistoon: kaikki ”puolisolleni Cornelia Brandsma-de Witille” ja Burgerweeshuisille, kaupungin orpokodille. Vanha testamentti, joka on sen vieressä yli vedettynä, mainitsi vain yhden perillisen: ”veljenpoikani ja kirjurini Reinierin”. Lievens: ”Mies, joka eilen menetti perintönsä, Hoekstra, on tänään saanut vaikuttimen.”",
  "Een brief": "Kirje",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Kirje laivanvarustamo Veenstra & Co:lta, allekirjoittajana D. Veenstra: ”Anon teiltä velalle lykkäystä kevääseen asti. Älkää ajako minua epätoivoisiin tekoihin.” Hoekstra: ”Uhkaus!” Lievens: ”Mies, joka anoo, tohtori. Ja mies, joka anoo, ei samana iltana myrkytä ainoaa, joka voi antaa hänelle lykkäystä.”",
  "Het raam": "Ikkuna",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Ikkuna on salvattu sisäpuolelta; salpa on juuttunut kiinni maalista ja pölystä. Kukaan ei ole tullut tätä tietä. ”Joka sen teki, tohtori, tuli ovesta. Ja joka tuli ovesta, oli jo talossa.”",
  "De prullenmand": "Paperikori",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Rypistetty lappu: ”Setä, minun on vielä tänä iltana puhuttava kanssanne testamentista. R.” Muste on tuhriintunut jokaisen rivin vasemmalta puolelta. Lievens: ”Vasenkätisen kirjoittama, kynällä, joka oli vielä märkä. Katsokaa kohta ihmisten käsiä, Hoekstra.”",
  "De briefopener": "Paperiveitsi",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Hopeinen paperiveitsi, puhdas ja paikallaan. ”Käyttämätön”, sanoo Lievens nostamatta katsettaan. ”Myrkyttäjä ei tarvitse veistä.”",
  "De keuken": "Keittiö",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Alakerrassa, talon takaosassa. Liesi, lasiteline, taloudenhoitajan kaappi ja takaovi kujalle.",
  "Het medicijnkastje": "Lääkekaappi",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Taloudenhoitaja Griet Jansenin kaappi ja hänen sydäntippansa: apteekin pullo digitalistinktuuraa, täytetty viime viikolla, nyt melkein tyhjä. Siihen kuuluva pipetti puuttuu. Griet: ”Otan viisi tippaa päivässä, herra. En puolta pulloa.”",
  "Het glazenrek": "Lasiteline",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet vei puoli kymmeneltä yläkertaan yhden lasin portviiniä, kuten joka ilta. Telineessä on toinen portviinilasi, pesty ja pantu takaisin, mutta sisältä yhä märkä. Lievens: ”Keskiyöllä yhä märkä. Joku joi hänen kanssaan, Hoekstra, ja pesi sen jälkeen lasinsa. Vieras ei pese lasiaan. Talon väkeen kuuluva pesee.”",
  "De achterdeur": "Takaovi",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet salpaa takaoven joka ilta kello kymmenen ja sen jälkeen etuoven; viime yönä ei ollut toisin. ”Entä herra Veenstra?” ”Hän lähti yhdeksältä, herra, etuovesta. Saatoin hänet itse ulos; niin suurta miestä ja niin punaista partaa ei unohda.” Kello kymmenen jälkeen talossa ei siis ollut ketään muuta kuin perhe ja minä itse.",
  "Het huishoudboek": "Taloustilikirja",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Grietin taloustilikirja: ”9. marrask. Rouva Stadsschouwburgiin, Carmen, Van Eeghenin rouvien kanssa. Vaunut tilattu puoli yhdeksi.” Lievens: ”Rouva tuli kotiin kahdentoista ja yhden välillä. Jos kello olisi ollut oikeassa, se olisi voinut olla hän. Mutta kello valehtelee.”",
  "Het fornuis": "Liesi",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Liesi on kylmä; keittiötä ei ole käytetty kello yhdentoista jälkeen. Täällä ei ole tapahtunut mitään.",
  "De gang en de kapstok": "Käytävä ja naulakko",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Yläkerran käytävä työhuoneen ja makuuhuoneiden välissä. Naulakko täynnä takkeja, sateenvarjoteline, ovi veljenpojan huoneeseen.",
  "De overjas aan de haak": "Päällystakki naulassa",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Veljenpojan, Reinierin, takki. Sisätaskussa: lasinen pipetti kumipalloineen, Grietin pullon pipetti. Oikeassa hihassa portviinitahra. ”Hän kaatoi vasemmalla”, sanoo Lievens, ”ja läikytti oikealle. Vasenkätinen, sormissa mustetta ja taskussa pipetti. Hoekstra, luulenpa, että olemme valmiit.”",
  "De schoenen bij de deur": "Kengät oven vieressä",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Kolme paria kenkiä, kaikki kuivia; on satanut koko yön. Kukaan tästä talosta ei ole ollut yöllä ulkona. Vain rouvan iltakengät seisovat märkinä etuoven luona: hän tuli oopperasta.",
  "Een operaprogramma": "Oopperan käsiohjelma",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Pöydällä: Carmenin käsiohjelma, Stadsschouwburg, 9. marraskuuta, alkaa kello kahdeksan, ja sen välissä rouvan pääsylippu. Hoekstra: ”Alibi puolenyön jälkeen asti.” Lievens: ”Alibi ajaksi kymmentä vaille kaksitoista. Ei sille ajalle, jonka kynttilä kertoo.”",
  "De kamer van de neef": "Veljenpojan huone",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, veljenpoika, asuu talossa. Hän sanoo menneensä nukkumaan kello kymmenen eikä kuulleensa mitään. Hän on vasenkätinen: hänen vasemmassa etusormessaan on mustetta. Hoekstra kysyy, oliko hän mustasukkainen tädistään. ”Mustasukkainen?” sanoo Lievens. ”Ei. Perinnötön.”",
  "De paraplubak": "Sateenvarjoteline",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Tippuva sateenvarjo: tohtori Hoekstran. ”Sanoinhan, että ottaisitte sen mukaan”, sanoo Lievens tyytyväisenä.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens sytytti piippunsa. ”Se oli veljenpoika, Hoekstra. Reinier luki eilen uuden testamentin ja näki, ettei perisi enää mitään. Hän kirjoitti sedälleen lapun, tuli kello kymmenen jälkeen työhuoneeseen toisen lasin kanssa ja kaatoi heille kummallekin portviiniä: omaansa puhdasta, setänsä lasiin puolen pullollisen Grietin sydäntippoja. Digitalis pysäyttää sydämen. Perhelääkäri näkee vanhan miehen kirjoituspöytänsä ääressä ja ajattelee: sydän. Hän oli melkein oikeassa.”",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "”Sen jälkeen hän pesi lasinsa, asetti heilurikellon näyttämään kymmentä vaille kahtatoista ja meni nukkumaan. Kymmentä vaille kaksitoista hän oli nimittäin nukkunut jo tunnin, ja hänen tätinsä oli yhä teatterissa. Siisti alibi hetkelle, jona kukaan ei kuollut. Hän unohti kynttilän. Ja hän unohti, ettei pipetti kuulu sisätaskuun.”",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Poliisi haki Reinier Brandsman kello yhdeltä. Orpokoti sai hänen rahansa. Ja minä, joka olin vähällä unohtaa sateenvarjoni, kirjoitin kaiken muistiin.",
});

  "Uit de aantekeningen van dokter Bram Hoekstra.": "Extrait des notes du docteur Bram Hoekstra.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "C'était un matin pluvieux de novembre 1908 lorsque la domestique du notaire Everhardus Brandsma se présenta à notre porte, sur le Keizersgracht. « Le notaire est mort, docteur. Dans son cabinet de travail, à son bureau. Le médecin de famille dit : le cœur. Mais Mme Jansen, la gouvernante, dit que cela ne va pas, et elle m'a envoyée chez M. Lievens. »",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens avait déjà son manteau sur le dos. « Un notaire qui meurt le soir à son bureau, Hoekstra, avec un testament tout frais sous la main. Si c'est le cœur, je mange mon chapeau. » Il leva les yeux vers le ciel. « Prenez votre parapluie. Et faites attention à la pendule. »",
