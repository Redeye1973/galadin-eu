  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Nicio rană, nicio urmă de luptă. Dar uitați-vă la buze: albastre. Și pupilele sunt dilatate.” Lievens: „Nu e inima, doctore. E ceva ce a băut.” Pe masa de scris stă o plăcuță cu numele: E. Brandsma, notar.",
  "Het portglas": "Paharul de Porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Un pahar pe jumătate gol, cu depuneri pe fund. Lievens îl miroase. „Porto. Și ceva amar dedesubt. Degețel roșu, Hoekstra. Digitalină. La un bolnav de inimă, un leac; la un om sănătos, o otravă.” Sticla de vin de Porto stă pe bufet, neatinsă de când a pus-o acolo servitoarea.",
  "De pendule": "Pendula",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Pendula de pe polița șemineului s-a oprit la douăsprezece fără zece. Lievens o ridică: în praful de pe poliță se vede un dreptunghi, la un lat de deget de piciorul ei. „A fost ridicată și pusă la loc. Iar o pendulă pe care o ridici se oprește. Cine vrea să credem că a murit la douăsprezece fără zece, Hoekstra? Cineva care la douăsprezece fără zece are un alibi bun.”",
  "De kaars": "Lumânarea",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "O lumânare pe masa de scris, arsă până la un ciot cât un deget. Griet spune că a aprins o lumânare nouă la nouă și jumătate, când a adus vinul de Porto; o asemenea lumânare arde patru ore. „Atunci ardea abia de o oră când mâna lui a căzut peste ea și a stins-o”, spune Lievens. „A murit între zece și unsprezece, nu la douăsprezece fără zece. Ceasul minte.”",
  "Het testament": "Testamentul",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Un testament nou, semnat ieri și încă nedepus la cancelarie: totul „soției mele, Cornelia Brandsma-de Wit” și orfelinatului orașului, Burgerweeshuis. Vechiul testament, aflat alături și tăiat cu o linie, numea un singur moștenitor: „nepotul și secretarul meu, Reinier.” Lievens: „Un om dezmoștenit ieri, Hoekstra, are azi un motiv.”",
  "Een brief": "O scrisoare",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "O scrisoare de la compania de navigație Veenstra & Co., semnată D. Veenstra: „Vă implor să amânați datoria până la primăvară. Nu mă împingeți la fapte disperate.” Hoekstra: „O amenințare!” Lievens: „Un om care imploră, doctore. Iar un om care imploră nu-l otrăvește chiar în aceeași seară pe singurul care îi poate da un răgaz.”",
  "Het raam": "Fereastra",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Fereastra e zăvorâtă pe dinăuntru; zăvorul e înțepenit de vopsea și de praf. Nimeni n-a intrat pe aici. „Cine a făcut-o, doctore, a intrat pe ușă. Iar cine a intrat pe ușă era deja în casă.”",
  "De prullenmand": "Coșul de hârtii",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Un bilet mototolit: „Unchiule, trebuie să vă vorbesc chiar în seara asta despre testament. R.” Cerneala e întinsă pe partea stângă a fiecărui rând. Lievens: „Scris de un stângaci, cu o peniță încă udă. Mai târziu fiți atent la mâini, Hoekstra.”",
  "De briefopener": "Cuțitul de hârtie",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Un cuțit de hârtie din argint, curat și la locul lui. „Nefolosit”, spune Lievens fără să ridice ochii. „Un otrăvitor n-are nevoie de cuțit.”",
  "De keuken": "Bucătăria",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Jos, în spatele casei. O mașină de gătit, un raft cu pahare, dulapul menajerei și ușa din spate, spre alee.",
  "Het medicijnkastje": "Dulăpiorul cu medicamente",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Dulăpiorul lui Griet Jansen, menajera, cu picăturile ei pentru inimă: o sticluță de tinctură de digitalină de la farmacie, umplută săptămâna trecută și acum aproape goală. Lipsește pipeta care o însoțește. Griet: „Iau cinci picături pe zi, domnule. Nu jumătate de sticluță.”",
  "Het glazenrek": "Raftul cu pahare",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "La nouă și jumătate, Griet a dus sus un singur pahar de Porto, ca în fiecare seară. În raft stă un al doilea pahar de Porto, spălat și pus la loc, dar încă ud pe dinăuntru. Lievens: „Încă ud la miezul nopții. Cineva a băut cu el, Hoekstra, și apoi și-a spălat paharul. Un oaspete nu-și spală paharul. Unul din casă, da.”",
  "De achterdeur": "Ușa din spate",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet zăvorăște ușa din spate în fiecare seară la ora zece, iar apoi ușa din față; noaptea trecută n-a fost altfel. „Și domnul Veenstra?” „A plecat la nouă, domnule, pe ușa din față. L-am condus chiar eu; un om așa de mare, cu o barbă atât de roșcată, nu se uită.” După ora zece, așadar, nu mai era nimeni în casă în afară de familie și de mine.",
  "Het huishoudboek": "Registrul casei",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Registrul casei, ținut de Griet: „9 nov. Doamna la Stadsschouwburg, Carmen, cu doamnele Van Eeghen. Trăsură comandată pentru douăsprezece și jumătate.” Lievens: „Doamna a venit acasă între douăsprezece și unu. Dacă ceasul ar fi arătat ora exactă, putea fi ea. Dar ceasul minte.”",
  "Het fornuis": "Mașina de gătit",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Mașina de gătit e rece; bucătăria n-a mai fost folosită de la ora unsprezece. Aici nu s-a întâmplat nimic.",
  "De gang en de kapstok": "Coridorul și cuierul",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Coridorul de sus, între birou și dormitoare. Un cuier cu haine, un suport de umbrele, ușa camerei nepotului.",
  "De overjas aan de haak": "Pardesiul din cuier",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Pardesiul nepotului, Reinier. În buzunarul interior: o pipetă de sticlă cu o pară de cauciuc, pipeta de la sticluța lui Griet. Pe mâneca dreaptă, o pată de Porto. „A turnat cu stânga”, spune Lievens, „și a vărsat pe dreapta. Un stângaci cu cerneală pe degete și o pipetă în buzunar. Hoekstra, cred că am terminat.”",
  "De schoenen bij de deur": "Pantofii de lângă ușă",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trei perechi de pantofi, toate uscate; a plouat toată noaptea. Nimeni din casa aceasta n-a ieșit afară azi-noapte. Doar pantofii de seară ai doamnei stau uzi lângă ușa din față: ea venea de la operă.",
  "Een operaprogramma": "Un program de operă",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Pe măsuță: programul pentru Carmen, Stadsschouwburg, 9 noiembrie, începutul la ora opt, cu biletul doamnei înăuntru. Hoekstra: „Un alibi până după miezul nopții.” Lievens: „Un alibi pentru douăsprezece fără zece. Nu pentru ora pe care o arată lumânarea.”",
  "De kamer van de neef": "Camera nepotului",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, nepotul, doarme în casă. Spune că s-a culcat la zece și n-a auzit nimic. E stângaci: are cerneală pe arătătorul stâng. Hoekstra îl întreabă dacă era gelos pe mătușa lui. „Gelos?” spune Lievens. „Nu. Dezmoștenit.”",
  "De paraplubak": "Suportul de umbrele",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "O umbrelă care picură: a doctorului Hoekstra. „V-am spus să o luați cu dumneavoastră”, spune Lievens, mulțumit.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens își aprinse pipa. „A fost nepotul, Hoekstra. Ieri, Reinier a citit noul testament și a văzut că nu va mai moșteni nimic. I-a scris unchiului un bilet, a intrat în birou după ora zece cu un al doilea pahar și le-a turnat amândurora vin de Porto: lui, curat; unchiului, cu jumătate de sticluță din picăturile de inimă ale lui Griet. Digitalina oprește o inimă. Un medic de familie vede un bătrân la masa lui de scris și se gândește: inima. Aproape că avea dreptate.”",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Apoi și-a spălat paharul, a potrivit pendula la douăsprezece fără zece și s-a dus la culcare. La douăsprezece fără zece, la urma urmei, dormea deja de o oră, iar mătușa lui era încă la teatru. Un alibi impecabil pentru o oră la care n-a murit nimeni. A uitat de lumânare. Și a uitat că o pipetă n-are ce căuta în buzunarul interior al unui pardesiu.”",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Poliția veni după Reinier Brandsma la ora unu. Orfelinatul primi banii notarului. Iar eu, care eram cât pe ce să-mi uit umbrela, am așternut totul pe hârtie.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Bolo mokré novembrové ráno roku 1908, keď pri našich dverách na Keizersgrachte stála slúžka notára Everharda Brandsmu. „Pán notár je mŕtvy, pán doktor. Vo svojej pracovni, pri písacom stole. Domáci lekár hovorí: srdce. Ale pani Jansen, gazdiná, hovorí, že to nesedí, a poslala ma za pánom Lievensom.“",

  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Žiadna rana, žiadne známky zápasu. Ale pozrite sa na pery: modré. A zreničky sú rozšírené.“ Lievens: „To nie je srdce, pán doktor. To je niečo, čo vypil.“ Na stole stojí menovka: E. Brandsma, notár.",
  "Het portglas": "Pohárik portského",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Pohárik, napoly prázdny, s usadeninou na dne. Lievens k nemu privonia. „Portské. A pod ním niečo horké. Náprstník, Hoekstra. Digitalis. Pre chorého na srdce liek, pre zdravého muža jed.“ Fľaša portského stojí na príborníku, nedotknutá odvtedy, čo ju tam slúžka položila.",
  "De pendule": "Krbové hodiny",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Krbové hodiny na rímse sa zastavili desať minút pred dvanástou. Lievens ich zdvihne: v prachu na rímse je obdĺžnik, palec vedľa podstavca. „Niekto ich zdvihol a položil späť. A kyvadlové hodiny, ktoré zdvihnete, sa zastavia. Kto chce, aby sme uverili, že zomrel desať minút pred dvanástou, Hoekstra? Niekto, kto má na desať minút pred dvanástou dobré alibi.“",
  "De kaars": "Sviečka",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Sviečka na stole, dohorená na ohorok veľký ako palec. Griet hovorí, že o pol desiatej zapálila novú sviečku, keď priniesla portské; taká sviečka horí štyri hodiny. „Potom horela ešte len hodinu, keď na ňu padla jeho ruka a uhasila ju,“ hovorí Lievens. „Zomrel medzi desiatou a jedenástou, nie desať minút pred dvanástou. Hodiny klamú.“",
  "Het testament": "Závet",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Čerstvý závet, podpísaný včera a ešte neuložený v kancelárii: všetko „mojej manželke Cornelii Brandsma-de Wit“ a mestskému sirotincu Burgerweeshuis. Starý závet, ktorý leží vedľa, prečiarknutý, menoval len jedného dediča: „môjho synovca a pisára Reiniera“. Lievens: „Muž, ktorého včera vydedili, Hoekstra, má dnes dôvod.“",
  "Een brief": "List",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "List od lodiarskej spoločnosti Veenstra & Co., podpísaný D. Veenstra: „Úpenlivo Vás prosím o odklad dlhu do jari. Nedoháňajte ma k zúfalým činom.“ Hoekstra: „Vyhrážka!“ Lievens: „Muž, ktorý prosí, pán doktor. A muž, ktorý prosí, neotrávi v ten istý večer jediného človeka, ktorý mu môže dať odklad.“",
  "Het raam": "Okno",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Okno je zvnútra zatvorené na závoru; závora je zaliata farbou a prachom. Týmto smerom nikto neprišiel. „Kto to urobil, pán doktor, prišiel dverami. A kto prišiel dverami, bol už v dome.“",
  "De prullenmand": "Kôš na papier",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Pokrčený lístok: „Strýko, musím sa s Vami ešte dnes večer porozprávať o závete. R.“ Atrament je rozmazaný na ľavej strane každého riadku. Lievens: „Písal to ľavák, perom, ktoré bolo ešte mokré. O chvíľu sa ľuďom pozerajte na ruky, Hoekstra.“",
  "De briefopener": "Nôž na listy",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Strieborný nôž na listy, čistý a na svojom mieste. „Nepoužitý,“ hovorí Lievens bez toho, aby zdvihol zrak. „Travič nepotrebuje nôž.“",
  "De keuken": "Kuchyňa",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Dole, v zadnej časti domu. Sporák, stojan s pohárikmi, skrinka gazdinej a zadné dvere do uličky.",
  "Het medicijnkastje": "Lekárnička",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Skrinka Griet Jansen, gazdinej, s jej kvapkami na srdce: fľaštička tinktúry digitalis z lekárne, minulý týždeň naplnená, teraz takmer prázdna. Pipeta, ktorá k nej patrí, chýba. Griet: „Beriem päť kvapiek denne, pane. Nie pol fľaštičky.“",
  "Het glazenrek": "Stojan na poháriky",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "O pol desiatej odniesla Griet hore jeden pohárik portského, ako každý večer. V stojane stojí druhý pohárik na portské, umytý a vrátený na miesto, ale vnútri ešte mokrý. Lievens: „O polnoci ešte mokrý. Niekto s ním pil, Hoekstra, a potom svoj pohárik umyl. Hosť si pohárik neumýva. Človek z domu áno.“",
  "De achterdeur": "Zadné dvere",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet každý večer o desiatej zastrčí závoru na zadných dverách a potom na hlavných; ani včera v noci to nebolo inak. „A pán Veenstra?“ „Ten odišiel o deviatej, pane, hlavnými dverami. Sama som ho vyprevadila; takého veľkého muža s takou ryšavou bradou človek nezabudne.“ Po desiatej teda v dome nebol nikto okrem rodiny a mňa.",
  "Het huishoudboek": "Kniha domácnosti",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Kniha domácnosti Griet: „9. nov. Pani do divadla Stadsschouwburg na Carmen, s dámami Van Eeghen. Koč má prísť o pol jednej.“ Lievens: „Pani sa vrátila domov medzi dvanástou a jednou. Keby hodiny išli správne, mohla to byť ona. Ale hodiny klamú.“",
  "Het fornuis": "Sporák",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Sporák je studený; v kuchyni sa od jedenástej nevarilo. Tu sa nič nestalo.",
  "De gang en de kapstok": "Chodba a vešiak",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Chodba na poschodí, medzi pracovňou a spálňami. Vešiak s kabátmi, stojan na dáždniky, dvere do synovcovej izby.",
  "De overjas aan de haak": "Zvrchník na háčiku",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Synovcov kabát, Reinierov. Vo vnútornom vrecku: sklená pipeta s gumovým balónikom, pipeta z fľaštičky Griet. Na pravom rukáve škvrna od portského. „Nalieval ľavou rukou,“ hovorí Lievens, „a oblial si pravý rukáv. Ľavák s atramentom na prstoch a pipetou vo vrecku. Hoekstra, myslím, že sme hotoví.“",
  "De schoenen bij de deur": "Topánky pri dverách",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tri páry topánok, všetky suché; a pritom celú noc pršalo. Nikto z tohto domu nebol v noci vonku. Len paniine večerné črievičky stoja mokré pri hlavných dverách: vracala sa z opery.",
  "Een operaprogramma": "Operný program",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na stolíku: program Carmen, Stadsschouwburg, 9. novembra, začiatok o ôsmej, a v ňom vstupenka pani. Hoekstra: „Alibi až do polnoci a ešte dlhšie.“ Lievens: „Alibi na desať minút pred dvanástou. Nie na čas, ktorý ukazuje sviečka.“",
  "De kamer van de neef": "Synovcova izba",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, synovec, býva v dome. Hovorí, že o desiatej išiel spať a nič nepočul. Je ľavák: na ľavom ukazováku má atrament. Hoekstra sa pýta, či nežiarlil na svoju tetu. „Žiarlil?“ hovorí Lievens. „Nie. Vydedili ho.“",
  "De paraplubak": "Stojan na dáždniky",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Dáždnik, z ktorého kvapká voda: dáždnik doktora Hoekstru. „Veď som vám hovoril, aby ste si ho vzali,“ hovorí Lievens spokojne.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens si zapálil fajku. „Bol to synovec, Hoekstra. Reinier si včera prečítal nový závet a videl, že už nič nezdedí. Napísal strýkovi lístok, prišiel po desiatej do pracovne s druhým pohárikom a obom nalial portské: sebe čisté, strýkovi s polovicou fľaštičky Grietiných kvapiek na srdce. Digitalis zastaví srdce. Domáci lekár vidí starého muža pri písacom stole a pomyslí si: srdce. Takmer mal pravdu.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Potom umyl svoj pohárik, nastavil krbové hodiny na desať minút pred dvanástou a išiel spať. Desať minút pred dvanástou predsa už hodinu spal a jeho teta bola ešte v divadle. Úhľadné alibi na čas, keď nikto nezomrel. Zabudol na sviečku. A zabudol, že pipeta do vnútorného vrecka nepatrí.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Polícia si prišla po Reiniera Brandsmu o jednej. Sirotinec dostal jeho peniaze. A ja, ktorý som takmer zabudol dáždnik, som to všetko spísal.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Bilo je deževno novembrsko jutro leta 1908, ko je služkinja notarja Everhardusa Brandsme stala na našem pragu na Keizersgrachtu. „Notar je mrtev, gospod doktor. V svoji delovni sobi, za pisalno mizo. Hišni zdravnik pravi: srce. Toda gospa Jansen, gospodinja, pravi, da nekaj ni prav, in poslala me je h gospodu Lievensu.“",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens je že imel plašč na sebi. „Notar, ki zvečer umre za pisalno mizo, Hoekstra, s svežo oporoko pod roko. Če je bilo to srce, pojem svoj klobuk.“ Pogledal je v nebo. „Vzemite dežnik. In pazite na uro.“",

  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Brez rane, brez sledi boja. Toda poglejte ustnice: modre. In zenice so razširjene.“ Lievens: „To ni srce, doktor. To je nekaj, kar je popil.“ Na pisalni mizi stoji ploščica z imenom: E. Brandsma, notar.",
  "Het portglas": "Kozarec portovca",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Kozarec, napol prazen, z usedlino na dnu. Lievens ga povoha. „Portovec. In pod njim nekaj grenkega. Naprstec, Hoekstra. Digitalis. Srčnemu bolniku zdravilo, zdravemu človeku strup.“ Steklenica portovca stoji na kredenci, nedotaknjena, odkar jo je služkinja tja postavila.",
  "De pendule": "Ura na kaminu",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Ura na polici nad kaminom se je ustavila pri desetih do dvanajstih. Lievens jo dvigne: v prahu na polici je pravokotnik, za palec poleg njenega podstavka. „Nekdo jo je dvignil in postavil nazaj. In nihalna ura, ki jo dvigneš, se ustavi. Kdo hoče, da verjamemo, da je umrl ob desetih do dvanajstih, Hoekstra? Nekdo, ki ima za deset do dvanajstih dober alibi.“",
  "De kaars": "Sveča",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Sveča na pisalni mizi, dogorela do ogorka, dolgega za palec. Griet pravi, da je ob pol desetih prižgala novo svečo, ko je prinesla portovec; takšna sveča gori štiri ure. „Potem je gorela šele eno uro, ko je nanjo padla njegova roka in jo ugasnila,“ pravi Lievens. „Umrl je med deseto in enajsto uro, ne ob desetih do dvanajstih. Ura laže.“",
  "Het testament": "Oporoka",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Sveža oporoka, včeraj podpisana in še ne deponirana v pisarni: vse „moji soprogi Corneliji Brandsma-de Wit“ in Burgerweeshuisu, mestni sirotišnici. Stara oporoka, ki leži poleg nje prečrtana, je imenovala enega samega dediča: „mojega nečaka in pisarja Reinierja“. Lievens: „Človek, ki je bil včeraj razdedinjen, Hoekstra, ima danes razlog.“",
  "Een brief": "Pismo",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Pismo ladjarske družbe Veenstra & Co., podpisano D. Veenstra: „Rotim vas, odložite dolg do pomladi. Ne silite me v obupna dejanja.“ Hoekstra: „Grožnja!“ Lievens: „Človek, ki roti, doktor. In človek, ki roti, še isti večer ne zastrupi edinega, ki mu lahko da odlog.“",
  "Het raam": "Okno",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Okno je zapahnjeno od znotraj; zapah se je trdno zlepil z barvo in prahom. Tod ni prišel nihče. „Kdorkoli je to storil, doktor, je prišel skozi vrata. In kdor je prišel skozi vrata, je bil že v hiši.“",
  "De prullenmand": "Koš za papir",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Zmečkan listek: „Stric, nocoj moram še govoriti z vami o oporoki. R.“ Črnilo je razmazano na levi strani vsake vrstice. Lievens: „Napisal ga je levičar, s peresom, ki je bilo še mokro. Pozneje bodite pozorni na roke, Hoekstra.“",
  "De briefopener": "Nož za pisma",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Srebrn nož za pisma, čist in na svojem mestu. „Ni bil uporabljen,“ reče Lievens, ne da bi dvignil pogled. „Zastrupljevalec ne potrebuje noža.“",
  "De keuken": "Kuhinja",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Spodaj, v zadnjem delu hiše. Štedilnik, stojalo s kozarci, omara gospodinje in zadnja vrata, ki vodijo v uličico.",
  "Het medicijnkastje": "Omarica z zdravili",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Omarica Griet Jansen, gospodinje, z njenimi srčnimi kapljicami: stekleničica tinkture digitalisa iz lekarne, napolnjena prejšnji teden, zdaj skoraj prazna. Pipeta, ki sodi zraven, manjka. Griet: „Vzamem pet kapljic na dan, gospod. Ne pol stekleničke.“",
  "Het glazenrek": "Stojalo s kozarci",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet je ob pol desetih kot vsak večer odnesla gor en kozarec portovca. Na stojalu stoji drugi kozarec za portovec, pomit in postavljen nazaj, a od znotraj še moker. Lievens: „Ob polnoči še moker. Nekdo je pil z njim, Hoekstra, in potem pomil svoj kozarec. Gost si kozarca ne pomije. Kdo od domačih pa.“",
  "De achterdeur": "Zadnja vrata",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet vsak večer ob desetih zapahne zadnja vrata, nato še glavna; sinoči ni bilo nič drugače. „In gospod Veenstra?“ „Ta je odšel ob devetih, gospod, skozi glavna vrata. Sama sem ga pospremila ven; tako velikega moža s tako rdečo brado ne pozabiš.“ Po deseti uri torej v hiši ni bilo nikogar razen družine in mene.",
  "Het huishoudboek": "Gospodinjska knjiga",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Grietina gospodinjska knjiga: „9. nov. Gospa v Stadsschouwburg, Carmen, z damami Van Eeghen. Kočija naročena za pol enih.“ Lievens: „Gospa je prišla domov med dvanajsto in prvo uro. Če bi ura kazala prav, bi lahko bila ona. Toda ura laže.“",
  "Het fornuis": "Štedilnik",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Štedilnik je hladen; kuhinje od enajstih ni nihče uporabljal. Tu se ni zgodilo nič.",
  "De gang en de kapstok": "Hodnik in obešalnik",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Hodnik v zgornjem nadstropju, med delovno sobo in spalnicami. Obešalnik s plašči, stojalo za dežnike, vrata v nečakovo sobo.",
  "De overjas aan de haak": "Površnik na kljuki",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Nečakov plašč, Reinierjev. V notranjem žepu: steklena pipeta z gumijasto kapico, pipeta z Grietine stekleničke. Na desnem rokavu madež portovca. „Natakal je z levo,“ pravi Lievens, „in polil po desni. Levičar s črnilom na prstih in pipeto v žepu. Hoekstra, mislim, da sva končala.“",
  "De schoenen bij de deur": "Čevlji pri vratih",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trije pari čevljev, vsi suhi; vso noč je deževalo. Nihče iz te hiše ponoči ni bil zunaj. Le gospini večerni čevlji stojijo mokri pri glavnih vratih: prišla je iz opere.",
  "Een operaprogramma": "Operni program",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na mizici: program Carmen, Stadsschouwburg, 9. november, začetek ob osmih, z gospino vstopnico v njem. Hoekstra: „Alibi do po polnoči.“ Lievens: „Alibi za deset do dvanajstih. Ne za čas, ki ga kaže sveča.“",
  "De kamer van de neef": "Nečakova soba",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, nečak, spi v hiši. Pravi, da je šel ob desetih spat in ni ničesar slišal. Je levičar: na levem kazalcu ima črnilo. Hoekstra vpraša, ali je bil ljubosumen na teto. „Ljubosumen?“ reče Lievens. „Ne. Razdedinjen.“",
  "De paraplubak": "Stojalo za dežnike",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Dežnik, s katerega kaplja: dežnik doktorja Hoekstre. „Saj sem vam rekel, da ga vzamete s seboj,“ zadovoljno reče Lievens.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens si je prižgal pipo. „Bil je nečak, Hoekstra. Reinier je včeraj prebral novo oporoko in videl, da ne bo podedoval ničesar več. Stricu je napisal listek, po deseti uri prišel v delovno sobo z drugim kozarcem in obema natočil portovca: sebi čistega, stricu s pol stekleničke Grietinih srčnih kapljic. Digitalis ustavi srce. Hišni zdravnik vidi starca za pisalno mizo in pomisli: srce. Skoraj je imel prav.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Nato je pomil svoj kozarec, nastavil uro na kaminu na deset do dvanajstih in šel spat. Ob desetih do dvanajstih je namreč že eno uro spal, njegova teta pa je bila še v gledališču. Lep alibi za čas, ob katerem ni umrl nihče. Pozabil je na svečo. In pozabil je, da pipeta ne sodi v notranji žep.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policija je Reinierja Brandsmo odvedla ob enih. Sirotišnica je dobila njegov denar. In jaz, ki sem skoraj pozabil dežnik, sem vse zapisal.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Det var en regnig novembermorgon 1908 när notarie Everhardus Brandsmas jungfru stod på vår trappa vid Keizersgracht. ”Notarien är död, doktorn. I sitt arbetsrum, vid sitt skrivbord. Husläkaren säger: hjärtat. Men fru Jansen, hushållerskan, säger att det inte stämmer, och hon har skickat mig till herr Lievens.”",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens hade redan rocken på sig. ”En notarie som dör vid sitt skrivbord om kvällen, Hoekstra, med ett nytt testamente under handen. Om det var hjärtat, så äter jag upp min hatt.” Han såg upp mot himlen. ”Ta med Ert paraply. Och lägg märke till klockan.”",

  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Ett högt rum mot kanalen. Böcker upp till taket, ett skrivbord vid fönstret, en spiselhylla med en spiselklocka. Notarien sitter kvar i sin stol.",
  "De notaris": "Notarien",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: ”Inget sår, ingen kamp. Men se på läpparna: blå. Och pupillerna är vidgade.” Lievens: ”Det är inte hjärtat, doktorn. Det är något han har druckit.” På skrivbordet står en namnskylt: E. Brandsma, notarie.",
  "Het portglas": "Portvinsglaset",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Ett glas, halvtomt, med bottensats. Lievens luktar på det. ”Portvin. Och något bittert därunder. Fingerborgsblomma, Hoekstra. Digitalis. För en hjärtsjuk en medicin, för en frisk man ett gift.” Flaskan med portvin står på skänken, orörd sedan jungfrun ställde dit den.",
  "De pendule": "Spiselklockan",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Spiselklockan på spiselhyllan har stannat på tio i tolv. Lievens lyfter den: i dammet på hyllan syns en rektangel, en tumsbredd bredvid foten. ”Den har lyfts upp och ställts tillbaka. Och en pendelklocka som man lyfter stannar. Vem vill få oss att tro att han dog tio i tolv, Hoekstra? Någon som har ett gott alibi för tio i tolv.”",
  "De kaars": "Ljuset",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Ett ljus på skrivbordet, nedbrunnet till en stump av en tums längd. Griet säger att hon tände ett nytt ljus klockan halv tio när hon kom med portvinet; ett sådant ljus brinner i fyra timmar. ”Då hade det brunnit i en timme när hans hand föll över det och släckte det”, säger Lievens. ”Han dog mellan tio och elva, inte tio i tolv. Klockan ljuger.”",
  "Het testament": "Testamentet",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Ett nytt testamente, undertecknat i går och ännu inte deponerat på byrån: allt till ”min hustru Cornelia Brandsma-de Wit” och till Burgerweeshuis, stadens barnhem. Det tidigare testamentet, som ligger bredvid med ett streck över, nämnde bara en arvinge: ”min brorson och skrivare Reinier.” Lievens: ”En man som gjordes arvlös i går, Hoekstra, har ett skäl i dag.”",
  "Een brief": "Ett brev",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Ett brev från rederiet Veenstra & Co., undertecknat D. Veenstra: ”Jag bönfaller Er om anstånd med skulden till våren. Driv mig inte till förtvivlade handlingar.” Hoekstra: ”Ett hot!” Lievens: ”En man som bönfaller, doktorn. Och en man som bönfaller förgiftar inte samma kväll den ende som kan ge honom anstånd.”",
  "Het raam": "Fönstret",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Fönstret är reglat inifrån; regeln sitter fast i färg och damm. Ingen har kommit in den här vägen. ”Den som gjorde det, doktorn, kom genom dörren. Och den som kom genom dörren fanns i huset.”",
  "De prullenmand": "Papperskorgen",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "En hopskrynklad lapp: ”Farbror, jag måste tala med Er i kväll om testamentet. R.” Bläcket är utsmetat på vänstra sidan av varje rad. Lievens: ”Skrivet av en vänsterhänt, med en penna som ännu var våt. Se på folks händer sedan, Hoekstra.”",
  "De briefopener": "Papperskniven",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "En papperskniv av silver, ren och på sin plats. ”Inte använd”, säger Lievens utan att se upp. ”En giftmördare behöver ingen kniv.”",
  "De keuken": "Köket",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Nere, längst bak i huset. En spis, ett glasställ, hushållerskans skåp och bakdörren ut mot gränden.",
  "Het medicijnkastje": "Medicinskåpet",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Hushållerskan Griet Jansens skåp med hennes hjärtdroppar: en liten flaska digitalistinktur från apoteket, fylld förra veckan, nu nästan tom. Pipetten som hör till saknas. Griet: ”Jag tar fem droppar om dagen, herrn. Inte en halv flaska.”",
  "Het glazenrek": "Glasstället",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Klockan halv tio bar Griet upp ett enda glas portvin, som varje kväll. I glasstället står ett andra portvinsglas, diskat och tillbakaställt, men fortfarande vått inuti. Lievens: ”Fortfarande vått vid midnatt. Någon har druckit med honom, Hoekstra, och diskat sitt glas efteråt. En gäst diskar inte sitt glas. Det gör någon i hushållet.”",
  "De achterdeur": "Bakdörren",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet reglar bakdörren varje kväll klockan tio och därefter ytterdörren; i natt var det inte annorlunda. ”Och herr Veenstra?” ”Han gick klockan nio, herrn, genom ytterdörren. Jag släppte ut honom själv; en så stor karl med ett så rött skägg glömmer man inte.” Efter klockan tio fanns alltså ingen i huset utom familjen och jag själv.",
  "Het huishoudboek": "Hushållsboken",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griets hushållsbok: ”9 nov. Frun till Stadsschouwburg, Carmen, med damerna Van Eeghen. Vagn beställd till halv ett.” Lievens: ”Frun kom hem mellan tolv och ett. Om klockan gick rätt kunde det ha varit hon. Men klockan ljuger.”",
  "Het fornuis": "Spisen",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Spisen är kall; köket har inte använts sedan klockan elva. Här har ingenting hänt.",
  "De gang en de kapstok": "Korridoren och kapphängaren",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Korridoren på övervåningen, mellan arbetsrummet och sovrummen. En kapphängare med rockar, ett paraplyställ, dörren till brorsonens rum.",
  "De overjas aan de haak": "Överrocken på kroken",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Brorsonens rock, Reiniers. I innerfickan: en glaspipett med en gummiblåsa, pipetten från Griets lilla flaska. På högra ärmen en fläck portvin. ”Han hällde upp med vänster”, säger Lievens, ”och spillde på höger. En vänsterhänt med bläck på fingrarna och en pipett i fickan. Hoekstra, jag tror att vi är klara.”",
  "De schoenen bij de deur": "Skorna vid dörren",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tre par skor, alla torra; det har regnat hela natten. Ingen från det här huset har varit ute i natt. Bara fruns aftonskor står våta vid ytterdörren: hon kom från operan.",
  "Een operaprogramma": "Ett operaprogram",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "På det lilla bordet: programmet till Carmen, Stadsschouwburg, 9 november, början klockan åtta, med fruns biljett i. Hoekstra: ”Ett alibi till efter midnatt.” Lievens: ”Ett alibi för tio i tolv. Inte för den tid som ljuset visar.”",
  "De kamer van de neef": "Brorsonens rum",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, brorsonen, sover i huset. Han säger att han gick och lade sig klockan tio och inte hörde någonting. Han är vänsterhänt: det är bläck på hans vänstra pekfinger. Hoekstra frågar om han var svartsjuk på sin tant. ”Svartsjuk?” säger Lievens. ”Nej. Arvlös.”",
  "De paraplubak": "Paraplystället",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Ett droppande paraply: doktor Hoekstras. ”Jag sa ju att Ni skulle ta med det”, säger Lievens belåtet.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens tände sin pipa. ”Det var brorsonen, Hoekstra. Reinier läste i går det nya testamentet och såg att han inte längre skulle ärva någonting. Han skrev en lapp till sin farbror, kom in i arbetsrummet efter klockan tio med ett andra glas och hällde upp portvin åt dem båda: sitt eget rent, farbroderns med en halv flaska av Griets hjärtdroppar. Digitalis stoppar ett hjärta. En husläkare ser en gammal man vid sitt skrivbord och tänker: hjärtat. Han hade nästan rätt.”",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "”Därefter diskade han sitt glas, ställde spiselklockan på tio i tolv och gick och lade sig. Klockan tio i tolv hade han ju redan sovit i en timme, och hans tant satt ännu på teatern. Ett prydligt alibi för en tid då ingen dog. Han glömde ljuset. Och han glömde att en pipett inte hör hemma i en innerficka.”",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Polisen hämtade Reinier Brandsma klockan ett. Barnhemmet fick hans pengar. Och jag, som nästan hade glömt paraplyet, skrev ned det.",
});

function zaakNieuw(afl) {
  return { id: afl.id, gezien: {}, gaten: {}, wiewie: {}, pogingen: 0, opgelost: false, begonnen: Date.now(), klaarOp: 0 };

function vrijeWoorden(afl, z) {
  const vrij = new Set();
  for (const s of afl.scenes) for (const h of s.hotspots) if (z.gezien[h.id]) for (const w of h.woorden) vrij.add(w);

  const nieuw = !z.gezien[hotspotId];
  z.gezien[hotspotId] = true;
  const vrijVoor = nieuw ? h.woorden.filter((w) => !afl.scenes.flatMap((s) => s.hotspots).some((x) => x !== h && z.gezien[x.id] && x.woorden.includes(w))) : [];

}

function zetGat(afl, z, gat, woordId) {
  const g = afl.stelling.gaten[gat];
  if (!g) return { ok: false };
  if (woordId === null) { delete z.gaten[gat]; return { ok: true }; }
  const w = woordVan(afl, woordId);
  if (!w || w.soort !== g.soort || !vrijeWoorden(afl, z).some((v) => v.id === woordId)) return { ok: false, reden: 'Dat woord past hier niet.' };
  z.gaten[gat] = woordId;

}
function zetWieWie(afl, z, portret, persoonId) {
  if (!afl.wiewie.includes(portret)) return { ok: false };
  if (persoonId === null) { delete z.wiewie[portret]; return { ok: true }; }
  if (!afl.personen.some((p) => p.id === persoonId)) return { ok: false };
  z.wiewie[portret] = persoonId;

const aantalGaten = (afl) => Object.keys(afl.stelling.gaten).length + afl.wiewie.length;
const aantalIngevuld = (afl, z) => Object.keys(z.gaten).length + Object.keys(z.wiewie).length;


function kijkNa(afl, z) {
