<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Canal House Cases</title>
<style>

:root {
  --papier: #efe4cc; --papier2: #e3d5b5; --lijn: #b9a57f; --inkt: #2a2118; --inkt2: #5a4a38; --rood: #8c2b2b; --goud: #b8860b;
  --kop: Georgia, "Times New Roman", serif; --tekst: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #1b1612; color: var(--inkt); font: 17px/1.5 var(--tekst); overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 0 calc(16px + env(safe-area-inset-bottom, 0px)); }
.scherm { width: min(100%, 520px); background: var(--papier); min-height: 100vh; padding: 14px 16px 24px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); box-shadow: 0 0 40px rgba(0,0,0,.6); }
.kop h1 { font: 700 30px/1.1 var(--kop); letter-spacing: .06em; margin: 6px 0 4px; color: var(--inkt); }
.kop p { margin: 0 0 12px; color: var(--inkt2); font-style: italic; }
.lijst { display: grid; gap: 10px; }
.kaart { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--papier2); }
.kaart .nummer { font: 700 26px var(--kop); color: var(--rood); text-align: center; }
.kaart b { display: block; font: 700 19px var(--kop); }
.kaart small { display: block; color: var(--inkt2); }
.kaart em { display: block; font-size: 14px; color: var(--inkt2); margin-top: 2px; }
.uitleg { color: var(--inkt2); font-size: 15px; margin-top: 16px; }
.versie { font-size: 12px; color: var(--inkt2); text-align: center; margin-top: 20px; }
.verhaal p { margin: 0 0 14px; }
.verhaal p:first-child { font-style: italic; color: var(--inkt2); }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 6px; background: var(--inkt); color: var(--papier); font: 700 18px var(--kop); margin-top: 10px; }
.rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--papier2); border: 1px solid var(--lijn); font: 700 24px/1 var(--kop); color: var(--inkt2); flex: none; }
.zaakkop { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.zaakkop b { font: 700 20px var(--kop); }
.scene-kader { position: relative; border: 3px solid var(--inkt); border-radius: 4px; overflow: hidden; background: #000; }
#scene { display: block; width: 100%; height: auto; aspect-ratio: 320 / 180; }
.hotspots { position: absolute; inset: 0; }
.hotspot { position: absolute; border: 0; background: transparent; }
.hotspot i { position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--goud); border: 1px solid #5a3f00; opacity: 0; }
.hotspot.gezien i { opacity: .9; }
.scene-balk { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font: 700 16px var(--kop); }
.scene-uitleg { margin: 6px 0 0; font-size: 15px; color: var(--inkt2); font-style: italic; }
.voortgang { margin: 8px 0; font-size: 13px; color: var(--inkt2); border-top: 1px solid var(--lijn); padding-top: 6px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
.tabs button { text-wrap: balance; padding: 8px 4px; border-radius: 6px; border: 1px solid var(--lijn); background: var(--papier2); font: 700 13px var(--kop); color: var(--inkt2); }
.tabs button[aria-selected="true"] { background: var(--inkt); color: var(--papier); border-color: var(--inkt); }
.paneel { min-height: 140px; }
.regel { display: block; width: 100%; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--lijn); }
.regel b { font: 700 16px var(--kop); }
.regel small { display: block; color: var(--inkt2); font-size: 13px; }
.leeg { color: var(--inkt2); font-style: italic; font-size: 15px; }
.label { margin: 10px 0 4px; font: 700 12px var(--kop); letter-spacing: .1em; text-transform: uppercase; color: var(--inkt2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--papier2); border: 1px solid var(--lijn); font-size: 15px; }
.chip.nieuw { background: #f7e7b0; border-color: var(--goud); }
.stelling { font-size: 18px; line-height: 2.1; }
select.gat { font: 700 16px var(--kop); color: var(--rood); background: #fff8e6; border: 0; border-bottom: 2px solid var(--inkt); border-radius: 0; padding: 2px 4px; max-width: 100%; }
select.gat:disabled { color: var(--lijn); border-bottom-style: dotted; }
.oordeel { min-height: 24px; font-weight: 700; color: var(--rood); }
.portretten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.portret { min-width: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--papier2); }
.portret canvas { width: 48px; height: 48px; border: 1px solid var(--inkt); grid-row: 1 / 3; }
.portret small { font-size: 12px; color: var(--inkt2); line-height: 1.3; overflow-wrap: break-word; }
.portret select { grid-column: 2; width: 100%; min-width: 0; }
.vel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.vel-doek { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.vel-paneel { position: relative; max-height: 80%; overflow-y: auto; background: var(--papier); border-radius: 14px 14px 0 0; padding: 12px 18px 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: min(100%, 520px); margin: 0 auto; }
.vel-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.vel-kop h2 { font: 700 22px var(--kop); margin: 0; }
.vel-paneel p { margin: 0 0 10px; }

.taalkeuze { display: flex; width: fit-content; align-items: center; gap: 6px; margin: 8px auto 0; font-size: 13px; color: var(--inkt2); }
.taalkeuze select { font: inherit; color: var(--inkt); background: var(--papier2); border: 1px solid var(--lijn); border-radius: 6px; padding: 4px 6px; }

@media (max-width: 340px) { .portretten { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

  "Amsterdam": "Амстердам",
  "Uit de aantekeningen van dokter Bram Hoekstra.": "Из записките на доктор Брам Хукстра.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Беше дъждовно ноемврийско утро на 1908 година, когато прислужницата на нотариуса Еверхардус Брандсма застана на прага ни на Кайзерсграхт. „Нотариусът е мъртъв, докторе. В кабинета си, на писалището. Домашният лекар казва: сърцето. Но госпожа Янсен, икономката, казва, че нещо не е наред, и ме изпрати при господин Ливенс.“",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Ливенс вече беше облякъл палтото си. „Нотариус, който умира вечер на писалището си, Хукстра, с ново завещание под ръката. Ако това е било сърцето, ще си изям шапката.“ Той погледна към небето. „Вземете си чадъра. И внимавайте с часовника.“",
  "Reinier Brandsma": "Райнир Брандсма",
  "Cornelia Brandsma": "Корнелия Брандсма",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Извършител: {dader}. Жертва: {slachtoffer}. Отрова: {gif}. Питие, в което извършителят я е сипал: {drank}. Място: {plaats}. Време: {tijd}. Мотив: {reden}. След това, за да подправи часа на смъртта, извършителят е върнал обратно този предмет: {ding}.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "възрастен господин със сиви бакенбарди и очила за четене",
  "een dame van achter in de dertig in een avondjurk met parels": "дама в края на тридесетте, във вечерна рокля с перли",
  "een jongeman met inkt aan zijn linkerhand": "младеж с мастило по лявата ръка",
  "een zware man met een rode baard": "едър мъж с рижа брада",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "възрастна жена с връзка ключове на престилката",
  "een man met een dokterstas en een natte paraplu": "мъж с лекарска чанта и мокър чадър",
  "De studeerkamer": "Кабинетът",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Висока стая край канала. Книги до тавана, писалище до прозореца, камина с часовник на полицата. Нотариусът още седи в креслото си.",
  "De notaris": "Нотариусът",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Хукстра: „Няма рана, няма следи от борба. Но погледнете устните: сини. И зениците са разширени.“ Ливенс: „Това не е сърцето, докторе. Това е нещо, което е изпил.“ На писалището стои табелка с име: Е. Брандсма, нотариус.",
  "Het portglas": "Чашата за портвайн",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Чаша, наполовина празна, с утайка на дъното. Ливенс я помирисва. „Портвайн. И нещо горчиво под него. Напръстник, Хукстра. Дигиталис. За сърдечно болния лекарство, за здравия човек отрова.“ Бутилката портвайн стои на бюфета, недокосната, откакто прислужницата я е оставила там.",
  "De pendule": "Часовникът на камината",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Часовникът на полицата над камината е спрял на дванадесет без десет. Ливенс го повдига: в праха по полицата се вижда правоъгълник, на палец от основата му. „Бил е вдигнат и върнат обратно. А часовник с махало, който вдигнеш, спира. Кой иска да повярваме, че е умрял в дванадесет без десет, Хукстра? Някой, който има добро алиби за дванадесет без десет.“",
  "De kaars": "Свещта",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Свещ на писалището, изгоряла до огарък колкото палец. Грит казва, че е запалила нова свещ в девет и половина, когато е донесла портвайна; такава свещ гори четири часа. „Значи е горяла едва час, когато ръката му е паднала върху нея и я е угасила“ — казва Ливенс. „Умрял е между десет и единадесет часа, а не в дванадесет без десет. Часовникът лъже.“",
  "Het testament": "Завещанието",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Ново завещание, подписано вчера и още непредадено в кантората: всичко за „съпругата ми Корнелия Брандсма-де Вит“ и за Бюргервесхойс, градското сиропиталище. Старото завещание, което лежи до него, задраскано, посочва само един наследник: „моя племенник и писар Райнир“. Ливенс: „Човек, когото вчера са лишили от наследство, Хукстра, днес има причина.“",
  "Een brief": "Писмо",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Писмо от корабната компания „Веенстра & Ко.“, подписано Д. Веенстра: „Умолявам ви да отсрочите дълга до пролетта. Не ме тласкайте към отчаяни постъпки.“ Хукстра: „Заплаха!“ Ливенс: „Човек, който моли, докторе. А човек, който моли, не трови същата вечер единствения, който може да му даде отсрочка.“",
  "Het raam": "Прозорецът",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Прозорецът е залостен отвътре; резето е залепнало от боя и прах. Оттук не е минавал никой. „Който и да го е сторил, докторе, е влязъл през вратата. А който е влязъл през вратата, е бил в къщата.“",
  "De prullenmand": "Кошчето за хартия",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Смачкана бележка: „Чичо, тази вечер непременно трябва да говоря с вас за завещанието. Р.“ Мастилото е размазано от лявата страна на всеки ред. Ливенс: „Писано е от левичар, с перо, което е било още мокро. По-късно гледайте ръцете, Хукстра.“",
  "De briefopener": "Ножът за писма",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Сребърен нож за писма, чист и на мястото си. „Не е използван“ — казва Ливенс, без да вдигне поглед. „Отровителят няма нужда от нож.“",
  "De keuken": "Кухнята",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Долу, в задната част на къщата. Печка, полица с чаши, шкафът на икономката и задната врата към уличката.",
  "Het medicijnkastje": "Шкафчето с лекарства",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Шкафчето на Грит Янсен, икономката, с капките ѝ за сърце: шишенце тинктура от дигиталис от аптеката, напълнено миналата седмица, сега почти празно. Пипетата, която върви с него, липсва. Грит: „Вземам по пет капки на ден, господине. Не половин шишенце.“",
  "Het glazenrek": "Полицата с чаши",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "В девет и половина Грит е занесла горе една чаша портвайн, както всяка вечер. На полицата стои втора чаша за портвайн, измита и върната на мястото си, но още мокра отвътре. Ливенс: „В полунощ още мокра. Някой е пил с него, Хукстра, и после е измил чашата си. Гостът не мие чашата си. Домашният — да.“",
  "De achterdeur": "Задната врата",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Грит залоства задната врата всяка вечер в десет часа, а след това и входната; снощи не е било иначе. „А господин Веенстра?“ „Той си тръгна в девет, господине, през входната врата. Сама го изпратих; такъв едър мъж с такава рижа брада не се забравя.“ Значи след десет часа в къщата не е имало никой освен семейството и мен.",
  "Het huishoudboek": "Домакинската книга",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Домакинската книга на Грит: „9 ноем. Госпожата в Стадсхаубург, Кармен, с дамите Ван Еген. Файтонът поръчан за дванадесет и половина.“ Ливенс: „Госпожата се е прибрала между дванадесет и един часа. Ако часовникът беше верен, можеше да е тя. Но часовникът лъже.“",
  "Het fornuis": "Печката",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Печката е студена; кухнята не е използвана от единадесет часа насам. Тук не се е случило нищо.",
  "De gang en de kapstok": "Коридорът и закачалката",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Горният коридор, между кабинета и спалните. Закачалка с палта, поставка за чадъри, вратата към стаята на племенника.",
  "De overjas aan de haak": "Палтото на куката",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Палтото на племенника, на Райнир. Във вътрешния джоб: стъклена пипета с гумена капачка, пипетата от шишенцето на Грит. На десния ръкав — петно от портвайн. „Наливал е с лявата ръка — казва Ливенс, — и е разлял върху дясната. Левичар с мастило по пръстите и пипета в джоба. Хукстра, мисля, че приключихме.“",
  "De schoenen bij de deur": "Обувките до вратата",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Три чифта обувки, всички сухи; цяла нощ е валяло. Никой от тази къща не е излизал навън през нощта. Само вечерните обувки на госпожата стоят мокри до входната врата: тя се е върнала от операта.",
  "Een operaprogramma": "Оперна програма",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "На масичката: програмата на „Кармен“, Стадсхаубург, 9 ноември, начало в осем часа, с билета на госпожата в нея. Хукстра: „Алиби до след полунощ.“ Ливенс: „Алиби за дванадесет без десет. Не и за часа, който показва свещта.“",
  "De kamer van de neef": "Стаята на племенника",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Райнир Брандсма, племенникът, живее в къщата. Казва, че си е легнал в десет и не е чул нищо. Левичар е: на левия му показалец има мастило. Хукстра пита дали е ревнувал от леля си. „Ревнувал ли?“ — казва Ливенс. „Не. Лишен от наследство.“",
  "De paraplubak": "Поставката за чадъри",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Чадър, от който капе: чадърът на доктор Хукстра. „Нали ви казах да си го вземете“ — казва доволно Ливенс.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Ливенс запали лулата си. „Беше племенникът, Хукстра. Вчера Райнир е прочел новото завещание и е видял, че вече няма да наследи нищо. Написал е бележка на чичо си, влязъл е в кабинета след десет часа с втора чаша и е налял портвайн и на двамата: на себе си чист, на чичо си — с половин шишенце от сърдечните капки на Грит. Дигиталисът спира сърцето. Домашният лекар вижда старец на писалището му и си мисли: сърцето. Почти е бил прав.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„След това е измил чашата си, нагласил е часовника на дванадесет без десет и си е легнал. В дванадесет без десет той вече спеше от час, а леля му беше още в театъра. Чисто алиби за час, в който никой не е умрял. Забравил е свещта. И е забравил, че на пипетата не ѝ е мястото във вътрешен джоб.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Полицията отведе Райнир Брандсма в един часа. Сиропиталището получи парите му. А аз, който едва не забравих чадъра си, записах всичко.",
});

  "Uit de aantekeningen van dokter Bram Hoekstra.": "Ze zápisků doktora Brama Hoekstry.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Bylo mokré listopadové ráno roku 1908, když u našich dveří na Keizersgrachtu stála služebná notáře Everharda Brandsmy. „Pan notář je mrtvý, pane doktore. Ve své pracovně, u psacího stolu. Domácí lékař říká: srdce. Ale paní Jansen, hospodyně, říká, že to nesedí, a poslala mě za panem Lievensem.“",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens už měl kabát na sobě. „Notář, který večer zemře u psacího stolu, Hoekstro, s čerstvou závětí pod rukou. Jestli to bylo srdce, sním svůj klobouk.“ Pohlédl k nebi. „Vezměte si deštník. A dávejte pozor na hodiny.“",

  "De studeerkamer": "Pracovna",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Vysoký pokoj s okny do kanálu. Knihy až ke stropu, psací stůl u okna, krb, na jehož římse stojí hodiny. Notář stále sedí ve svém křesle.",
  "De notaris": "Notář",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Žádná rána, žádné známky zápasu. Ale podívejte se na rty: modré. A zornice jsou rozšířené.“ Lievens: „To není srdce, doktore. To je něco, co vypil.“ Na stole stojí jmenovka: E. Brandsma, notář.",
  "Het portglas": "Sklenka portského",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Sklenka, napůl prázdná, s usazeninou na dně. Lievens k ní přičichne. „Portské. A pod ním něco hořkého. Náprstník, Hoekstro. Digitalis. Pro nemocného se srdcem lék, pro zdravého muže jed.“ Láhev portského stojí na příborníku, nedotčená od chvíle, kdy ji tam služebná postavila.",
  "De pendule": "Krbové hodiny",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Krbové hodiny na římse se zastavily za deset minut dvanáct. Lievens je zvedne: v prachu na římse je obdélník, o palec vedle podstavce. „Někdo je zvedl a postavil zpátky. A kyvadlové hodiny, které zvednete, se zastaví. Kdo chce, abychom uvěřili, že zemřel za deset minut dvanáct, Hoekstro? Někdo, kdo má na deset minut před dvanáctou dobré alibi.“",
  "De kaars": "Svíčka",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Svíčka na stole, dohořelá na oharek velký jako palec. Griet říká, že v půl desáté zapálila novou svíčku, když nesla portské; taková svíčka hoří čtyři hodiny. „Pak hořela teprve hodinu, když na ni padla jeho ruka a uhasila ji,“ říká Lievens. „Zemřel mezi desátou a jedenáctou, ne za deset minut dvanáct. Hodiny lžou.“",
  "Het testament": "Závěť",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Čerstvá závěť, podepsaná včera a dosud neuložená v kanceláři: všechno „své manželce Cornelii Brandsma-de Wit“ a městskému sirotčinci Burgerweeshuis. Stará závěť, která leží vedle, přeškrtnutá, jmenovala jen jediného dědice: „svého synovce a písaře Reiniera“. Lievens: „Muž, který byl včera vyděděn, Hoekstro, má dnes důvod.“",
  "Een brief": "Dopis",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Dopis od rejdařství Veenstra & Co., podepsaný D. Veenstra: „Snažně Vás prosím o odklad dluhu do jara. Nedohánějte mne k zoufalým činům.“ Hoekstra: „Výhrůžka!“ Lievens: „Muž, který prosí, doktore. A muž, který prosí, neotráví týž večer jediného člověka, který mu může dát odklad.“",
  "Het raam": "Okno",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Okno je zevnitř zajištěné závorou; závora je zalepená barvou a prachem. Tudy nikdo nepřišel. „Kdo to udělal, doktore, přišel dveřmi. A kdo přišel dveřmi, byl už v domě.“",
  "De prullenmand": "Koš na papír",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Zmuchlaný lístek: „Strýčku, musím s Vámi ještě dnes večer mluvit o závěti. R.“ Inkoust je rozmazaný na levé straně každého řádku. Lievens: „Psal to levák, perem, které bylo ještě mokré. Za chvíli se dívejte lidem na ruce, Hoekstro.“",
  "De briefopener": "Nůž na dopisy",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Stříbrný nůž na dopisy, čistý a na svém místě. „Nepoužitý,“ říká Lievens, aniž vzhlédne. „Travič nůž nepotřebuje.“",
  "De keuken": "Kuchyně",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Dole, v zadní části domu. Sporák, stojan se sklenkami, skříňka hospodyně a zadní dveře do uličky.",
  "Het medicijnkastje": "Lékárnička",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Skříňka Griet Jansen, hospodyně, s jejími kapkami na srdce: lahvička tinktury digitalis z lékárny, minulý týden doplněná, teď téměř prázdná. Pipeta, která k ní patří, chybí. Griet: „Beru pět kapek denně, pane. Ne půl lahvičky.“",
  "Het glazenrek": "Stojan na sklenky",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "V půl desáté odnesla Griet nahoru jednu sklenku portského, jako každý večer. Ve stojanu stojí druhá sklenka na portské, umytá a vrácená na místo, ale uvnitř ještě mokrá. Lievens: „O půlnoci ještě mokrá. Někdo s ním pil, Hoekstro, a potom svou sklenku umyl. Host si sklenku nemyje. Člověk z domu ano.“",
  "De achterdeur": "Zadní dveře",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet každý večer v deset zastrčí závoru na zadních dveřích a potom na hlavních; včera v noci tomu nebylo jinak. „A pan Veenstra?“ „Ten odešel v devět, pane, hlavními dveřmi. Sama jsem ho vyprovodila; takového velkého muže s takovým zrzavým plnovousem člověk nezapomene.“ Po desáté tedy v domě nebyl nikdo kromě rodiny a mě.",
  "Het huishoudboek": "Hospodářská kniha",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Hospodářská kniha Griet: „9. list. Paní do divadla Stadsschouwburg na Carmen, s dámami Van Eeghen. Kočár objednán na půl jednou.“ Lievens: „Paní se vrátila domů mezi dvanáctou a jednou. Kdyby hodiny šly správně, mohla to být ona. Ale hodiny lžou.“",
  "Het fornuis": "Sporák",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Sporák je studený; v kuchyni se od jedenácti nevařilo. Tady se nic nestalo.",
  "De gang en de kapstok": "Chodba a věšák",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Chodba v patře, mezi pracovnou a ložnicemi. Věšák s kabáty, stojan na deštníky, dveře do synovcova pokoje.",
  "De overjas aan de haak": "Svrchník na háčku",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Synovcův kabát, Reinierův. Ve vnitřní kapse: skleněná pipeta s gumovým balónkem, pipeta z lahvičky Griet. Na pravém rukávu skvrna od portského. „Naléval levou rukou,“ říká Lievens, „a polil si pravý rukáv. Levák s inkoustem na prstech a pipetou v kapse. Hoekstro, myslím, že jsme hotovi.“",
  "De schoenen bij de deur": "Boty u dveří",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tři páry bot, všechny suché; přitom celou noc pršelo. Nikdo z tohoto domu nebyl v noci venku. Jen paniny večerní střevíčky stojí mokré u hlavních dveří: vracela se z opery.",
  "Een operaprogramma": "Operní program",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na stolku: program Carmen, Stadsschouwburg, 9. listopadu, začátek v osm, a v něm vstupenka paní. Hoekstra: „Alibi až do půlnoci a déle.“ Lievens: „Alibi na deset minut před dvanáctou. Ne na dobu, kterou ukazuje svíčka.“",
  "De kamer van de neef": "Synovcův pokoj",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, synovec, bydlí v domě. Říká, že šel v deset spát a nic neslyšel. Je levák: na levém ukazováčku má inkoust. Hoekstra se ptá, zda nežárlil na svou tetu. „Žárlil?“ říká Lievens. „Ne. Byl vyděděn.“",
  "De paraplubak": "Stojan na deštníky",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Deštník, ze kterého kape voda: deštník doktora Hoekstry. „Říkal jsem vám přece, ať si ho vezmete,“ říká Lievens spokojeně.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens si zapálil dýmku. „Byl to synovec, Hoekstro. Reinier si včera přečetl novou závěť a viděl, že už nic nezdědí. Napsal strýci lístek, přišel po desáté do pracovny s druhou sklenkou a nalil oběma portské: sobě čisté, strýci s půl lahvičkou Grietiných kapek na srdce. Digitalis zastaví srdce. Domácí lékař vidí starého muže u psacího stolu a pomyslí si: srdce. Skoro měl pravdu.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Potom umyl svou sklenku, nařídil krbové hodiny na deset minut před dvanáctou a šel spát. Deset minut před dvanáctou přece už hodinu spal a jeho teta byla ještě v divadle. Úhledné alibi na dobu, kdy nikdo nezemřel. Zapomněl na svíčku. A zapomněl, že pipeta do vnitřní kapsy nepatří.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policie si pro Reiniera Brandsmu přišla v jednu. Sirotčinec dostal jeho peníze. A já, který jsem málem zapomněl deštník, jsem to všechno sepsal.",
});

  "Uit de aantekeningen van dokter Bram Hoekstra.": "Fra doktor Bram Hoekstras optegnelser.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Det var en våd novembermorgen i 1908, da notar Everhardus Brandsmas tjenestepige stod på vores trappe ved Keizersgracht. »Notaren er død, doktor. I sit arbejdsværelse, ved sit skrivebord. Huslægen siger: hjertet. Men fru Jansen, husholdersken, siger, at det ikke stemmer, og hun har sendt mig til hr. Lievens.«",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens havde allerede frakken på. »En notar, der dør ved sit skrivebord om aftenen, Hoekstra, med et nyt testamente under hånden. Hvis det var hjertet, æder jeg min hat.« Han så op mod himlen. »Tag Deres paraply med. Og læg mærke til uret.«",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Gerningsmanden, {dader}, forgiftede {slachtoffer} med {gif} i {drank}, i {plaats}, mellem klokken {tijd}, på grund af {reden}. Derefter satte gerningsmanden {ding} tilbage for at forfalske dødstidspunktet.",

  "De studeerkamer": "Arbejdsværelset",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Et højt værelse ud til kanalen. Bøger til loftet, et skrivebord ved vinduet, en kaminhylde med et kaminur. Notaren sidder stadig i sin stol.",
  "De notaris": "Notaren",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: »Intet sår, ingen kamp. Men se på læberne: blå. Og pupillerne er udvidede.« Lievens: »Det er ikke hjertet, doktor. Det er noget, han har drukket.« På skrivebordet står et navneskilt: E. Brandsma, notar.",
  "Het portglas": "Portvinsglasset",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Et glas, halvt tømt, med bundfald i bunden. Lievens lugter til det. »Portvin. Og noget bittert nedenunder. Fingerbøl, Hoekstra. Digitalis. For en hjertepatient en medicin, for en rask mand en gift.« Flasken med portvin står på skænken, urørt siden tjenestepigen satte den der.",
  "De pendule": "Kaminuret",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Kaminuret på kaminhylden står stille på ti minutter i tolv. Lievens løfter det: I støvet på hylden ses et rektangel, en tommes bredde ved siden af foden. »Det er blevet løftet og sat tilbage. Og et pendulur, man løfter, går i stå. Hvem vil have os til at tro, at han døde ti minutter i tolv, Hoekstra? En, der har et godt alibi for ti minutter i tolv.«",
  "De kaars": "Lyset",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Et lys på skrivebordet, brændt ned til en stump på en tommelfingers længde. Griet siger, at hun tændte et nyt lys klokken halv ti, da hun bragte portvinen; sådan et lys brænder i fire timer. »Så havde det brændt i en time, da hans hånd faldt ned på det og slukkede det,« siger Lievens. »Han døde mellem ti og elleve, ikke ti minutter i tolv. Uret lyver.«",
  "Het testament": "Testamentet",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Et nyt testamente, underskrevet i går og endnu ikke deponeret på kontoret: alt til »min hustru Cornelia Brandsma-de Wit« og til Burgerweeshuis, byens børnehjem. Det tidligere testamente, der ligger ved siden af med en streg over, nævnte kun én arving: »min nevø og fuldmægtig Reinier.« Lievens: »En mand, der blev gjort arveløs i går, Hoekstra, har en grund i dag.«",
  "Een brief": "Et brev",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Et brev fra rederiet Veenstra & Co., underskrevet D. Veenstra: »Jeg bønfalder Dem om henstand med gælden til foråret. Driv mig ikke til desperate handlinger.« Hoekstra: »En trussel!« Lievens: »En mand, der bønfalder, doktor. Og en mand, der bønfalder, forgifter ikke samme aften den eneste, der kan give ham henstand.«",
  "Het raam": "Vinduet",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Vinduet er låst indefra; slåen sidder fast i maling og støv. Ingen er kommet ind denne vej. »Den, der gjorde det, doktor, kom gennem døren. Og den, der kom gennem døren, var i huset.«",
  "De prullenmand": "Papirkurven",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "En sammenkrøllet seddel: »Onkel, jeg må tale med Dem i aften om testamentet. R.« Blækket er udtværet i venstre side af hver linje. Lievens: »Skrevet af en kejthåndet med en pen, der stadig var våd. Læg mærke til hænderne om lidt, Hoekstra.«",
  "De briefopener": "Papirkniven",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "En papirkniv af sølv, ren og på sin plads. »Ikke brugt,« siger Lievens uden at se op. »En giftmorder har ikke brug for en kniv.«",
  "De keuken": "Køkkenet",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Nedenunder, bagest i huset. Et komfur, et glasstativ, husholderskens skab og bagdøren ud til gyden.",
  "Het medicijnkastje": "Medicinskabet",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Husholdersken Griet Jansens skab med hendes hjertedråber: en lille flaske digitalistinktur fra apoteket, fyldt i sidste uge, nu næsten tom. Pipetten, der hører til, mangler. Griet: »Jeg tager fem dråber om dagen, min herre. Ikke en halv flaske.«",
  "Het glazenrek": "Glasstativet",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Klokken halv ti bragte Griet ét glas portvin op, som hver aften. I stativet står et andet portvinsglas, vasket op og sat tilbage, men stadig vådt indvendig. Lievens: »Stadig vådt ved midnat. Nogen har drukket med ham, Hoekstra, og vasket sit glas op bagefter. En gæst vasker ikke sit glas op. Det gør en af husstanden.«",
  "De achterdeur": "Bagdøren",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet skyder slåen for bagdøren hver aften klokken ti og derefter for hoveddøren; i nat var det ikke anderledes. »Og hr. Veenstra?« »Han gik klokken ni, min herre, gennem hoveddøren. Jeg lukkede ham selv ud; sådan en stor mand med sådan et rødt skæg glemmer man ikke.« Efter klokken ti var der altså ingen i huset ud over familien og mig selv.",
  "Het huishoudboek": "Husholdningsbogen",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griets husholdningsbog: »9. nov. Fruen til Stadsschouwburg, Carmen, med damerne Van Eeghen. Vogn bestilt til halv et.« Lievens: »Fruen kom hjem mellem tolv og et. Hvis uret gik rigtigt, kunne det have været hende. Men uret lyver.«",
  "Het fornuis": "Komfuret",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Komfuret er koldt; køkkenet har ikke været brugt siden klokken elleve. Her er intet sket.",
  "De gang en de kapstok": "Gangen og knagerækken",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Gangen ovenpå, mellem arbejdsværelset og soveværelserne. En knagerække med frakker, et paraplystativ, døren til nevøens værelse.",
  "De overjas aan de haak": "Overfrakken på knagen",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Nevøens frakke, Reiniers. I inderlommen: en glaspipette med en gummibold, pipetten fra Griets lille flaske. På højre ærme en plet portvin. »Han skænkede med venstre,« siger Lievens, »og spildte på højre. En kejthåndet med blæk på fingrene og en pipette i lommen. Hoekstra, jeg tror, vi er færdige.«",
  "De schoenen bij de deur": "Skoene ved døren",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tre par sko, alle tørre; det har regnet hele natten. Ingen fra dette hus har været ude i nat. Kun fruens aftensko står våde ved hoveddøren: Hun kom fra operaen.",
  "Een operaprogramma": "Et operaprogram",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "På det lille bord: programmet for Carmen, Stadsschouwburg, 9. november, begyndelse klokken otte, med fruens adgangskort i. Hoekstra: »Et alibi til efter midnat.« Lievens: »Et alibi for ti minutter i tolv. Ikke for det tidspunkt, lyset viser.«",
  "De kamer van de neef": "Nevøens værelse",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, nevøen, sover i huset. Han siger, at han gik i seng klokken ti og ikke hørte noget. Han er kejthåndet: Der er blæk på hans venstre pegefinger. Hoekstra spørger, om han var jaloux på sin tante. »Jaloux?« siger Lievens. »Nej. Gjort arveløs.«",
  "De paraplubak": "Paraplystativet",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "En dryppende paraply: doktor Hoekstras. »Jeg sagde jo, at De skulle tage den med,« siger Lievens tilfreds.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens tændte sin pibe. »Det var nevøen, Hoekstra. Reinier læste i går det nye testamente og så, at han ikke længere skulle arve noget. Han skrev en seddel til sin onkel, kom ind i arbejdsværelset efter klokken ti med et andet glas og skænkede portvin op til dem begge: sit eget rent, onklens med en halv flaske af Griets hjertedråber. Digitalis standser et hjerte. En huslæge ser en gammel mand ved hans skrivebord og tænker: hjertet. Han havde næsten ret.«",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "»Derefter vaskede han sit glas op, stillede kaminuret på ti minutter i tolv og gik i seng. Klokken ti minutter i tolv havde han jo allerede sovet i en time, og hans tante sad stadig i teatret. Et nydeligt alibi for et tidspunkt, hvor ingen døde. Han glemte lyset. Og han glemte, at en pipette ikke hører hjemme i en inderlomme.«",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Politiet hentede Reinier Brandsma klokken et. Børnehjemmet fik hans penge. Og jeg, der næsten havde glemt paraplyen, skrev det ned.",
});

  "Uit de aantekeningen van dokter Bram Hoekstra.": "Aus den Aufzeichnungen von Doktor Bram Hoekstra.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Es war ein nasser Novembermorgen im Jahre 1908, als das Dienstmädchen des Notars Everhardus Brandsma vor unserer Tür an der Keizersgracht stand. „Der Notar ist tot, Herr Doktor. In seinem Arbeitszimmer, an seinem Schreibtisch. Der Hausarzt sagt: das Herz. Aber Frau Jansen, die Haushälterin, sagt, dass das nicht stimmt, und sie hat mich zu Herrn Lievens geschickt.“",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens hatte seinen Mantel schon an. „Ein Notar, der abends an seinem Schreibtisch stirbt, Hoekstra, mit einem frischen Testament unter der Hand. Wenn das das Herz war, fresse ich meinen Hut.“ Er blickte zum Himmel. „Nehmen Sie Ihren Regenschirm mit. Und achten Sie auf die Uhr.“",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Der Täter: {dader}. Das Opfer: {slachtoffer}. Das Gift: {gif}; das Getränk, in dem es gereicht wurde: {drank}. Der Tatort: {plaats}. Die Tatzeit: zwischen {tijd}. Das Motiv: {reden}. Danach stellte der Täter einen Gegenstand zurück, um eine falsche Todesstunde vorzutäuschen: {ding}.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "ein älterer Herr mit grauem Backenbart und Lesebrille",
  "een dame van achter in de dertig in een avondjurk met parels": "eine Dame Ende dreißig im Abendkleid mit Perlen",
  "een jongeman met inkt aan zijn linkerhand": "ein junger Mann mit Tinte an der linken Hand",
  "een zware man met een rode baard": "ein schwerer Mann mit rotem Bart",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "eine ältere Frau mit einem Schlüsselbund an der Schürze",
  "een man met een dokterstas en een natte paraplu": "ein Mann mit Arzttasche und nassem Regenschirm",
  "De studeerkamer": "Das Arbeitszimmer",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Ein hoher Raum an der Gracht. Bücher bis zur Decke, ein Schreibtisch am Fenster, ein Kaminsims mit einer Kaminuhr. Der Notar sitzt noch in seinem Sessel.",
  "De notaris": "Der Notar",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Keine Wunde, kein Kampf. Aber sehen Sie sich die Lippen an: blau. Und die Pupillen sind erweitert.“ Lievens: „Das ist nicht das Herz, Doktor. Das ist etwas, das er getrunken hat.“ Auf dem Schreibtisch steht ein Namensschild: E. Brandsma, Notar.",
  "Het portglas": "Das Portweinglas",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Ein Glas, halb leer, mit Bodensatz. Lievens riecht daran. „Portwein. Und etwas Bitteres darunter. Fingerhut, Hoekstra. Digitalis. Für einen Herzkranken eine Arznei, für einen gesunden Mann ein Gift.“ Die Flasche Portwein steht auf der Anrichte, unberührt, seit das Dienstmädchen sie dort abstellte.",
  "De pendule": "Die Kaminuhr",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Die Kaminuhr auf dem Sims ist um zehn vor zwölf stehen geblieben. Lievens hebt sie an: Im Staub auf dem Sims zeichnet sich ein Rechteck ab, eine Daumenbreite neben ihrem Fuß. „Sie ist hochgehoben und wieder hingestellt worden. Und eine Pendeluhr, die man hochhebt, bleibt stehen. Wer will uns glauben machen, dass er um zehn vor zwölf starb, Hoekstra? Jemand, der für zehn vor zwölf ein gutes Alibi hat.“",
  "De kaars": "Die Kerze",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Eine Kerze auf dem Schreibtisch, heruntergebrannt zu einem daumenlangen Stummel. Griet sagt, sie habe um halb zehn eine neue Kerze angezündet, als sie den Portwein brachte; eine solche Kerze brennt vier Stunden. „Dann hatte sie eine Stunde gebrannt, als seine Hand darauf fiel und sie auslöschte“, sagt Lievens. „Er starb zwischen zehn und elf, nicht um zehn vor zwölf. Die Uhr lügt.“",
  "Het testament": "Das Testament",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Ein frisches Testament, gestern unterzeichnet und noch nicht in der Kanzlei hinterlegt: alles an „meine Ehefrau Cornelia Brandsma-de Wit“ und an das Burgerweeshuis, das städtische Waisenhaus. Das frühere Testament, das durchgestrichen daneben liegt, nannte nur einen Erben: „meinen Neffen und Schreiber Reinier.“ Lievens: „Ein Mann, der gestern enterbt wurde, Hoekstra, hat heute einen Grund.“",
  "Een brief": "Ein Brief",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Ein Brief der Reederei Veenstra & Co., unterzeichnet D. Veenstra: „Ich flehe Sie an, mir die Schulden bis zum Frühjahr zu stunden. Treiben Sie mich nicht zu Verzweiflungstaten.“ Hoekstra: „Eine Drohung!“ Lievens: „Ein Mann, der fleht, Doktor. Und ein Mann, der fleht, vergiftet nicht am selben Abend den Einzigen, der ihm Aufschub gewähren kann.“",
  "Het raam": "Das Fenster",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Das Fenster ist von innen verriegelt; der Riegel sitzt fest in Farbe und Staub. Hier ist niemand hereingekommen. „Wer es auch war, Doktor, kam durch die Tür. Und wer durch die Tür kam, war im Haus.“",
  "De prullenmand": "Der Papierkorb",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Ein zerknüllter Zettel: „Onkel, ich muss Sie heute Abend noch wegen des Testaments sprechen. R.“ Die Tinte ist an der linken Seite jeder Zeile verwischt. Lievens: „Geschrieben von einem Linkshänder, mit einer Feder, die noch nass war. Achten Sie nachher auf die Hände, Hoekstra.“",
  "De briefopener": "Der Brieföffner",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Ein silberner Brieföffner, sauber und an seinem Platz. „Nicht benutzt“, sagt Lievens, ohne aufzusehen. „Ein Giftmörder braucht kein Messer.“",
  "De keuken": "Die Küche",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Unten, im hinteren Teil des Hauses. Ein Herd, ein Gläserregal, der Schrank der Haushälterin und die Hintertür zur Gasse.",
  "Het medicijnkastje": "Das Arzneischränkchen",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Das Schränkchen von Griet Jansen, der Haushälterin, mit ihren Herztropfen: ein Fläschchen Digitalistinktur aus der Apotheke, vorige Woche gefüllt, jetzt fast leer. Die Pipette, die dazugehört, fehlt. Griet: „Ich nehme fünf Tropfen am Tag, mein Herr. Nicht ein halbes Fläschchen.“",
  "Het glazenrek": "Das Gläserregal",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Griet brachte um halb zehn ein einziges Glas Portwein nach oben, wie jeden Abend. Im Regal steht ein zweites Portweinglas, abgespült und zurückgestellt, aber innen noch nass. Lievens: „Um Mitternacht noch nass. Jemand hat mit ihm getrunken, Hoekstra, und sein Glas danach abgespült. Ein Gast spült sein Glas nicht ab. Ein Hausgenosse schon.“",
  "De achterdeur": "Die Hintertür",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet verriegelt die Hintertür jeden Abend um zehn Uhr und danach die Vordertür; letzte Nacht war es nicht anders. „Und Herr Veenstra?“ „Der ging um neun Uhr, mein Herr, durch die Vordertür. Ich habe ihn selbst hinausgelassen; so einen großen Mann mit so einem roten Bart vergisst man nicht.“ Nach zehn Uhr war also niemand im Haus außer der Familie und mir selbst.",
  "Het huishoudboek": "Das Haushaltsbuch",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griets Haushaltsbuch: „9. Nov. Gnädige Frau in die Stadsschouwburg, Carmen, mit den Damen Van Eeghen. Kutsche für halb eins bestellt.“ Lievens: „Die gnädige Frau kam zwischen zwölf und ein Uhr nach Hause. Wenn die Uhr richtig ginge, könnte sie es gewesen sein. Aber die Uhr lügt.“",
  "Het fornuis": "Der Herd",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Der Herd ist kalt; die Küche ist seit elf Uhr nicht benutzt worden. Hier ist nichts geschehen.",
  "De gang en de kapstok": "Der Flur und die Garderobe",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Der Flur oben, zwischen dem Arbeitszimmer und den Schlafzimmern. Eine Garderobe mit Mänteln, ein Schirmständer, die Tür zum Zimmer des Neffen.",
  "De overjas aan de haak": "Der Überzieher am Haken",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Der Mantel des Neffen, Reinier. In der Innentasche: eine gläserne Pipette mit einem Gummihütchen, die Pipette aus Griets Fläschchen. Auf dem rechten Ärmel ein Portweinfleck. „Er hat mit links eingeschenkt“, sagt Lievens, „und rechts gekleckert. Ein Linkshänder mit Tinte an den Fingern und einer Pipette in der Tasche. Hoekstra, ich glaube, wir sind fertig.“",
  "De schoenen bij de deur": "Die Schuhe an der Tür",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Drei Paar Schuhe, alle trocken; es hat die ganze Nacht geregnet. Niemand aus diesem Haus war letzte Nacht draußen. Nur die Abendschuhe der gnädigen Frau stehen nass an der Vordertür; sie kam ja aus der Oper.",
  "Een operaprogramma": "Ein Opernprogramm",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Auf dem Tischchen: das Programm von Carmen, Stadsschouwburg, 9. November, Beginn acht Uhr, mit der Eintrittskarte der gnädigen Frau darin. Hoekstra: „Ein Alibi bis nach Mitternacht.“ Lievens: „Ein Alibi für zehn vor zwölf. Nicht für die Zeit, die die Kerze anzeigt.“",
  "De kamer van de neef": "Das Zimmer des Neffen",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, der Neffe, schläft im Haus. Er sagt, er sei um zehn Uhr zu Bett gegangen und habe nichts gehört. Er ist Linkshänder: An seinem linken Zeigefinger klebt Tinte. Hoekstra fragt, ob er eifersüchtig auf seine Tante war. „Eifersüchtig?“, sagt Lievens. „Nein. Enterbt.“",
  "De paraplubak": "Der Schirmständer",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Ein tropfender Regenschirm: der von Doktor Hoekstra. „Ich hatte doch gesagt, Sie sollten ihn mitnehmen“, sagt Lievens zufrieden.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens zündete seine Pfeife an. „Es war der Neffe, Hoekstra. Reinier las gestern das neue Testament und sah, dass er nichts mehr erben würde. Er schrieb seinem Onkel einen Zettel, betrat nach zehn Uhr mit einem zweiten Glas das Arbeitszimmer und schenkte ihnen beiden Portwein ein: sein eigenes Glas sauber, das seines Onkels mit einem halben Fläschchen von Griets Herztropfen. Digitalis bringt ein Herz zum Stillstand. Ein Hausarzt sieht einen alten Mann an seinem Schreibtisch und denkt: das Herz. Beinahe hatte er recht.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Danach spülte er sein Glas ab, stellte die Kaminuhr auf zehn vor zwölf und ging zu Bett. Um zehn vor zwölf schlief er ja schon seit einer Stunde, und seine Tante saß noch im Theater. Ein tadelloses Alibi für eine Zeit, zu der niemand starb. Er vergaß die Kerze. Und er vergaß, dass eine Pipette nicht in eine Innentasche gehört.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Die Polizei holte Reinier Brandsma um ein Uhr ab. Das Waisenhaus bekam sein Geld. Und ich, der beinahe den Regenschirm vergessen hätte, schrieb alles auf.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Ήταν ένα υγρό πρωινό του Νοεμβρίου του 1908, όταν η υπηρέτρια του συμβολαιογράφου Έβερχαρντους Μπράντσμα στάθηκε στο κατώφλι μας, στην Κάιζερσχραχτ. «Ο συμβολαιογράφος είναι νεκρός, γιατρέ. Στο σπουδαστήριό του, στο γραφείο του. Ο οικογενειακός γιατρός λέει: η καρδιά. Όμως η κυρία Γιάνσεν, η οικονόμος, λέει ότι κάτι δεν στέκει, και με έστειλε στον κύριο Λίβενς.»",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Ο Λίβενς φορούσε ήδη το παλτό του. «Ένας συμβολαιογράφος που πεθαίνει το βράδυ στο γραφείο του, Χούκστρα, με μια καινούργια διαθήκη κάτω από το χέρι του. Αν αυτό ήταν η καρδιά, να φάω το καπέλο μου.» Κοίταξε τον ουρανό. «Πάρτε την ομπρέλα σας. Και προσέξτε το ρολόι.»",
