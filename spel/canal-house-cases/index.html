  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Aukštas kambarys prie kanalo. Knygos iki pat lubų, rašomasis stalas prie lango, židinys, o ant jo atbrailos laikrodis. Notaras vis dar sėdi savo kėdėje.",
  "De notaris": "Notaras",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Jokios žaizdos, jokių grumtynių pėdsakų. Bet pažvelkite į lūpas: mėlynos. Ir vyzdžiai išsiplėtę.“ Lievensas: „Tai ne širdis, daktare. Tai kažkas, ką jis išgėrė.“ Ant rašomojo stalo stovi lentelė su pavarde: E. Brandsma, notaras.",
  "Het portglas": "Portveino taurė",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Taurė, pustuštė, su nuosėdomis dugne. Lievensas ją pauosto. „Portveinas. O po juo kažkas kartaus. Rusmenė, Hoekstra. Digitalis. Širdies ligoniui vaistas, sveikam vyrui nuodai.“ Portveino butelis stovi ant bufeto, nepaliestas nuo tada, kai jį ten pastatė tarnaitė.",
  "De pendule": "Židinio laikrodis",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Židinio laikrodis ant atbrailos sustojęs be dešimties dvylika. Lievensas jį pakelia: dulkėse ant atbrailos matyti stačiakampis, per nykštį šalia jo kojelės. „Jis buvo pakeltas ir padėtas atgal. O švytuoklinis laikrodis, kai jį pakeli, sustoja. Kas nori, kad patikėtume, jog jis mirė be dešimties dvylika, Hoekstra? Tas, kas be dešimties dvylika turi gerą alibi.“",
  "De kaars": "Žvakė",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Žvakė ant rašomojo stalo, sudegusi iki nykščio ilgio galiuko. Griet sako, kad pusę dešimtos uždegė naują žvakę, kai atnešė portveiną; tokia žvakė dega keturias valandas. „Vadinasi, ji degė tik valandą, kai ant jos nukrito jo ranka ir ją užgesino, – sako Lievensas. – Jis mirė tarp dešimtos ir vienuoliktos, o ne be dešimties dvylika. Laikrodis meluoja.“",
  "Het testament": "Testamentas",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Šviežias testamentas, pasirašytas vakar ir dar neperduotas saugoti į kontorą: viskas „mano sutuoktinei Corneliai Brandsmai-de Wit“ ir Burgerweeshuis, miesto našlaičių prieglaudai. Senasis testamentas, gulintis greta perbrauktas, nurodė tik vieną įpėdinį: „mano sūnėną ir raštininką Reinierą“. Lievensas: „Žmogus, kurį vakar paliko be palikimo, Hoekstra, šiandien turi motyvą.“",
  "Een brief": "Laiškas",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Laiškas iš laivininkystės bendrovės Veenstra & Co., pasirašytas D. Veenstros: „Maldauju jus atidėti skolos mokėjimą iki pavasario. Neverskite manęs griebtis beviltiškų žingsnių.“ Hoekstra: „Grasinimas!“ Lievensas: „Maldaujantis žmogus, daktare. O žmogus, kuris maldauja, tą patį vakarą nenunuodija vienintelio, kuris gali jam suteikti atokvėpio.“",
  "Het raam": "Langas",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Langas užsklęstas iš vidaus; sklendė įstrigusi dažuose ir dulkėse. Pro čia niekas nėjo. „Kas tai padarė, daktare, atėjo pro duris. O kas atėjo pro duris, tas jau buvo namuose.“",
  "De prullenmand": "Popierių krepšys",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Suglamžytas raštelis: „Dėde, šįvakar dar turiu su jumis pasikalbėti apie testamentą. R.“ Kiekvienos eilutės kairėje pusėje rašalas išteptas. Lievensas: „Rašė kairiarankis, plunksna, kuri dar buvo šlapia. Vėliau atkreipkite dėmesį į rankas, Hoekstra.“",
  "De briefopener": "Laiškų peiliukas",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Sidabrinis laiškų peiliukas, švarus ir savo vietoje. „Nenaudotas, – sako Lievensas, net nepakėlęs akių. – Nuodytojui peilio nereikia.“",
  "De keuken": "Virtuvė",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Apačioje, namo gale. Viryklė, lentyna su taurėmis, ekonomės spintelė ir galinės durys į skersgatvį.",
  "Het medicijnkastje": "Vaistų spintelė",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Griet Jansen, ekonomės, spintelė su jos širdies lašais: buteliukas digitalis tinktūros iš vaistinės, pripildytas praėjusią savaitę, dabar beveik tuščias. Prie jo priklausančios pipetės nėra. Griet: „Aš geriu po penkis lašus per dieną, pone. Ne pusę buteliuko.“",
  "Het glazenrek": "Taurių lentyna",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Pusę dešimtos Griet, kaip kas vakarą, užnešė į viršų vieną taurę portveino. Lentynoje stovi antra portveino taurė, išplauta ir padėta atgal, bet viduje dar šlapia. Lievensas: „Vidurnaktį dar šlapia. Kažkas gėrė kartu su juo, Hoekstra, o paskui savo taurę išsiplovė. Svečias savo taurės neplauna. Namiškis plauna.“",
  "De achterdeur": "Galinės durys",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet kas vakarą dešimtą užsklendžia galines duris, o po to ir paradines; šiąnakt nebuvo kitaip. „O ponas Veenstra?“ „Jis išėjo devintą, pone, pro paradines duris. Pati jį išlydėjau; tokio didelio vyro su tokia raudona barzda nepamirši.“ Taigi po dešimtos namuose nebuvo nieko, išskyrus šeimą ir mane pačią.",
  "Het huishoudboek": "Namų ūkio knyga",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Griet namų ūkio knyga: „Lapkr. 9 d. Ponia į Stadsschouwburg teatrą, Carmen, su poniomis Van Eeghen. Karieta užsakyta pusei pirmos.“ Lievensas: „Ponia grįžo namo tarp dvyliktos ir pirmos. Jei laikrodis rodytų teisingai, tai galėjo būti ji. Bet laikrodis meluoja.“",
  "Het fornuis": "Viryklė",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Viryklė šalta; virtuvė nenaudota nuo vienuoliktos. Čia nieko neįvyko.",
  "De gang en de kapstok": "Koridorius ir drabužių kabykla",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Viršutinis koridorius tarp kabineto ir miegamųjų. Kabykla su paltais, skėčių stovas, durys į sūnėno kambarį.",
  "De overjas aan de haak": "Paltas ant kabliuko",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Sūnėno Reiniero paltas. Vidinėje kišenėje: stiklinė pipetė su guminiu galiuku, pipetė iš Griet buteliuko. Ant dešinės rankovės portveino dėmė. „Jis pylė kaire ranka, – sako Lievensas, – o apliejo dešinę. Kairiarankis su rašalu ant pirštų ir pipete kišenėje. Hoekstra, manau, kad mes baigėme.“",
  "De schoenen bij de deur": "Batai prie durų",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trys poros batų, visi sausi; visą naktį lijo. Šiąnakt niekas iš šių namų nebuvo išėjęs į lauką. Tik ponios vakariniai bateliai stovi šlapi prie paradinių durų: ji grįžo iš operos.",
  "Een operaprogramma": "Operos programėlė",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Ant staliuko: Carmen programėlė, Stadsschouwburg, lapkričio 9 d., pradžia aštuntą, su ponios bilietu viduje. Hoekstra: „Alibi iki vidurnakčio ir dar ilgiau.“ Lievensas: „Alibi laikui be dešimties dvylika. Ne tam laikui, kurį rodo žvakė.“",
  "De kamer van de neef": "Sūnėno kambarys",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinieras Brandsma, sūnėnas, gyvena šiuose namuose. Jis sako, kad dešimtą nuėjo miegoti ir nieko negirdėjo. Jis kairiarankis: ant kairiojo smiliaus rašalas. Hoekstra klausia, ar jis nepavydėjo savo tetai. „Pavydėjo? – sako Lievensas. – Ne. Liko be palikimo.“",
  "De paraplubak": "Skėčių stovas",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Lašantis skėtis: daktaro Hoekstros. „Juk sakiau, kad jį pasiimtumėte“, – patenkintas sako Lievensas.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievensas užsidegė pypkę. „Tai buvo sūnėnas, Hoekstra. Vakar Reinieras perskaitė naująjį testamentą ir pamatė, kad nieko nebepaveldės. Jis parašė dėdei raštelį, po dešimtos įėjo į kabinetą su antra taure ir įpylė jiems abiem portveino: sau švaraus, dėdei su puse buteliuko Griet širdies lašų. Digitalis sustabdo širdį. Šeimos gydytojas pamato seną žmogų prie rašomojo stalo ir pagalvoja: širdis. Jis beveik buvo teisus.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Paskui jis išsiplovė savo taurę, nustatė židinio laikrodžio rodykles ties be dešimties dvylika ir nuėjo miegoti. Be dešimties dvylika jis juk jau valandą miegojo, o jo teta dar buvo teatre. Puikus alibi laikui, kai niekas nemirė. Jis pamiršo žvakę. Ir pamiršo, kad pipetei ne vieta vidinėje kišenėje.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policija išsivedė Reinierą Brandsmą pirmą valandą nakties. Našlaičių prieglauda gavo jo pinigus. O aš, vos nepamiršęs skėčio, visa tai užrašiau.",
});

  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Augsta istaba ar logiem uz kanālu. Grāmatas līdz pat griestiem, rakstāmgalds pie loga, kamīns un uz tā dzegas pulkstenis. Notārs joprojām sēž savā krēslā.",

  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hukstra: „Ne brūces, ne cīņas pēdu. Bet paskatieties uz lūpām: zilas. Un acu zīlītes ir paplašinātas.“ Līvenss: „Tā nav sirds, doktor. Tas ir kaut kas, ko viņš izdzēris.“ Uz rakstāmgalda stāv plāksnīte ar vārdu: E. Brandsma, notārs.",
  "Het portglas": "Portvīna glāze",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Glāze, pustukša, ar nogulsnēm dibenā. Līvenss to paoda. „Portvīns. Un apakšā kaut kas rūgts. Uzpirkstīte, Hukstra. Digitalis. Sirds slimniekam zāles, veselam vīram inde.“ Portvīna pudele stāv uz bufetes, neaizskarta kopš brīža, kad kalpone to tur nolika.",
  "De pendule": "Kamīna pulkstenis",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Kamīna pulkstenis uz dzegas apstājies bez desmit divpadsmit. Līvenss to paceļ: putekļos uz dzegas redzams taisnstūris, īkšķa platumā blakus tā kājiņai. „Tas ticis pacelts un nolikts atpakaļ. Bet svārsta pulkstenis, ko paceļ, apstājas. Kurš grib, lai mēs ticētu, ka viņš nomira bez desmit divpadsmit, Hukstra? Tas, kam bez desmit divpadsmit ir labs alibi.“",
  "De kaars": "Svece",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Svece uz rakstāmgalda, izdegusi līdz īkšķa garuma galiņam. Grīta saka, ka pusdesmitos aizdedzinājusi jaunu sveci, kad nesusi portvīnu; tāda svece deg četras stundas. „Tad tā bija degusi tikai stundu, kad viņa roka uzkrita tai virsū un to nodzēsa,“ saka Līvenss. „Viņš nomira starp desmitiem un vienpadsmitiem, nevis bez desmit divpadsmit. Pulkstenis melo.“",
  "Het testament": "Testaments",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Svaigs testaments, parakstīts vakar un vēl nav nodots glabāšanā kantorī: viss „manai laulātajai draudzenei Kornēlijai Brandsmai-de Vitai“ un Burgerweeshuis, pilsētas bāreņu namam. Vecais testaments, kas guļ blakus pārsvītrots, minēja tikai vienu mantinieku: „manu brāļadēlu un rakstvedi Reinīru“. Līvenss: „Cilvēkam, kas vakar tika atstāts bez mantojuma, Hukstra, šodien ir iemesls.“",
  "Een brief": "Vēstule",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Vēstule no kuģniecības firmas Veenstra & Co., parakstīta: D. Vēnstra. „Es jūs lūdzos atlikt parāda samaksu līdz pavasarim. Nespiediet mani uz izmisuma soļiem.“ Hukstra: „Draudi!“ Līvenss: „Cilvēks, kas lūdzas, doktor. Un cilvēks, kas lūdzas, tajā pašā vakarā nenoindē vienīgo, kas var viņam dot atelpu.“",
  "Het raam": "Logs",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Logs ir aizbultēts no iekšpuses; bulta iestrēgusi krāsā un putekļos. Pa šejieni neviens nav nācis. „Kas to izdarīja, doktor, tas nāca pa durvīm. Un kas nāca pa durvīm, tas jau bija mājā.“",
  "De prullenmand": "Papīrgrozs",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Saburzīta zīmīte: „Tēvoci, man šovakar vēl jārunā ar jums par testamentu. R.“ Tinte katras rindas kreisajā pusē ir izsmērēta. Līvenss: „Rakstījis kreilis, ar spalvu, kas vēl bija slapja. Vēlāk palūkojieties uz rokām, Hukstra.“",
  "De briefopener": "Papīrnazis",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Sudraba papīrnazis, tīrs un savā vietā. „Nav lietots,“ saka Līvenss, pat nepacēlis acis. „Indētājam nazis nav vajadzīgs.“",
  "De keuken": "Virtuve",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Lejā, mājas aizmugurē. Plīts, plaukts ar glāzēm, saimnieces skapis un sētas durvis uz šauru ieliņu.",
  "Het medicijnkastje": "Zāļu skapītis",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Grītas Jansenes, saimnieces, skapītis ar viņas sirds pilieniem: pudelīte digitalis tinktūras no aptiekas, piepildīta pagājušajā nedēļā, tagad gandrīz tukša. Pipetes, kas pie tās pieder, nav. Grīta: „Es lietoju piecus pilienus dienā, kungs. Nevis pusi pudelītes.“",
  "Het glazenrek": "Glāžu plaukts",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Pusdesmitos Grīta, kā katru vakaru, uznesa augšā vienu glāzi portvīna. Plauktā stāv otra portvīna glāze, nomazgāta un nolikta atpakaļ, bet iekšpusē vēl slapja. Līvenss: „Pusnaktī vēl slapja. Kāds dzēra kopā ar viņu, Hukstra, un pēc tam nomazgāja savu glāzi. Viesis savu glāzi nemazgā. Mājinieks gan.“",
  "De achterdeur": "Sētas durvis",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Grīta katru vakaru desmitos aizbultē sētas durvis un pēc tam parādes durvis; šonakt nebija citādi. „Un Vēnstras kungs?“ „Viņš aizgāja deviņos, kungs, pa parādes durvīm. Es pati viņu izvadīju; tik lielu vīru ar tik rudu bārdu neaizmirst.“ Tātad pēc desmitiem mājā nebija neviena, izņemot ģimeni un mani pašu.",
  "Het huishoudboek": "Mājsaimniecības grāmata",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Grītas mājsaimniecības grāmata: „9. nov. Kundze uz Stadsschouwburg teātri, Carmen, kopā ar Van Ēgenu dāmām. Kariete pasūtīta uz pusvieniem.“ Līvenss: „Kundze pārnāca mājās starp divpadsmitiem un vieniem. Ja pulkstenis rādītu pareizi, tā varētu būt viņa. Bet pulkstenis melo.“",
  "Het fornuis": "Plīts",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Plīts ir auksta; virtuve nav lietota kopš vienpadsmitiem. Šeit nekas nav noticis.",
  "De gang en de kapstok": "Gaitenis un pakaramais",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Augšējais gaitenis starp darbistabu un guļamistabām. Pakaramais ar mēteļiem, lietussargu statīvs, durvis uz brāļadēla istabu.",
  "De overjas aan de haak": "Mētelis uz āķa",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Brāļadēla Reinīra mētelis. Iekškabatā: stikla pipete ar gumijas uzgali, pipete no Grītas pudelītes. Uz labās piedurknes portvīna traips. „Viņš lēja ar kreiso roku,“ saka Līvenss, „un nolaistīja labo. Kreilis ar tinti uz pirkstiem un pipeti kabatā. Hukstra, man šķiet, ka esam galā.“",
  "De schoenen bij de deur": "Kurpes pie durvīm",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trīs pāri kurpju, visi sausi; visu nakti lija. Neviens no šīs mājas šonakt nav bijis ārā. Tikai kundzes vakara kurpes stāv slapjas pie parādes durvīm: viņa atgriezās no operas.",
  "Een operaprogramma": "Operas programmiņa",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Uz galdiņa: Carmen programmiņa, Stadsschouwburg, 9. novembris, sākums astoņos, un tajā kundzes ieejas biļete. Hukstra: „Alibi līdz pat pusnaktij un vēl ilgāk.“ Līvenss: „Alibi laikam bez desmit divpadsmit. Ne tam laikam, ko rāda svece.“",
  "De kamer van de neef": "Brāļadēla istaba",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinīrs Brandsma, brāļadēls, dzīvo šajā mājā. Viņš saka, ka gājis gulēt desmitos un neko nav dzirdējis. Viņš ir kreilis: uz kreisā rādītājpirksta ir tinte. Hukstra jautā, vai viņš bija greizsirdīgs uz savu tanti. „Greizsirdīgs?“ saka Līvenss. „Nē. Atstāts bez mantojuma.“",
  "De paraplubak": "Lietussargu statīvs",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Lietussargs, no kura pil ūdens: doktora Hukstras. „Es taču teicu, ka jums tas jāņem līdzi,“ apmierināts saka Līvenss.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Līvenss aizdedzināja pīpi. „Tas bija brāļadēls, Hukstra. Vakar Reinīrs izlasīja jauno testamentu un redzēja, ka vairs neko nemantos. Viņš uzrakstīja tēvocim zīmīti, pēc desmitiem ienāca darbistabā ar otru glāzi un ielēja portvīnu viņiem abiem: savā glāzē tīru, tēvoča glāzē ar pusi Grītas sirds pilienu pudelītes. Digitalis aptur sirdi. Mājas ārsts ierauga vecu vīru pie rakstāmgalda un nodomā: sirds. Viņam gandrīz bija taisnība.“",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Pēc tam viņš nomazgāja savu glāzi, pagrieza kamīna pulksteņa rādītājus uz bez desmit divpadsmit un devās gulēt. Bez desmit divpadsmit viņš taču jau stundu gulēja, un viņa tante vēl bija teātrī. Glīts alibi laikam, kurā neviens nenomira. Viņš aizmirsa sveci. Un viņš aizmirsa, ka pipetei nav vietas iekškabatā.“",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policija aizveda Reinīru Brandsmu vienos naktī. Bāreņu nams saņēma viņa naudu. Un es, kurš gandrīz biju aizmirsis lietussargu, to visu pierakstīju.",
});

  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Kamra għolja fuq il-kanal. Kotba sas-saqaf, skrivanija ħdejn it-tieqa, ċumnija b'arloġġ tal-pendlu fuq l-ixkaffa tagħha. In-nutar għadu bilqiegħda fis-siġġu tiegħu.",
  "De notaris": "In-nutar",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: \"L-ebda ferita, l-ebda ġlieda. Imma ħares lejn ix-xufftejn: blu. U l-pupilli mwessgħin.\" Lievens: \"Din mhix il-qalb, Tabib. Din xi ħaġa li xorob.\" Fuq l-iskrivanija hemm tabella bl-isem: E. Brandsma, nutar.",
  "Het portglas": "It-tazza tal-Porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Tazza nofsha vojta, b'xi ftit fdal fil-qiegħ. Lievens ixommha. \"Porto. U xi ħaġa morra taħtu. Pjanta velenuża, Hoekstra: diġitalis. F'marid tal-qalb mediċina, f'raġel b'saħħtu velenu.\" Il-flixkun tal-Porto qiegħed fuq il-kredenza, ħadd ma messu minn meta l-qaddejja poġġietu hemm.",
  "De pendule": "L-arloġġ tal-pendlu",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "L-arloġġ tal-pendlu fuq l-ixkaffa taċ-ċumnija waqaf f'nofsillejl nieqes għaxra. Lievens jerfgħu: fit-trab fuq l-ixkaffa hemm rettangolu, saba' 'l bogħod mis-sieq. \"Ġie merfugħ u mqiegħed lura. U arloġġ tal-pendlu li terfgħu jieqaf. Min irid li nemmnu li miet f'nofsillejl nieqes għaxra, Hoekstra? Xi ħadd li f'nofsillejl nieqes għaxra għandu alibi tajjeb.\"",
  "De kaars": "Ix-xemgħa",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Xemgħa fuq l-iskrivanija, maħruqa sa zokk daqs saba'. Griet tgħid li xegħlet xemgħa ġdida fid-disgħa u nofs, meta ġabet l-inbid tal-Porto; xemgħa bħal din iddum taqbad erba' sigħat. \"Mela kienet ilha taqbad siegħa biss meta idu waqgħet fuqha u tfietha,\" jgħid Lievens. \"Miet bejn l-għaxra u l-ħdax, mhux f'nofsillejl nieqes għaxra. L-arloġġ jigdeb.\"",
  "Het testament": "It-testment",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Testment ġdid, iffirmat il-bieraħ u għadu mhux depożitat fl-uffiċċju: kollox lil \"marti Cornelia Brandsma-de Wit\" u lill-Burgerweeshuis, l-orfanatrofju tal-belt. It-testment il-qadim, li qiegħed ħdejh b'linja minn fuqu, kien isemmi werriet wieħed biss: \"in-neputi u l-iskrivan tiegħi Reinier.\" Lievens: \"Raġel li ġie diżeredat il-bieraħ, Hoekstra, illum għandu raġuni.\"",
  "Een brief": "Ittra",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Ittra mill-kumpanija tal-vapuri Veenstra & Co., iffirmata D. Veenstra: \"Nitolbok tagħtini aktar żmien għad-dejn, sar-rebbiegħa. Tisforzanix nagħmel xi ħaġa ta' disprament.\" Hoekstra: \"Theddida!\" Lievens: \"Raġel li qed jitlob, Tabib. U raġel li qed jitlob ma jivvelenax, dik l-istess lejla, l-uniku wieħed li jista' jagħtih aktar żmien.\"",
  "Het raam": "It-tieqa",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "It-tieqa msakkra minn ġewwa; il-katnazz imwaħħal biż-żebgħa u bit-trab. Ħadd ma daħal minn hawn. \"Min għamilha, Tabib, daħal mill-bieb. U min daħal mill-bieb kien diġà fid-dar.\"",
  "De prullenmand": "Il-barmil tal-karti",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Nota mkemmxa: \"Ziju, irrid inkellmek illejla stess dwar it-testment. R.\" Il-linka mċappsa fuq in-naħa tax-xellug ta' kull linja. Lievens: \"Miktuba minn xi ħadd xellugi, b'pinna li kienet għadha mxarrba. Wara ħares lejn l-idejn, Hoekstra.\"",
  "De briefopener": "Is-sikkina tal-karti",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Sikkina tal-karti tal-fidda, nadifa u f'postha. \"Ma ntużatx,\" jgħid Lievens mingħajr ma jerfa' rasu. \"Min jivvelena m'għandux bżonn ta' sikkina.\"",
  "De keuken": "Il-kċina",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Isfel, fin-naħa ta' wara tad-dar. Fuklar, xkaffa bit-tazzi, il-kabinett tal-governanti u l-bieb ta' wara li jagħti għall-isqaq.",
  "Het medicijnkastje": "Il-kabinett tal-mediċini",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Il-kabinett ta' Griet Jansen, il-governanti, bil-qtar tagħha għall-qalb: flixkun żgħir ta' tintura tad-diġitalis mill-ispiżerija, mimli l-ġimgħa l-oħra u issa kważi vojt. Il-pipetta li tmur miegħu nieqsa. Griet: \"Jien nieħu ħames qatriet kuljum, Sinjur. Mhux nofs flixkun.\"",
  "Het glazenrek": "Ix-xkaffa tat-tazzi",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Fid-disgħa u nofs Griet tellgħet tazza Porto waħda biss fuq, bħal kull lejla. Fix-xkaffa hemm tieni tazza tal-Porto, maħsula u mqiegħda lura, iżda għadha mxarrba minn ġewwa. Lievens: \"Għadha mxarrba f'nofsillejl. Xi ħadd xorob miegħu, Hoekstra, u mbagħad ħasel it-tazza tiegħu. Mistieden ma jaħsilx it-tazza tiegħu. Wieħed mid-dar iva.\"",
  "De achterdeur": "Il-bieb ta' wara",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet tagħlaq il-bieb ta' wara bil-katnazz kull lejla fl-għaxra, u mbagħad il-bieb ta' barra; il-lejl li għadda ma kienx differenti. \"U s-Sur Veenstra?\" \"Telaq fid-disgħa, Sinjur, mill-bieb ta' barra. Ħriġtu jien stess; raġel daqshekk kbir b'leħja daqshekk ħamra ma tinsihx.\" Mela wara l-għaxra ma kien hemm ħadd fid-dar ħlief il-familja u jien.",
  "Het huishoudboek": "Il-ktieb tad-dar",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Il-ktieb tad-dar ta' Griet: \"9 ta' Nov. Is-Sinjura għat-teatru Stadsschouwburg, Carmen, mas-sinjuri Van Eeghen. Karrozzin ordnat għal nofsillejl u nofs.\" Lievens: \"Is-Sinjura waslet id-dar bejn it-tnax u s-siegħa. Kieku l-arloġġ kien sew, setgħet kienet hi. Imma l-arloġġ jigdeb.\"",
  "Het fornuis": "Il-fuklar",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Il-fuklar kiesaħ; il-kċina ma ntużatx mill-ħdax 'il hawn. Hawn ma ġara xejn.",
  "De gang en de kapstok": "Il-kuritur u l-attakkapanni",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Il-kuritur ta' fuq, bejn l-istudju u l-kmamar tas-sodda. Attakkapanni bil-kowtijiet, portaumbrelel, il-bieb tal-kamra tan-neputi.",
  "De overjas aan de haak": "Il-kowt mal-ganċ",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Il-kowt tan-neputi, Reinier. Fil-but ta' ġewwa: pipetta tal-ħġieġ b'tapp tal-gomma, il-pipetta tal-flixkun żgħir ta' Griet. Fuq il-komma tal-lemin, tebgħa Porto. \"Ferra' bix-xellug,\" jgħid Lievens, \"u xerred fuq il-lemin. Raġel xellugi b'linka fuq subgħajh u pipetta fil-but. Hoekstra, naħseb li lestejna.\"",
  "De schoenen bij de deur": "Iż-żraben ħdejn il-bieb",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Tliet pari żraben, kollha niexfa; il-lejl kollu għamlet ix-xita. Ħadd minn din id-dar ma ħareġ il-lejl li għadda. Iż-żraben tas-sera tas-Sinjura biss huma mxarrbin, ħdejn il-bieb ta' barra: hi kienet ġejja mill-opra.",
  "Een operaprogramma": "Programm tal-opra",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Fuq il-mejda ż-żgħira: il-programm ta' Carmen, Stadsschouwburg, 9 ta' Novembru, jibda fit-tmienja, bil-biljett tas-Sinjura ġo fih. Hoekstra: \"Alibi sa wara nofsillejl.\" Lievens: \"Alibi għal nofsillejl nieqes għaxra. Mhux għall-ħin li turi x-xemgħa.\"",
  "De kamer van de neef": "Il-kamra tan-neputi",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, in-neputi, jorqod fid-dar. Jgħid li mar jorqod fl-għaxra u ma sema' xejn. Hu xellugi: għandu l-linka fuq is-saba' l-werrej tax-xellug. Hoekstra jistaqsih jekk kienx jgħir minn zitu. \"Jgħir?\" jgħid Lievens. \"Le. Diżeredat.\"",
  "De paraplubak": "Il-portaumbrelel",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Umbrella tqattar: dik tat-tabib Hoekstra. \"Għidtlek biex teħodha miegħek,\" jgħid Lievens, sodisfatt.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens qabbad il-pipa. \"Kien in-neputi, Hoekstra. Il-bieraħ Reinier qara t-testment il-ġdid u ra li ma kien se jiret xejn aktar. Kiteb nota lil zijuh, daħal fl-istudju wara l-għaxra bit-tieni tazza, u ferra' l-Porto lit-tnejn li huma: tiegħu nadif, dak ta' zijuh b'nofs flixkun mill-qtar tal-qalb ta' Griet. Id-diġitalis iwaqqaf qalb. Tabib tal-familja jara raġel xiħ fuq l-iskrivanija tiegħu u jaħseb: il-qalb. Kważi kellu raġun.\"",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "\"Imbagħad ħasel it-tazza tiegħu, issettja l-arloġġ tal-pendlu fuq nofsillejl nieqes għaxra, u mar jorqod. Wara kollox, f'nofsillejl nieqes għaxra kien ilu siegħa rieqed, u zitu kienet għadha fit-teatru. Alibi pulit għal ħin li fih ma miet ħadd. Nesa x-xemgħa. U nesa li pipetta m'għandhiex postha f'but ta' ġewwa.\"",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Il-pulizija ġiet għal Reinier Brandsma fis-siegħa ta' filgħodu. L-orfanatrofju ħa l-flus tan-nutar. U jien, li ftit kien nieqes li nsejt l-umbrella, ktibt kollox.",
});

  "Uit de aantekeningen van dokter Bram Hoekstra.": "Z zapisków doktora Brama Hoekstry.",
  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Był mokry listopadowy poranek roku 1908, gdy służąca notariusza Everhardusa Brandsmy stanęła na naszym progu przy Keizersgracht. „Pan notariusz nie żyje, panie doktorze. W swoim gabinecie, przy biurku. Lekarz domowy mówi: serce. Ale pani Jansen, gospodyni, twierdzi, że coś się tu nie zgadza, i przysłała mnie do pana Lievensa”.",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens miał już na sobie płaszcz. „Notariusz, który wieczorem umiera przy biurku, Hoekstra, ze świeżym testamentem pod ręką. Jeśli to było serce, zjem własny kapelusz”. Spojrzał w niebo. „Niech pan weźmie parasol. I proszę mieć oko na zegar”.",

  "{dader} vergiftigde {slachtoffer} met {gif} in {drank}, in {plaats}, tussen {tijd} uur, vanwege {reden}. Daarna zette de dader {ding} terug om de tijd van de dood te vervalsen.": "Sprawca: {dader}. Ofiara: {slachtoffer}. Trucizna: {gif}, podana w tym napoju: {drank}. Miejsce: {plaats}. Czas: {tijd}. Motyw: {reden}. Potem, by sfałszować godzinę śmierci, sprawca odstawił z powrotem ten przedmiot: {ding}.",
  "een oudere heer met grijze bakkebaarden en een leesbril": "starszy pan z siwymi bokobrodami, w okularach do czytania",
  "een dame van achter in de dertig in een avondjurk met parels": "dama pod czterdziestkę w sukni wieczorowej, z perłami",
  "een jongeman met inkt aan zijn linkerhand": "młody mężczyzna z atramentem na lewej dłoni",
  "een zware man met een rode baard": "potężny mężczyzna z rudą brodą",
  "een vrouw op leeftijd met een sleutelbos aan haar schort": "starsza kobieta z pękiem kluczy przy fartuchu",
  "een man met een dokterstas en een natte paraplu": "mężczyzna z lekarską torbą i mokrym parasolem",
  "De studeerkamer": "Gabinet",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Wysoki pokój od strony kanału. Książki aż po sufit, biurko przy oknie, kominek z zegarem na gzymsie. Notariusz wciąż siedzi w swoim fotelu.",
  "De notaris": "Notariusz",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: „Żadnej rany, żadnych śladów szamotaniny. Ale proszę spojrzeć na usta: sine. A źrenice są rozszerzone”. Lievens: „To nie serce, doktorze. To coś, co wypił”. Na biurku stoi tabliczka: E. Brandsma, notariusz.",
  "Het portglas": "Kieliszek do porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Kieliszek, w połowie pusty, z osadem na dnie. Lievens go wącha. „Porto. A pod nim coś gorzkiego. Naparstnica, Hoekstra. Digitalis. Dla chorego na serce lekarstwo, dla zdrowego człowieka trucizna”. Butelka porto stoi na kredensie, nietknięta, odkąd postawiła ją tam służąca.",
  "De pendule": "Zegar kominkowy",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "Zegar kominkowy na gzymsie stanął za dziesięć dwunasta. Lievens go podnosi: w kurzu na gzymsie widać prostokąt, o kciuk obok podstawy. „Podniesiono go i postawiono z powrotem. A zegar z wahadłem, który się podniesie, staje. Kto chce, żebyśmy uwierzyli, że umarł za dziesięć dwunasta, Hoekstra? Ktoś, kto ma dobre alibi na za dziesięć dwunasta”.",
  "De kaars": "Świeca",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Świeca na biurku, wypalona do ogarka długości kciuka. Griet mówi, że o wpół do dziesiątej zapaliła nową świecę, kiedy przyniosła porto; taka świeca pali się cztery godziny. „A zatem paliła się dopiero od godziny, kiedy opadła na nią jego ręka i ją zgasiła” – mówi Lievens. „Umarł między dziesiątą a jedenastą, a nie za dziesięć dwunasta. Zegar kłamie”.",
  "Het testament": "Testament",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Świeży testament, podpisany wczoraj i jeszcze niezłożony w kancelarii: wszystko dla „mojej małżonki Cornelii Brandsmy-de Wit” oraz dla Burgerweeshuis, miejskiego sierocińca. Stary testament, który leży obok, przekreślony, wymieniał tylko jednego spadkobiercę: „mojego bratanka i kancelistę Reiniera”. Lievens: „Człowiek, którego wczoraj wydziedziczono, Hoekstra, ma dziś powód”.",
  "Een brief": "List",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "List od armatora Veenstra & Co., podpisany D. Veenstra: „Błagam Pana o odroczenie długu do wiosny. Proszę nie doprowadzać mnie do czynów rozpaczliwych”. Hoekstra: „Groźba!” Lievens: „Człowiek, który błaga, doktorze. A człowiek, który błaga, nie truje tego samego wieczoru jedynej osoby, która może mu udzielić zwłoki”.",
  "Het raam": "Okno",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "Okno jest zaryglowane od środka; zasuwa zastygła w farbie i kurzu. Nikt tędy nie wchodził. „Ktokolwiek to zrobił, doktorze, wszedł drzwiami. A kto wszedł drzwiami, był już w domu”.",
  "De prullenmand": "Kosz na papiery",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Zmięta kartka: „Stryju, muszę jeszcze dziś wieczorem pomówić ze Stryjem o testamencie. R.” Atrament jest rozmazany po lewej stronie każdego wiersza. Lievens: „Pisał to mańkut, piórem, które było jeszcze mokre. Proszę potem przyglądać się rękom, Hoekstra”.",
  "De briefopener": "Nóż do papieru",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Srebrny nóż do papieru, czysty i na swoim miejscu. „Nieużywany” – mówi Lievens, nie podnosząc wzroku. „Truciciel nie potrzebuje noża”.",
  "De keuken": "Kuchnia",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Na dole, w głębi domu. Piec kuchenny, półka z kieliszkami, szafka gospodyni i tylne drzwi na zaułek.",
  "Het medicijnkastje": "Apteczka",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "Szafka Griet Jansen, gospodyni, z jej kroplami nasercowymi: buteleczka nalewki z digitalis z apteki, napełniona w zeszłym tygodniu, teraz niemal pusta. Brakuje pipety, która do niej należy. Griet: „Biorę pięć kropli dziennie, proszę pana. Nie pół buteleczki”.",
  "Het glazenrek": "Półka z kieliszkami",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "O wpół do dziesiątej Griet zaniosła na górę jeden kieliszek porto, jak co wieczór. Na półce stoi drugi kieliszek do porto, umyty i odstawiony, ale w środku wciąż mokry. Lievens: „O północy wciąż mokry. Ktoś pił razem z nim, Hoekstra, a potem umył swój kieliszek. Gość nie myje po sobie kieliszka. Domownik – owszem”.",
  "De achterdeur": "Tylne drzwi",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet co wieczór o dziesiątej zamyka na zasuwę tylne drzwi, a potem frontowe; tej nocy nie było inaczej. „A pan Veenstra?” „Wyszedł o dziewiątej, proszę pana, frontowymi drzwiami. Sama go odprowadziłam; takiego rosłego mężczyzny z taką rudą brodą się nie zapomina”. Po dziesiątej nie było więc w domu nikogo poza rodziną i mną.",
  "Het huishoudboek": "Książka domowa",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "Książka domowa Griet: „9 list. Pani do Stadsschouwburg na Carmen, z paniami Van Eeghen. Powóz zamówiony na wpół do pierwszej”. Lievens: „Pani wróciła do domu między dwunastą a pierwszą. Gdyby zegar się nie mylił, mogłaby to być ona. Ale zegar kłamie”.",
  "Het fornuis": "Piec kuchenny",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "Piec jest zimny; w kuchni nie gotowano od jedenastej. Tu nic się nie wydarzyło.",
  "De gang en de kapstok": "Korytarz i wieszak",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "Korytarz na piętrze, między gabinetem a sypialniami. Wieszak z płaszczami, stojak na parasole, drzwi do pokoju bratanka.",
  "De overjas aan de haak": "Płaszcz na haku",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "Płaszcz bratanka, Reiniera. W wewnętrznej kieszeni: szklana pipeta z gumowym kapturkiem, pipeta z buteleczki Griet. Na prawym rękawie plama porto. „Nalewał lewą ręką – mówi Lievens – i rozlał na prawy rękaw. Mańkut z atramentem na palcach i pipetą w kieszeni. Hoekstra, sądzę, że skończyliśmy”.",
  "De schoenen bij de deur": "Buty przy drzwiach",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Trzy pary butów, wszystkie suche, choć przez całą noc padało. Nikt z tego domu nie wychodził tej nocy. Tylko wieczorowe pantofelki pani stoją mokre przy frontowych drzwiach: wróciła z opery.",
  "Een operaprogramma": "Program operowy",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na stoliku: program Carmen, Stadsschouwburg, 9 listopada, początek o ósmej, a w nim bilet pani. Hoekstra: „Alibi aż do północy i dłużej”. Lievens: „Alibi na za dziesięć dwunasta. Nie na porę, którą wskazuje świeca”.",
  "De kamer van de neef": "Pokój bratanka",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, bratanek, mieszka w tym domu. Mówi, że o dziesiątej poszedł spać i niczego nie słyszał. Jest mańkutem: ma atrament na lewym palcu wskazującym. Hoekstra pyta, czy był zazdrosny o stryjenkę. „Zazdrosny?” – mówi Lievens. „Nie. Wydziedziczony”.",
  "De paraplubak": "Stojak na parasole",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Ociekający wodą parasol: parasol doktora Hoekstry. „Przecież mówiłem, żeby go pan wziął” – mówi Lievens z zadowoleniem.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens zapalił fajkę. „To był bratanek, Hoekstra. Reinier przeczytał wczoraj nowy testament i zobaczył, że nic już nie odziedziczy. Napisał do stryja liścik, wszedł po dziesiątej do gabinetu z drugim kieliszkiem i nalał im obu porto: sobie czyste, stryjowi z połową buteleczki kropli nasercowych Griet. Digitalis zatrzymuje serce. Lekarz domowy widzi starego człowieka przy biurku i myśli: serce. Niewiele się pomylił”.",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "„Potem umył swój kieliszek, przestawił zegar kominkowy na za dziesięć dwunasta i poszedł spać. Za dziesięć dwunasta spał przecież już od godziny, a jego stryjenka była jeszcze w teatrze. Schludne alibi na godzinę, o której nikt nie umarł. Zapomniał o świecy. I zapomniał, że pipeta nie powinna leżeć w wewnętrznej kieszeni”.",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "Policja zabrała Reiniera Brandsmę o pierwszej. Sierociniec dostał jego pieniądze. A ja, który omal nie zapomniałem parasola, spisałem to wszystko.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Era uma manhã húmida de novembro de 1908 quando a criada do notário Everhardus Brandsma se apresentou à nossa porta, na Keizersgracht. «O senhor notário morreu, senhor doutor. No gabinete, à secretária. O médico da família diz que foi o coração. Mas a senhora Jansen, a governanta, diz que há qualquer coisa que não está certa, e mandou-me chamar o senhor Lievens.»",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens já tinha o sobretudo vestido. «Um notário que morre à noite à sua secretária, Hoekstra, com um testamento acabado de fazer debaixo da mão. Se aquilo foi o coração, eu como o meu chapéu.» Olhou para o céu. «Leve o seu guarda-chuva. E repare no relógio.»",

  "een vrouw op leeftijd met een sleutelbos aan haar schort": "uma mulher de idade com um molho de chaves no avental",
  "een man met een dokterstas en een natte paraplu": "um homem com uma maleta de médico e um guarda-chuva molhado",
  "De studeerkamer": "O gabinete",
  "Een hoge kamer aan de gracht. Boeken tot het plafond, een bureau bij het raam, een schoorsteenmantel met een pendule. De notaris zit nog in zijn stoel.": "Uma sala de pé-direito alto sobre o canal. Livros até ao teto, uma secretária junto à janela, uma lareira com uma pêndula sobre o consolo. O notário continua sentado na sua cadeira.",
  "De notaris": "O notário",
  "Hoekstra: \"Geen wond, geen worsteling. Maar kijk naar de lippen: blauw. En de pupillen staan wijd.\" Lievens: \"Dat is geen hart, dokter. Dat is iets wat hij gedronken heeft.\" Op het bureau staat een naambordje: E. Brandsma, notaris.": "Hoekstra: «Nenhuma ferida, nenhum sinal de luta. Mas veja os lábios: azuis. E as pupilas estão dilatadas.» Lievens: «Isto não é o coração, doutor. É qualquer coisa que ele bebeu.» Sobre a secretária, uma placa com o nome: E. Brandsma, notário.",
  "Het portglas": "O cálice de Porto",
  "Een glas, half leeg, met bezinksel op de bodem. Lievens ruikt eraan. \"Port. En iets bitters eronder. Vingerhoedskruid, Hoekstra. Digitalis. In een hartpatiënt een medicijn, in een gezond man een gif.\" De fles port staat op het buffet, onaangeroerd sinds de dienstbode hem neerzette.": "Um cálice meio vazio, com borra no fundo. Lievens cheira-o. «Vinho do Porto. E qualquer coisa amarga por baixo. Dedaleira, Hoekstra. Digitalina. Num doente cardíaco, um remédio; num homem são, um veneno.» A garrafa de vinho do Porto está no aparador, intocada desde que a criada a lá pousou.",
  "De pendule": "A pêndula",
  "De pendule op de schoorsteenmantel staat stil op tien voor twaalf. Lievens tilt hem op: in het stof op de mantel staat een rechthoek, een duim naast de voet. \"Hij is opgetild en teruggezet. En een pendule die je optilt, staat stil. Wie wil dat wij geloven dat hij om tien voor twaalf stierf, Hoekstra? Iemand die om tien voor twaalf een goed alibi heeft.\"": "A pêndula sobre o consolo da lareira parou às dez para a meia-noite. Lievens levanta-a: no pó do consolo há um retângulo, a um polegar do pé. «Foi levantada e posta de volta. E uma pêndula que se levanta para. Quem quer que acreditemos que ele morreu às dez para a meia-noite, Hoekstra? Alguém que às dez para a meia-noite tem um bom álibi.»",
  "De kaars": "A vela",
  "Een kaars op het bureau, uitgebrand tot een stompje van een duim. Griet zegt dat zij om halftien een nieuwe kaars aanstak toen zij de port bracht; zo'n kaars brandt vier uur. \"Dan brandde hij nog een uur toen zijn hand erop viel en hem doofde,\" zegt Lievens. \"Hij stierf tussen tien en elf, niet om tien voor twaalf. De klok liegt.\"": "Uma vela sobre a secretária, consumida até um coto do tamanho de um polegar. Griet diz que acendeu uma vela nova às nove e meia, quando trouxe o vinho do Porto; uma vela assim arde quatro horas. «Então ardia havia uma hora quando a mão dele lhe caiu em cima e a apagou», diz Lievens. «Morreu entre as dez e as onze, e não às dez para a meia-noite. O relógio mente.»",
  "Het testament": "O testamento",
  "Een vers testament, gisteren getekend en nog niet bij het kantoor gedeponeerd: alles aan \"mijn echtgenote Cornelia Brandsma-de Wit\" en aan het Burgerweeshuis. Het oude testament, dat ernaast ligt met een streep erdoor, noemde maar één erfgenaam: \"mijn neef en klerk Reinier.\" Lievens: \"Een man die gisteren onterfd is, Hoekstra, heeft vandaag een reden.\"": "Um testamento novo, assinado ontem e ainda não depositado no cartório: tudo para «a minha esposa Cornelia Brandsma-de Wit» e para o Burgerweeshuis, o orfanato da cidade. O testamento antigo, ao lado, riscado com um traço, nomeava um único herdeiro: «o meu sobrinho e escrevente Reinier.» Lievens: «Um homem que ontem foi deserdado, Hoekstra, tem hoje um motivo.»",
  "Een brief": "Uma carta",
  "Een brief van de rederij Veenstra & Co., getekend D. Veenstra: \"Ik smeek u om uitstel van de schuld tot het voorjaar. Dwing mij niet tot wanhoopsdaden.\" Hoekstra: \"Een dreigement!\" Lievens: \"Een man die smeekt, dokter. Een man die smeekt, vergiftigt niet dezelfde avond de enige die hem uitstel kan geven.\"": "Uma carta da companhia de navegação Veenstra & Co., assinada D. Veenstra: «Suplico-lhe que adie a dívida até à primavera. Não me leve a atos de desespero.» Hoekstra: «Uma ameaça!» Lievens: «Um homem que suplica, doutor. E um homem que suplica não envenena, nessa mesma noite, o único que lhe pode conceder mais tempo.»",
  "Het raam": "A janela",
  "Het raam is van binnen vergrendeld; de grendel zit vast in verf en stof. Niemand is hier langs gekomen. \"Wie het deed, dokter, kwam door de deur. En wie door de deur kwam, was in huis.\"": "A janela está trancada por dentro; o ferrolho está emperrado pela pintura e pelo pó. Ninguém entrou por aqui. «Quem o fez, doutor, entrou pela porta. E quem entrou pela porta já estava em casa.»",
  "De prullenmand": "O cesto dos papéis",
  "Een verfrommeld briefje: \"Oom, ik moet u vanavond nog spreken over het testament. R.\" De inkt is uitgeveegd aan de linkerkant van elke regel. Lievens: \"Geschreven door een linkshandige, met een pen die nog nat was. Kijk straks naar handen, Hoekstra.\"": "Um bilhete amarrotado: «Tio, preciso de lhe falar ainda esta noite sobre o testamento. R.» A tinta está borrada do lado esquerdo de cada linha. Lievens: «Escrito por um canhoto, com uma pena ainda molhada. Daqui a pouco repare nas mãos, Hoekstra.»",
  "De briefopener": "O corta-papel",
  "Een zilveren briefopener, schoon en op zijn plaats. \"Niet gebruikt,\" zegt Lievens zonder op te kijken. \"Een vergiftiger heeft geen mes nodig.\"": "Um corta-papel de prata, limpo e no seu lugar. «Não foi usado», diz Lievens sem levantar os olhos. «Um envenenador não precisa de faca.»",
  "De keuken": "A cozinha",
  "Beneden, achter in het huis. Een fornuis, een rek met glazen, de kast van de huishoudster en de achterdeur naar de steeg.": "Em baixo, nas traseiras da casa. Um fogão de ferro, uma prateleira de copos, o armário da governanta e a porta das traseiras que dá para a viela.",
  "Het medicijnkastje": "O armário dos remédios",
  "Het kastje van Griet Jansen, de huishoudster, met haar hartdruppels: een flesje digitalis-tinctuur van de apotheek, vorige week gevuld, nu bijna leeg. De pipet die erbij hoort, ontbreekt. Griet: \"Ik neem vijf druppels per dag, meneer. Niet een half flesje.\"": "O armarinho de Griet Jansen, a governanta, com as suas gotas para o coração: um frasquinho de tintura de digitalina, aviado na farmácia na semana passada e agora quase vazio. Falta a pipeta que o acompanha. Griet: «Tomo cinco gotas por dia, senhor. Não meio frasco.»",
  "Het glazenrek": "A prateleira dos copos",
  "Griet bracht om halftien één glas port naar boven, zoals elke avond. In het rek staat een tweede portglas, afgewassen en teruggezet, maar nog nat van binnen. Lievens: \"Om middernacht nog nat. Iemand heeft met hem meegedronken, Hoekstra, en zijn glas daarna afgewassen. Een gast wast zijn glas niet af. Een huisgenoot wel.\"": "Às nove e meia, Griet levou um só cálice de Porto lá acima, como todas as noites. Na prateleira está um segundo cálice de Porto, lavado e arrumado, mas ainda molhado por dentro. Lievens: «Ainda molhado à meia-noite. Alguém bebeu com ele, Hoekstra, e depois lavou o seu cálice. Um convidado não lava o copo. Alguém da casa, sim.»",
  "De achterdeur": "A porta das traseiras",
  "Griet grendelt de achterdeur elke avond om tien uur en de voordeur daarna; vannacht was dat niet anders. \"En de heer Veenstra?\" \"Die ging om negen uur weg, meneer, door de voordeur. Ik heb hem zelf uitgelaten; zo'n grote man met zo'n rode baard vergeet je niet.\" Na tien uur was er dus niemand in huis dan de familie en ikzelf.": "Griet tranca a porta das traseiras todas as noites às dez, e logo a seguir a da frente; ontem à noite não foi diferente. «E o senhor Veenstra?» «Saiu às nove, senhor, pela porta da frente. Fui eu mesma que o acompanhei; um homem tão grande, com uma barba tão ruiva, não se esquece.» Depois das dez, portanto, não havia ninguém em casa além da família e de mim própria.",
  "Het huishoudboek": "O livro da casa",
  "Griets huishoudboek: \"9 nov. Mevrouw naar de Stadsschouwburg, Carmen, met de dames Van Eeghen. Rijtuig besteld voor halfeen.\" Lievens: \"Mevrouw kwam tussen twaalf en één thuis. Als de klok gelijk had, kon zij het zijn. Maar de klok liegt.\"": "O livro da casa de Griet: «9 nov. A senhora ao Stadsschouwburg, Carmen, com as senhoras Van Eeghen. Carruagem encomendada para a meia-noite e meia.» Lievens: «A senhora chegou a casa entre a meia-noite e a uma. Se o relógio estivesse certo, podia ter sido ela. Mas o relógio mente.»",
  "Het fornuis": "O fogão",
  "Het fornuis is koud; de keuken is sinds elf uur niet gebruikt. Hier is niets gebeurd.": "O fogão está frio; a cozinha não é usada desde as onze. Aqui não aconteceu nada.",
  "De gang en de kapstok": "O corredor e o cabide",
  "De gang boven, tussen de studeerkamer en de slaapkamers. Een kapstok met jassen, een paraplubak, de deur naar de kamer van de neef.": "O corredor de cima, entre o gabinete e os quartos. Um cabide com casacos, um bengaleiro para os guarda-chuvas, a porta do quarto do sobrinho.",
  "De overjas aan de haak": "O sobretudo no gancho",
  "De jas van de neef, Reinier. In de binnenzak: een glazen pipet met een rubberen dop, de pipet van Griets flesje. Op de rechtermouw een vlek port. \"Hij schonk met links,\" zegt Lievens, \"en morste op rechts. Een linkshandige met inkt aan zijn vingers en een pipet in zijn zak. Hoekstra, ik geloof dat wij klaar zijn.\"": "O sobretudo do sobrinho, Reinier. No bolso interior: uma pipeta de vidro com uma tetina de borracha, a pipeta do frasquinho de Griet. Na manga direita, uma nódoa de vinho do Porto. «Serviu com a esquerda», diz Lievens, «e entornou na direita. Um canhoto com tinta nos dedos e uma pipeta no bolso. Hoekstra, creio que terminámos.»",
  "De schoenen bij de deur": "Os sapatos junto à porta",
  "Drie paar schoenen, allemaal droog; het heeft de hele nacht geregend. Niemand uit dit huis is vannacht buiten geweest. Alleen mevrouws avondschoenen staan nat bij de voordeur: zij kwam van de opera.": "Três pares de sapatos, todos secos; choveu a noite inteira. Ninguém desta casa saiu ontem à noite. Só os sapatos de cerimónia da senhora estão molhados junto à porta da frente: ela vinha da ópera.",
  "Een operaprogramma": "Um programa de ópera",
  "Op het tafeltje: het programma van Carmen, Stadsschouwburg, 9 november, aanvang acht uur, met de toegangskaart van mevrouw erin. Hoekstra: \"Een alibi tot na middernacht.\" Lievens: \"Een alibi voor tien voor twaalf. Niet voor de tijd die de kaars aangeeft.\"": "Na mesinha: o programa de Carmen, Stadsschouwburg, 9 de novembro, início às oito, com o bilhete da senhora lá dentro. Hoekstra: «Um álibi até depois da meia-noite.» Lievens: «Um álibi para as dez para a meia-noite. Não para a hora que a vela indica.»",
  "De kamer van de neef": "O quarto do sobrinho",
  "Reinier Brandsma, de neef, slaapt in huis. Hij zegt dat hij om tien uur naar bed ging en niets hoorde. Hij is linkshandig: er zit inkt aan zijn linker wijsvinger. Hoekstra vraagt of hij jaloers was op zijn tante. \"Jaloers?\" zegt Lievens. \"Nee. Onterfd.\"": "Reinier Brandsma, o sobrinho, dorme na casa. Diz que se deitou às dez e não ouviu nada. É canhoto: tem tinta no indicador esquerdo. Hoekstra pergunta-lhe se tinha ciúmes da tia. «Ciúmes?», diz Lievens. «Não. Deserdado.»",
  "De paraplubak": "O bengaleiro",
  "Een druipende paraplu: die van dokter Hoekstra. \"Ik had gezegd dat u hem mee moest nemen,\" zegt Lievens tevreden.": "Um guarda-chuva a pingar: o do doutor Hoekstra. «Bem lhe disse que o trouxesse», diz Lievens, satisfeito.",
  "Lievens stak zijn pijp aan. \"Het was de neef, Hoekstra. Reinier las gisteren het nieuwe testament en zag dat hij niets meer zou erven. Hij schreef zijn oom een briefje, kwam na tien uur de studeerkamer binnen met een tweede glas, en schonk hun beiden port in: de zijne schoon, die van zijn oom met een half flesje van Griets hartdruppels. Digitalis stopt een hart. Een huisarts ziet een oude man aan zijn bureau en denkt: het hart. Hij had bijna gelijk.\"": "Lievens acendeu o cachimbo. «Foi o sobrinho, Hoekstra. Ontem, Reinier leu o novo testamento e viu que já não herdaria nada. Escreveu um bilhete ao tio, entrou no gabinete depois das dez com um segundo cálice e serviu vinho do Porto a ambos: o dele limpo, o do tio com meio frasco das gotas de Griet para o coração. A digitalina faz parar um coração. Um médico de família vê um velho à sua secretária e pensa: o coração. Quase tinha razão.»",
  "\"Daarna waste hij zijn glas af, zette de pendule op tien voor twaalf, en ging naar bed. Om tien voor twaalf was hij immers al een uur in slaap, en zijn tante nog in de schouwburg. Een keurig alibi voor een tijd waarop niemand stierf. Hij vergat de kaars. En hij vergat dat een pipet niet in een binnenzak hoort.\"": "«Depois lavou o seu cálice, acertou a pêndula para as dez para a meia-noite e foi deitar-se. Afinal, às dez para a meia-noite já dormia havia uma hora, e a tia ainda estava no teatro. Um álibi impecável para uma hora em que ninguém morreu. Esqueceu-se da vela. E esqueceu-se de que uma pipeta não tem nada que fazer no bolso interior de um sobretudo.»",
  "De politie haalde Reinier Brandsma om één uur op. Het weeshuis kreeg zijn geld. En ik, die de paraplu bijna vergeten was, schreef het op.": "A polícia veio buscar Reinier Brandsma à uma da manhã. O orfanato recebeu o dinheiro do notário. E eu, que por pouco não me esquecia do guarda-chuva, escrevi tudo isto.",
});

  "Het was een natte novemberochtend in 1908 toen de dienstbode van notaris Everhardus Brandsma op de stoep van de Keizersgracht stond. \"De notaris is dood, dokter. In zijn studeerkamer, aan zijn bureau. De huisarts zegt: het hart. Maar mevrouw Jansen, de huishoudster, zegt dat het niet klopt, en ze heeft mij naar de heer Lievens gestuurd.\"": "Era o dimineață umedă de noiembrie, în 1908, când servitoarea notarului Everhardus Brandsma se înfățișă la ușa noastră de pe Keizersgracht. „Domnul notar a murit, domnule doctor. În birou, la masa de scris. Medicul casei spune: inima. Dar doamna Jansen, menajera, spune că ceva nu e în regulă, și m-a trimis la domnul Lievens.”",
  "Lievens had zijn jas al aan. \"Een notaris die 's avonds aan zijn bureau sterft, Hoekstra, met een vers testament onder zijn hand. Als dat het hart was, eet ik mijn hoed op.\" Hij keek naar de lucht. \"Neem uw paraplu. En let op de klok.\"": "Lievens își pusese deja paltonul. „Un notar care moare seara la masa de scris, Hoekstra, cu un testament proaspăt sub mână. Dacă a fost inima, îmi mănânc pălăria.” Se uită la cer. „Luați-vă umbrela. Și fiți atent la ceas.”",
