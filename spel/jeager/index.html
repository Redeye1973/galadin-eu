<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jeager</title>
<style>

:root {
  --grond: #131a24; --vlak: #1d2735; --vlak2: #2a3648; --lijn: #3d4c62;
  --inkt: #eef3f8; --inkt2: #a9b8c9; --goud: #ffc94d; --goud-inkt: #2b2106;
  --goed: #5fd68a; --let: #ffb547; --slecht: #ff6b5e; --radar: #5cff9a; --lucht: #86bfe8;
  --kop: "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
  --tekst: Roboto, "sans-serif", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--goud); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--kop); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }

#app { height: 100%; display: flex; flex-direction: column; }
.kop { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.paardknop { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; }
.paardknop img { width: 40px; height: 40px; object-fit: contain; flex: none; }
.paardknop span { min-width: 0; }
.paardknop b { display: block; font-family: var(--kop); font-size: 20px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paardknop small { display: block; color: var(--inkt2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.munten { display: flex; align-items: center; gap: 6px; background: var(--vlak2); border: 1px solid var(--lijn); border-radius: 999px; padding: 4px 12px 4px 6px; font-family: var(--kop); font-size: 18px; font-weight: 700; color: var(--goud); font-variant-numeric: tabular-nums; }
.munten img { width: 24px; height: 24px; }
.rond { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--vlak2); border: 1px solid var(--lijn); flex: none; }
.rond svg { width: 22px; height: 22px; fill: var(--inkt2); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.tab { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }


.scene-kader { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid #0a0e14; box-shadow: 0 6px 18px rgba(0,0,0,.4); background: #0a0e14; }

.basis-beeld { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; max-height: 40vh; object-fit: cover; object-position: center 38%; }   
.klokje { position: absolute; right: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(10,14,20,.65); padding: 2px 8px; border-radius: 999px; letter-spacing: 0.04em; pointer-events: none; }
.bak-naam { position: absolute; left: 8px; top: 8px; font: 700 12px var(--kop); color: #fff; background: rgba(10,14,20,.65); padding: 2px 8px; border-radius: 999px; pointer-events: none; max-width: calc(100% - 110px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stalmeters { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--inkt2); }
.stalmeters span { display: flex; align-items: center; gap: 4px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 999px; padding: 2px 10px 2px 4px; }
.stalmeters img { width: 20px; height: 20px; }
.stalmeters b { color: var(--inkt); }
.balk { height: 8px; border-radius: 4px; background: #0a0e14; overflow: hidden; border: 1px solid #070a0f; }
.balk i { display: block; height: 100%; border-radius: 3px; background: var(--goed); transition: width .4s ease; }
.balk i.let { background: var(--let); } .balk i.slecht { background: var(--slecht); }
.tweebalk { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin-top: 5px; font-size: 11px; color: var(--inkt2); }
.status { font: 600 11.5px var(--tekst); color: var(--inkt2); margin-left: 4px; }
.status.s-klaar { color: var(--goed); } .status.s-vlucht { color: var(--lucht); } .status.s-grond { color: var(--slecht); } .status.s-onderhoud, .status.s-tanken { color: var(--let); }
.pijl { font-size: 22px; color: var(--inkt2); }
.stippen { letter-spacing: 1px; color: var(--goud); font-size: 11px; white-space: nowrap; }
.stippen i { font-style: normal; color: var(--lijn); }

.waarden { display: flex; flex-wrap: wrap; gap: 0 10px; }
.waarden span { white-space: nowrap; }


.radar-kader { display: grid; grid-template-columns: minmax(0, min(46%, 240px)) 1fr; gap: 12px; align-items: center; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 14px; padding: 10px; }
#radar { display: block; width: 100%; height: auto; aspect-ratio: 1; }
.radar-zij b { font: 700 19px var(--kop); display: block; }
.radar-zij p { margin: 4px 0 0; font-size: 13px; color: var(--inkt2); }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px !important; }
.legenda span { display: inline-flex; align-items: center; gap: 4px; }
.legenda i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.legenda .geel { background: #ffdc5a; } .legenda .rood { background: #ff6e5a; } .legenda .blauw { background: #78dcff; }
.vlucht { display: grid; gap: 6px; }
.rit-kader { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #0a0e14; background: #0a0e14; }
.balkdoek { display: block; width: 100%; height: auto; aspect-ratio: 320 / 80; }
.rit-tijd { position: absolute; right: 8px; top: 6px; font: 700 13px var(--kop); color: #fff; background: rgba(10,14,20,.65); padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.melding { margin: 0; min-height: 22px; font-size: 14px; }
.opruimknop { background: var(--let); color: #2b1a06; font: 700 18px var(--kop); padding: 14px; border-radius: 14px; width: 100%; box-shadow: 0 3px 0 #b36f12; animation: klop .9s ease-in-out infinite; }
.opruimknop[aria-disabled="true"] { opacity: .5; animation: none; }
@keyframes klop { 50% { transform: scale(1.03); } }
.contact.russisch { border-color: #7a3a36; }
img.spiegel { transform: scaleX(-1); }


.hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hud .zetten { font-family: var(--kop); font-size: 26px; font-weight: 700; text-align: center; min-width: 48px; line-height: 1; }
.hud .zetten small { display: block; font-size: 10px; color: var(--inkt2); font-weight: 600; letter-spacing: .05em; }
.hud .doel span { display: flex; justify-content: space-between; font-size: 12px; color: var(--inkt2); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.hud .doel .balk { height: 12px; border-radius: 6px; }
#drieDoek { display: block; width: 100%; max-width: 420px; margin: 0 auto; height: auto; touch-action: none; border-radius: 12px; background: #2c323a; image-rendering: pixelated; }

#drieDoek { width: min(100%, calc((100vh - 236px) * var(--kol) / var(--rij))); }


#patDoek { display: block; width: min(100%, calc((100vh - 230px) * 180 / 320)); max-width: 360px; margin: 0 auto; height: auto; aspect-ratio: 180 / 320; touch-action: none; border-radius: 12px; background: #2c4a2c; image-rendering: pixelated; }
.pat-raket { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 54px; height: 48px; border-radius: 12px; background: var(--let); color: #2b1a06; font: 700 20px var(--kop); line-height: 1; box-shadow: 0 3px 0 #b36f12; }
.pat-raket small { font-size: 9px; letter-spacing: .05em; }
.pat-raket[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); box-shadow: none; }


.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { white-space: nowrap; padding: 6px 14px; border-radius: 999px; background: var(--vlak); border: 1px solid var(--lijn); font-size: 13px; font-weight: 600; color: var(--inkt2); }
.chip[aria-pressed="true"] { background: var(--goud); color: var(--goud-inkt); border-color: var(--goud); }
.lijst { display: grid; gap: 8px; }
.kaart { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--vlak); border: 1px solid var(--lijn); text-align: left; }
.kaart img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: var(--vlak2); }
.kaart h3 { font-size: 16px; }
.kaart p { margin: 2px 0 0; font-size: 12.5px; color: var(--inkt2); }
.kaart .bezit { font-size: 11.5px; color: var(--goed); margin-top: 2px; }
.kaart.leeg, .kaart.op-slot { border-style: dashed; opacity: .8; }

.kistkaart { grid-template-columns: 92px minmax(0, 1fr) auto; width: 100%; }
.kistkaart img { width: 92px; height: 50px; padding: 4px; background: linear-gradient(#5d9fd0, #a9d3ee); }
.keuze[aria-pressed="true"] { border-color: var(--goud); background: var(--vlak2); }
.keuze[aria-disabled="true"] { opacity: .5; }
.vink { font: 700 20px var(--kop); color: var(--goud); min-width: 18px; text-align: center; }
.spelkaart { width: 100%; }
.spelkaart .loon img { width: 28px; height: 28px; background: none; }
.prijs { display: flex; align-items: center; gap: 4px; background: var(--goud); color: var(--goud-inkt); font: 700 15px var(--kop); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
.prijs img { width: 18px; height: 18px; background: none; border-radius: 0; }
.prijs[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); }
.knop2 { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.knop2[aria-disabled="true"] { opacity: .45; }
.hoofdknop { width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--goud); color: var(--goud-inkt); font: 700 18px var(--kop); margin-top: 8px; box-shadow: 0 3px 0 #b38a12; }
.hoofdknop[aria-disabled="true"] { background: var(--vlak2); color: var(--inkt2); box-shadow: none; }
.rij { display: flex; gap: 8px; flex-wrap: wrap; }
.label { margin: 10px 0 4px; font: 700 12px var(--kop); letter-spacing: 0.08em; text-transform: uppercase; color: var(--inkt2); }
.weetje { background: var(--vlak); border: 1px solid var(--lijn); border-left: 3px solid var(--goud); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin-top: 8px; }
.feiten { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: 14px; }
.feiten dt { color: var(--inkt2); } .feiten dd { margin: 0; }
.invoer { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--vlak2); color: var(--inkt); font: 600 16px var(--tekst); }
.groot-beeld { display: grid; place-items: center; background: var(--vlak); border-radius: 14px; padding: 12px; }
.groot-beeld img { width: 100%; max-width: 288px; height: 120px; object-fit: contain; }
.groot-beeld.lucht { background: linear-gradient(#5d9fd0, #a9d3ee); }

nav.onder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); background: #0d121a; border-top: 1px solid #070a0f; }
nav.onder button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--inkt2); }
nav.onder button img { width: 28px; height: 28px; object-fit: contain; }
nav.onder button[aria-selected="true"] { color: var(--goud); }

.stip { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--slecht); color: #fff; font: 700 11px/17px var(--kop); font-style: normal; text-align: center; }

.vel { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.vel-doek { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.vel-paneel { position: relative; max-height: 88%; overflow-y: auto; background: var(--grond); border-radius: 22px 22px 0 0; border-top: 1px solid var(--lijn); padding: 8px 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.vel-greep { width: 40px; height: 4px; border-radius: 2px; background: var(--lijn); margin: 4px auto 10px; }
.vel-kop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.vel-kop h2 { font-size: 24px; }

.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: fit-content; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 10px; max-width: 480px; background: #eef3f8; color: #131a24; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast img { width: 32px; height: 32px; object-fit: contain; }


.taalkeuze { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--inkt2); }
.taalkeuze select { font: inherit; color: var(--inkt); background: var(--vlak2); border: 1px solid var(--lijn); border-radius: 8px; padding: 6px 8px; }
.taalkeuze option { color: #111; background: #fff; }
.taalrij { text-align: center; margin-top: 12px; }

@media (max-width: 360px) { .waarden span { white-space: normal; } .kistkaart { grid-template-columns: 72px minmax(0, 1fr) auto; } .kistkaart img { width: 72px; height: 40px; } }


.hud .doel span b, .hud .doel span em { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .doel span { gap: 8px; }
.hud .doel span em { flex: none; }
@media (max-width: 400px) { .contact { grid-template-columns: 72px minmax(0, 1fr); } .contact .prijs { grid-column: 1 / -1; justify-self: end; } }
@media (max-width: 360px) { .hud .doel span { font-size: 11px; gap: 6px; } .hud { gap: 8px; } }


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

const MAGAZIJN = { soorten: ['bout', 'band', 'helm', 'jerrycan', 'meter', 'turbine'], perOnderdeel: 150, perMunt: 10 };

const magazijnOpbrengst = (punten) => ({ onderdelen: Math.floor(punten / MAGAZIJN.perOnderdeel), munten: Math.floor(punten / MAGAZIJN.perMunt) });

function magazijnKlaar(S, u) {
  const M = S.spel.magazijn, o = magazijnOpbrengst(u.punten), record = u.punten > M.record;
  M.gespeeld++; M.onderdelen += o.onderdelen; M.munten += o.munten;
  if (record) M.record = u.punten;
  S.onderdelen += o.onderdelen; S.munten += o.munten;
  return { onderdelen: o.onderdelen, munten: o.munten, record };
}

function kernPatronen() {
  const re = (nl) => new RegExp('^' + nl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\\{\d\\\}/g, '(.+?)') + '$');

}

function instellingenVel() {
  let html = '<p class="label">' + vertaal('De naam van je basis') + '</p><input id="naamInvoer" class="invoer" maxlength="24" value="' + esc(vertaal(S.naam)) + '">';

function welkomVel(naam) {

    '<input id="eersteNaam" class="invoer" maxlength="24" value="' + esc(naam || vertaal(S.naam)) + '"><button class="hoofdknop" id="beginKnop">' + vertaal('Naar de basis') + '</button>' +

function gebeurd(lijst, stil) {
  for (const g of lijst) {
    if (g.soort === 'contact' && !stil) { melding(vertaal('Alarm! {0} op de radar.', vertaal(CONTACT[g.wat].naam)), 'iconen/alarm'); geluid('alarm'); tril(120); }
    if (g.soort === 'geland') {
      if (!stil) geluid(g.uitslag === 'beschoten' ? 'schot' : 'geland');

      if (!stil && !UI.velOpen && !Drie.actief && !Patrouille.actief) uitslagVel();
      else if (!stil) melding(vertaal('{0}: {1} munten.', uitslagTekst(S.uitslag)[0], getal(g.munten)), 'doelen/' + g.wat);
    }
    if (g.soort === 'werk_klaar' && !stil) { melding(vertaal(g.werk === 'tanken' ? 'De {0} is volgetankt.' : 'De {0} is weer in topstaat.', KIST[g.kist].naam), 'iconen/monteur'); geluid('werk'); }
  }
  if (lijst.length) UI.vuil = true;
}


function renderTab() {
  for (const t of ['basis', 'radar', 'magazijn', 'winkel', 'logboek']) $('tab-' + t).hidden = UI.tab !== t;
  document.querySelectorAll('nav.onder button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === UI.tab)));
  UI.sig = {};
  renderAlles();
}
function renderAlles() {
  UI.vuil = false;
  renderKop();
  if (UI.tab === 'basis') renderBasis();
  else if (UI.tab === 'radar') renderRadar();
  else if (UI.tab === 'magazijn') renderMagazijn();
  else if (UI.tab === 'winkel') renderWinkel();
  else renderLogboek();
}
function naarTab(tab) {

  const thuis = Patrouille.actief && Patrouille.st && Patrouille.st.scramble ? 'radar' : 'magazijn';
  const liep = (Drie.actief || Patrouille.actief) && tab !== thuis;
  if (liep) { if (Drie.actief) drieEinde(true); else patrouilleEinde(true); }
  UI.tab = tab;
  if (!liep) sluitVel();
  renderTab();
}


function klik(e) {
  const t = e.target.closest('button, [data-sluit]');
  if (!t) return;
  audioStart();
  const ds = t.dataset, nu = Date.now(), uit = t.getAttribute('aria-disabled') === 'true';
  if (ds.sluit !== undefined) { sluitVel(); if (S.uitslag && !S.uitslag.gezien) uitslagVel(); return; }
  if (ouderKlik(ds)) return;
  if (ds.tab) { naarTab(ds.tab); geluid('klik'); return; }
  if (ds.naarwinkel) { UI.winkelCat = ds.naarwinkel; naarTab('winkel'); return; }
  if (t.id === 'basisKnop') { naarTab('logboek'); return; }
  if (t.id === 'instKnop') return instellingenVel();
  if (ds.kist) return kistVel(ds.kist);
  if (ds.onderhoud) {
    const r = vraagOnderhoud(S, ds.onderhoud);
    if (!r.ok) { melding(r.reden, 'iconen/gereedschap'); geluid('fout'); if (r.magazijn) naarTab('magazijn'); return; }
    geluid('werk'); sluitVel(); veranderd(); return melding(vertaal('De ploeg begint aan de {0}.', KIST[ds.onderhoud].naam), 'iconen/monteur');
  }
  if (ds.stoponderhoud) { stopOnderhoud(S, ds.stoponderhoud); sluitVel(); veranderd(); return; }
  if (ds.scramble) { UI.keuze = []; const klaar = Object.keys(S.kisten).filter((id) => inzetbaar(S, id).ok); if (klaar.length === 1) UI.keuze = klaar; return scrambleVel(+ds.scramble); }
  if (ds.kieskist) {
    if (uit) { melding(KIST[ds.kieskist].naam + ': ' + inzetbaar(S, ds.kieskist).reden, 'kisten/' + ds.kieskist); return; }

    UI.keuze = UI.keuze.includes(ds.kieskist) ? UI.keuze.filter((id) => id !== ds.kieskist) : UI.keuze.concat(ds.kieskist).slice(-2);
    geluid('klik'); return scrambleVel(+ds.nr);
  }
  if (ds.zelfvliegen) {
    if (uit) return melding(vertaal('Kies eerst een kist.'), 'iconen/radar');
    const r = scrambleStart(S, +ds.zelfvliegen, UI.keuze);
    if (!r.ok) { geluid('fout'); return melding(r.reden, 'iconen/radar'); }
    geluid('start'); tril(60); sluitVel(); UI.tab = 'radar'; renderTab(); veranderd();
    return startPatrouille($('tab-radar'), r.kisten[0], 0, false, { contact: r.contact, nr: r.nr, kisten: r.kisten, vleugel: r.kisten[1], staat: r.staat });
  }
  if (ds.opstijgen) {
    if (uit) return melding(vertaal('Kies eerst een kist.'), 'iconen/radar');
    const r = scramble(S, +ds.opstijgen, UI.keuze, nu);
    if (!r.ok) { geluid('fout'); return melding(r.reden, 'iconen/radar'); }
    geluid('start'); tril(60); sluitVel(); UI.tab = 'radar'; renderTab(); veranderd(); planMeldingen(); return;
  }
  if (ds.signaal) {
    const r = signaal(S, +ds.signaal, nu);
    if (r.ok) { geluid('signaal'); tril(20); veranderd(); } else if (r.reden) melding(r.reden, 'iconen/radar');
    return;
  }
  if (ds.spel) { sluitVel(); return startSpel(ds.spel); }
  if (ds.patrouille) {
    if (uit) { melding(KIST[ds.patrouille].naam + ': ' + inzetbaar(S, ds.patrouille).reden, 'kisten/' + ds.patrouille); return; }
    geluid('start'); tril(40); sluitVel(); UI.tab = 'magazijn'; renderTab();
    return startPatrouille($('tab-magazijn'), ds.patrouille);
  }
  if (ds.cat) { UI.winkelCat = ds.cat; renderWinkel(); return; }
  if (ds.koopkist || ds.koopshelter || ds.monteur || ds.opleiding || ds.krat) {
    const r = ds.koopkist ? koopKist(S, ds.koopkist) : ds.koopshelter ? koopShelter(S) : ds.monteur ? huurMonteur(S) : ds.opleiding ? leidOp(S) : koopKrat(S);
    if (!r.ok) { geluid('fout'); return melding(r.reden || vertaal('Dat kan nu niet.'), 'iconen/munt'); }
    geluid('munt'); veranderd(); renderAlles();
    return melding(ds.koopkist ? vertaal('De {0} staat op je basis!', KIST[ds.koopkist].naam) : ds.koopshelter ? vertaal('Er staat een shelter bij.') : ds.monteur ? vertaal('Er is een monteur bij.') : ds.opleiding ? vertaal('De ploeg is nu niveau {0}.', S.ploeg.niveau) : vertaal('{0} onderdelen erbij.', KRAT.aantal), ds.koopkist ? 'kisten/' + ds.koopkist : ds.koopshelter ? 'iconen/shelter' : ds.krat ? 'iconen/krat' : 'iconen/monteur');
  }
  if (ds.schakel) { UI.instellingen[ds.schakel] = !UI.instellingen[ds.schakel]; bewaarInstellingen(); if (ds.schakel === 'geluid' && UI.instellingen.geluid) { audioStart(); geluid('klik'); } return instellingenVel(); }
  if (ds.opnieuw) {
    if (ds.opnieuw === '1') return openVel(vertaal('Opnieuw beginnen'), '<p>' + vertaal('Weet je het zeker? Je hele basis gaat weg.') + '</p><div class="rij"><button class="knop2" data-opnieuw="2" style="color:var(--slecht)">' + vertaal('Ja, alles weg') + '</button><button class="knop2" data-sluit>' + vertaal('Nee') + '</button></div>');
    S = nieuweStaat(nu); UI.sig = {}; sluitVel(); bewaarNu(); renderTab(); return welkomVel();
  }
}



function geluid(soort, extra) {
  if (!UI.instellingen.geluid || !AC) return;
  try {
    switch (soort) {

      case 'alarm': for (let i = 0; i < 3; i++) { toon(740, 0.16, 'square', 0.05, i * 0.36); toon(554, 0.16, 'square', 0.05, i * 0.36 + 0.18); } break;

      case 'start': ruis(1.6, 0.14, 500, 0, 0.7, 'lowpass'); ruis(1.3, 0.07, 2200, 0.15, 1.2); toon(90, 1.4, 'sawtooth', 0.04, 0, 240); break;
      case 'geland': ruis(0.5, 0.06, 700, 0, 0.8, 'lowpass'); toon(659, 0.18, 'sine', 0.06, 0.25); toon(880, 0.3, 'sine', 0.05, 0.4); break;
      case 'schot': for (let i = 0; i < 5; i++) ruis(0.05, 0.16, 1400, i * 0.08, 1.5); toon(140, 0.4, 'square', 0.05, 0.1, 70); break;
      case 'signaal': toon(880, 0.08, 'sine', 0.06); toon(1175, 0.12, 'sine', 0.05, 0.08); break;
      case 'werk': for (let i = 0; i < 4; i++) ruis(0.03, 0.09, 3200, i * 0.07, 3); break;
      case 'munt': toon(988, 0.07, 'square', 0.05); toon(1319, 0.16, 'square', 0.05, 0.07); break;
      case 'klik': toon(760, 0.03, 'square', 0.03); break;
      case 'fout': toon(210, 0.12, 'square', 0.04, 0, 150); break;
      case 'gewonnen': [523, 659, 784, 1047, 1319].forEach((f, i) => toon(f, 0.3, 'triangle', 0.1, i * 0.1)); break;

      case 'wissel': toon(520, 0.05, 'triangle', 0.04, 0, 640); break;
      case 'rij': { const f = 523 * Math.pow(1.19, Math.min(6, (extra || 1) - 1)); toon(f, 0.09, 'triangle', 0.06); toon(f * 1.5, 0.16, 'triangle', 0.05, 0.06); break; }

      case 'kanon': ruis(0.04, 0.05, 2600, 0, 2); toon(220, 0.05, 'square', 0.02, 0, 120); break;
      case 'raket': ruis(0.5, 0.1, 900, 0, 0.6, 'lowpass'); toon(160, 0.45, 'sawtooth', 0.04, 0, 60); break;
      case 'vijandschot': toon(880, 0.06, 'square', 0.025, 0, 440); break;
      case 'explosie': ruis(0.35, 0.14, 500, 0, 0.5, 'lowpass'); toon(90, 0.3, 'square', 0.05, 0, 40); break;
      case 'explosie_groot': ruis(0.8, 0.2, 320, 0, 0.5, 'lowpass'); toon(70, 0.7, 'sawtooth', 0.06, 0, 30); ruis(0.4, 0.08, 1800, 0.1, 1); break;
      case 'botsing': ruis(0.2, 0.1, 1200, 0, 1); toon(300, 0.15, 'square', 0.04, 0, 150); break;
      case 'geraakt': toon(240, 0.18, 'square', 0.06, 0, 110); ruis(0.15, 0.08, 800, 0, 1); break;
      case 'oppak': toon(660, 0.06, 'sine', 0.05); toon(990, 0.1, 'sine', 0.05, 0.06); break;
      case 'schietstoel': ruis(1.2, 0.2, 260, 0, 0.4, 'lowpass'); toon(60, 1.0, 'sawtooth', 0.07, 0, 25); for (let i = 0; i < 6; i++) ruis(0.08, 0.1, 1500 + i * 300, 0.1 + i * 0.07, 1.5); break;
    }
  } catch (e) { console.warn('geluid', soort, e); }
}




const OPSLAG_SLEUTEL = 'jeager_staat_v1';
let S = null;

let demoKlok = 0;
const nuKlok = () => demoKlok || Date.now();

function laadStaat() {
  let tekst = '';
  try { if (window.DierApp) tekst = DierApp.laad(); } catch (e) { tekst = ''; }
  if (!tekst) { try { tekst = localStorage.getItem(OPSLAG_SLEUTEL) || ''; } catch (e) { tekst = ''; } }
  if (!tekst) return null;
  try { return JSON.parse(tekst); } catch (e) { return null; }
}
let bewaarTimer = 0;
function bewaarStraks() { clearTimeout(bewaarTimer); bewaarTimer = setTimeout(bewaarNu, 800); }
function bewaarNu() {
  clearTimeout(bewaarTimer);
  if (!S) return;
  S.opgeslagen = Date.now();
  const tekst = JSON.stringify(S);
  try { if (window.DierApp) DierApp.bewaar(tekst); } catch (e) {  }
  try { localStorage.setItem(OPSLAG_SLEUTEL, tekst); } catch (e) {  }
}
function bewaarInstellingen() { try { localStorage.setItem('jeager_inst', JSON.stringify(UI.instellingen)); } catch (e) {  } }
function planMeldingen() {
  if (!window.DierApp || !S) return;
  try { DierApp.planMeldingen(JSON.stringify(voorspel(S, Date.now()))); } catch (e) {  }
}


function welkomTerug(r) {
  const uren = r.minuten / 60, geland = r.gebeurd.filter((g) => g.soort === 'geland'), n = S.radar.contacten.length;
  const weg = uren >= 48 ? vertaal('{0} dagen', Math.floor(uren / 24)) : uren >= 24 ? vertaal('1 dag') : uren >= 1 ? vertaal('{0} uur', Math.floor(uren)) : vertaal('{0} minuten', r.minuten);
  let tekst = vertaal('Je was {0} weg.', weg);
  const munten = getal(geland.reduce((s, g) => s + g.munten, 0));
  if (geland.length) tekst += ' ' + (geland.length === 1 ? vertaal('Je kist is geland: {0} munten.', munten) : vertaal('{0} vluchten zijn geland: {1} munten.', geland.length, munten));
  tekst += ' ' + (n === 1 ? vertaal('Er wacht 1 contact op de radar.') : n ? vertaal('Er wachten {0} contacten op de radar.', n) : vertaal('Het is rustig op de radar.'));
  melding(tekst, 'iconen/radar');
}
function naInhalen(r) {
  if (r.minuten > 30) { gebeurd(r.gebeurd, true); welkomTerug(r); if (S.uitslag && !S.uitslag.gezien && !UI.velOpen && !Drie.actief) uitslagVel(); }
  else gebeurd(r.gebeurd);
}
window.appPauze = () => { bewaarNu(); planMeldingen(); };
window.appHervat = () => { if (!S || demoKlok) return; naInhalen(inhalen(S, Date.now())); veranderd(); };
window.terugKnop = () => {
  if (!$('vel').hidden) { sluitVel(); return true; }
  if (Drie.actief) { drieEinde(true); return true; }
  if (Patrouille.actief) { patrouilleEinde(true); return true; }
  if (UI.tab !== 'basis') { naarTab('basis'); return true; }
  return false;
};

function naNachtWissel() { UI.vuil = true; }

async function start() {


  kernPatronen();
  taalStart();

  window.taalVeranderd = () => {
    UI.sig = {}; renderAlles();
    if ($('naamInvoer')) instellingenVel();
    else if ($('eersteNaam')) welkomVel($('eersteNaam').value);
  };
  await laadSprites();
  try { const i = JSON.parse(localStorage.getItem('jeager_inst') || 'null'); if (i) Object.assign(UI.instellingen, i); } catch (e) {  }
  ouderStart();
  const nu = Date.now();
  S = laadStaat();
  if (!S || S.v !== STAAT_VERSIE) S = nieuweStaat(nu);
  else herstelStaat(S, nu);
  const r = inhalen(S, nu);
  document.querySelectorAll('[data-icoon]').forEach((img) => { const n = img.dataset.icoon; img.src = sprUrl(n.includes('/') ? n : 'iconen/' + n); });
  $('muntIcoon').src = sprUrl('iconen/munt'); $('kopLogo').src = sprUrl('logo');
  document.addEventListener('click', (e) => { audioStart(); klik(e); });
  const lokaal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const demo = lokaal && location.hash.length > 1 ? location.hash.slice(1) : '';
  if (demo) zetDemo(demo);
  renderTab();
  if (!demo && !S.welkom) welkomVel();
  else if (!demo) naInhalen(r);
  if (demo) naDemo(demo);
  bewaarNu();

  let laatsteTel = 0, laatsteUi = 0, laatsteBeeld = 0;
  const lus = (t) => {
    requestAnimationFrame(lus);
    const klok = nuKlok();
    if (klok - laatsteTel >= 1000 && !demoKlok) {
      laatsteTel = klok;
      const rr = inhalen(S, klok);
      if (rr.gebeurd.length) { gebeurd(rr.gebeurd); bewaarStraks(); }

      if (UI.tab === 'basis' || UI.tab === 'radar') UI.vuil = true;
      renderKop();
    }
    if (UI.vuil && t - laatsteUi > 250) { laatsteUi = t; renderAlles(); }
    if (document.hidden) return;
    if (UI.tab === 'radar' && t - laatsteBeeld > 33) {
      laatsteBeeld = t;
      tekenRadar(S, t, klok);
      for (const m of S.vluchten) { const cv = $('balk' + m.nr); if (cv) tekenVluchtBalk(cv, m, t, klok); }
    }
  };
  requestAnimationFrame(lus);
  document.addEventListener('visibilitychange', () => { if (document.hidden) window.appPauze(); else window.appHervat(); });
  window.addEventListener('pagehide', () => window.appPauze());
}














function zetDemo(soort) {
  const nu = Date.now(), wat = (/^[a-z]+/.exec(soort) || [soort])[0];
  S = nieuweStaat(nu); S.welkom = true; S.rng = 4242; S.radar.volgende = nu + 99 * DAG;
  isNacht = () => false;
  if (wat !== 'begin') {
    Object.assign(S, { munten: 6400, onderdelen: 23, aanzien: 320, shelters: 5, ploeg: { monteurs: 2, niveau: 2 } });
    for (const id of ['gripen', 'hornet', 'f35']) S.kisten[id] = nieuweKist();
    S.kisten.f16.staat = 72; S.kisten.gripen.staat = 88; S.kisten.gripen.brandstof = 40; S.kisten.hornet.staat = 55;
    S.werk = [{ kist: 'gripen', soort: 'tanken' }, { kist: 'hornet', soort: 'onderhoud' }];
    Object.assign(S.totaal, { vluchten: 86, gelukt: 71, genegeerd: 13, beschoten: 2, verdiend: 18340, perSoort: { sport: 21, lijn: 24, drone: 15, verkenner: 13, bommenwerper: 9, jager: 4 } });
    S.spel.magazijn = { record: 2340, gespeeld: 14, onderdelen: 151, munten: 2480 };
    S.spel.patrouille = { record: 410, gespeeld: 6, onderdelen: 9, munten: 1870, neergehaald: 41, afstand: 6120 };
    for (const [id, min, hoek] of [['bommenwerper', 31, 40], ['lijn', 12, 200], ['drone', 44, 300]]) S.radar.contacten.push({ nr: ++S.radar.nr, soort: id, sinds: nu, tot: nu + min * MIN, hoek });
  }
  if (['radar', 'scramble', 'vlucht', 'schot'].includes(wat) || /^onderschep/.test(wat)) UI.tab = 'radar';
  if (wat === 'onderschepjager') S.radar.contacten.push({ nr: ++S.radar.nr, soort: 'jager', sinds: nu, tot: nu + 40 * MIN, hoek: 120 });
  if (['winkel', 'logboek', 'magazijn'].includes(wat)) UI.tab = wat;
  if (wat === 'patrouille') UI.tab = 'magazijn';
  if (wat === 'vlucht' || wat === 'schot') {

    const wens = wat === 'schot' ? 'beschoten' : 'gelukt', ids = wat === 'schot' ? ['f35'] : ['f35', 'f16'];
    for (let z = 1; z < 4000; z++) {
      const K = JSON.parse(JSON.stringify(S)); K.rng = z * 7919;
      const v = scramble(K, 1, ids, nu).vlucht;
      if ((v.schot ? 'beschoten' : v.gelukt ? 'gelukt' : 'genegeerd') === wens) { S = K; break; }
    }
    const v = S.vluchten[0], bezig = v.schot ? v.schot.t - nu + 500 : v.heen + v.zien + 9000;
    v.start -= bezig; v.einde -= bezig; if (v.schot) v.schot.t -= bezig;
    if (v.schot) demoKlok = nu;
  }
  if (wat === 'uitslag') S.uitslag = { nr: 1, t: nu, contact: 'bommenwerper', kisten: ['f35', 'f16'], uitslag: 'gelukt', munten: 672, aanzien: 5, signalen: 5, schade: 0, gezien: false };
  bewaarNu = () => {};
}
function naDemo(soort) {
  const wat = (/^[a-z]+/.exec(soort) || [soort])[0], zetten = Number(/\d+$/.exec(soort) || 0);
  if (wat === 'kist') setTimeout(() => kistVel('hornet'), 300);
  if (wat === 'scramble') setTimeout(() => { UI.keuze = ['f35', 'f16']; scrambleVel(1); }, 300);
  if (wat === 'uitslag') setTimeout(uitslagVel, 300);
  if (wat === 'patrouille') setTimeout(() => startPatrouille($('tab-magazijn'), 'f35', 4242, true), 300);
  if (/^onderschep/.test(wat)) setTimeout(() => {
    const soort = wat === 'onderschepdrone' ? 'drone' : wat === 'onderschepjager' ? 'jager' : 'bommenwerper', c = S.radar.contacten.find((x) => x.soort === soort);
    const r = scrambleStart(S, c.nr, wat === 'onderschepdrone' ? ['f35'] : ['f35', 'f16']);
    startPatrouille($('tab-radar'), r.kisten[0], 4242, wat !== 'onderschepzelf', { contact: r.contact, nr: r.nr, kisten: r.kisten, vleugel: r.kisten[1], staat: r.staat });
  }, 300);



  if (wat === 'magazijn') setTimeout(() => {
    startMagazijn($('tab-magazijn'), 4242);
    const st = Drie.st;
    const waard = (m) => { const v = st.veld.slice(); [v[m[0]], v[m[1]]] = [v[m[1]], v[m[0]]]; return driePunten(drieGroepen(v, st.kol, st.rij).groepen, 1); };
    const beste = () => drieMogelijk(st.veld, st.kol, st.rij).reduce((b, x) => (waard(x) > waard(b) ? x : b));
    for (let i = 1; i < zetten; i++) { const m = beste(); drieZet(st, m[0], m[1]); }
    Drie.veld = st.veld.slice(); drieHud();
    if (zetten) { const m = beste(); drieDoe(m[0], m[1]); }
  }, 300);
}

start();
