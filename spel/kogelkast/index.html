<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kogelkast</title>
<style>

:root { --grond: #0b0c12; --kast: #1b1420; --messing: #e0a030; --messing2: #8a5a10; --rood: #c0392b; --inkt: #f1e9d6; --inkt2: #b9ac94; --kop: "Roboto Condensed", "Arial Narrow", sans-serif; --tekst: system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--grond); color: var(--inkt); font: 15px/1.4 var(--tekst); overscroll-behavior: none; overflow: hidden; }
body { user-select: none; -webkit-user-select: none; touch-action: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: none; }
button:focus-visible { outline: 2px solid var(--messing); outline-offset: 2px; }
canvas, img { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; }
.scherm { width: min(100%, 520px); height: 100%; display: flex; flex-direction: column; align-items: center; }
.titel { justify-content: center; text-align: center; padding: 16px; gap: 10px; background: radial-gradient(ellipse at 50% 30%, #2a1a30, var(--grond) 70%); }
.titel h1 { font: 900 44px/1 var(--kop); letter-spacing: .12em; margin: 0; color: var(--messing); text-shadow: 0 3px 0 var(--messing2), 0 6px 18px rgba(0,0,0,.8); }
.titel .onder { margin: 0; font: 700 15px var(--kop); letter-spacing: .3em; color: var(--inkt2); }
.hoofdknop { padding: 14px 40px; border-radius: 10px; background: linear-gradient(180deg, #e74c3c, #8e1b10); color: #fff; font: 900 22px var(--kop); letter-spacing: .14em; box-shadow: 0 4px 0 #4a0a05, 0 8px 20px rgba(0,0,0,.6); margin-top: 8px; }
.hoofdknop:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a0a05; }
.uitleg { font-size: 12.5px; color: var(--inkt2); max-width: 420px; margin: 8px 0 0; }
.record { margin: 0; font: 700 14px var(--kop); letter-spacing: .08em; color: var(--messing); }
.versie { font-size: 11px; color: var(--inkt2); margin: 10px 0 0; }
.hud { width: 100%; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: linear-gradient(180deg, #2a2230, #15101a); border-bottom: 2px solid var(--messing2); padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
.hud .vak { display: flex; flex-direction: column; min-width: 0; }
.hud .vak small { font: 700 9px var(--kop); letter-spacing: .14em; color: var(--inkt2); }
.hud .vak b { font: 900 20px/1 var(--kop); color: var(--messing); letter-spacing: .04em; white-space: nowrap; }
.hud .vak:not(.klein) { flex: 1; }
.hud .vak.klein b { font-size: 15px; color: var(--inkt); }
.letters i { font-style: normal; display: inline-block; width: 14px; text-align: center; color: #4a3a2a; }
.letters i.aan { color: #ffd54f; text-shadow: 0 0 6px rgba(255,213,79,.9); }
.rond { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #2e2535; border: 1px solid var(--messing2); font: 700 18px/1 var(--kop); color: var(--inkt2); flex: none; }
.rond[aria-pressed="false"] { opacity: .45; }
.kast { flex: 1; display: flex; align-items: flex-start; justify-content: center; width: 100%; background: #000; overflow: hidden; }
#doek { display: block; background: #000; }
.knoppen { width: 100%; display: grid; grid-template-columns: 1fr auto auto 1fr; gap: 6px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px)); background: #15101a; border-top: 2px solid var(--messing2); }
.flipknop { height: 56px; border-radius: 10px; background: linear-gradient(180deg, #3a2f44, #1e1826); border: 1px solid var(--messing2); font: 900 24px var(--kop); color: var(--messing); box-shadow: 0 3px 0 #0b0810; }
.flipknop:active, .lanceerknop:active, .stootknop:active { transform: translateY(2px); box-shadow: none; filter: brightness(1.2); }
.lanceerknop { height: 56px; padding: 0 16px; border-radius: 10px; background: linear-gradient(180deg, #e74c3c, #8e1b10); color: #fff; font: 900 15px var(--kop); letter-spacing: .1em; box-shadow: 0 3px 0 #4a0a05; }
.stootknop { height: 56px; padding: 0 10px; border-radius: 10px; background: #2e2535; border: 1px solid var(--messing2); color: var(--inkt2); font: 700 12px var(--kop); letter-spacing: .1em; box-shadow: 0 3px 0 #0b0810; }
@media (pointer: fine) and (min-width: 700px) { .knoppen { display: none; } }

.tafels { display: grid; gap: 10px; width: min(100%, 480px); }
.tafelkaart { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; background: linear-gradient(180deg, #2e2535, #1b1420); border: 2px solid var(--messing2); box-shadow: 0 6px 16px rgba(0,0,0,.5); }
.tafelkaart:active { transform: translateY(2px); }
.tafelkaart img { width: 120px; height: 68px; object-fit: cover; border-radius: 6px; border: 1px solid #0b0810; }
.tafelkaart .geenbeeld { display: block; width: 120px; height: 68px; border-radius: 6px; background: repeating-linear-gradient(135deg, #242838 0 8px, #1a1c26 8px 16px); }
.tafelkaart b { display: block; font: 900 22px/1.1 var(--kop); letter-spacing: .08em; color: var(--messing); }
.tafelkaart small { display: block; font: 700 11px var(--kop); letter-spacing: .2em; color: var(--inkt2); margin-top: 2px; }
.tafelkaart em { display: block; font: 600 11.5px var(--tekst); color: var(--inkt2); margin-top: 4px; }

.tafelscherm { width: 100%; flex-direction: row; justify-content: center; align-items: stretch; }
.tafelscherm .kolom { width: min(100%, 520px); height: 100%; display: flex; flex-direction: column; align-items: center; }
.zijpaneel { display: none; }
@media (min-width: 860px) {
  .zijpaneel { display: block; width: 300px; margin-left: 18px; padding: 18px 18px 18px 20px; align-self: flex-start; margin-top: 56px; border-left: 2px solid var(--messing2); color: var(--inkt2); font-size: 13.5px; line-height: 1.45; }
  .zijpaneel h2 { font: 900 15px var(--kop); letter-spacing: .18em; color: var(--messing); margin: 0 0 8px; text-transform: uppercase; }
  .zijpaneel h2 + h2, .zijpaneel ul + h2 { margin-top: 18px; }
  .zijpaneel .rij { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: center; margin: 0 0 6px; }
  .zijpaneel .rij + h2 { margin-top: 18px; }
  .zijpaneel kbd { display: inline-block; text-align: center; padding: 3px 6px; border-radius: 6px; background: #2e2535; border: 1px solid var(--messing2); box-shadow: 0 2px 0 #0b0810; font: 700 13px var(--kop); color: var(--inkt); }
  .zijpaneel ul { margin: 0; padding-left: 18px; }
  .zijpaneel li { margin-bottom: 6px; }
  .zijpaneel b { color: var(--inkt); }
}


#studio { --gw: min(96vw, 66vh); position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgb(8,11,53) linear-gradient(to bottom, rgb(4,5,31) 0%, rgb(6,7,44) calc(50% + var(--gw) * -0.5195), rgb(7,8,46) calc(50% + var(--gw) * -0.4330), rgb(7,9,49) calc(50% + var(--gw) * -0.3463), rgb(8,10,50) calc(50% + var(--gw) * -0.2598), rgb(8,11,52) calc(50% + var(--gw) * -0.1732), rgb(8,11,53) calc(50% + var(--gw) * -0.0866), rgb(8,11,53) calc(50% + var(--gw) * 0.0000), rgb(8,11,52) calc(50% + var(--gw) * 0.0866), rgb(8,10,50) calc(50% + var(--gw) * 0.1732), rgb(7,9,49) calc(50% + var(--gw) * 0.2598), rgb(7,8,47) calc(50% + var(--gw) * 0.3463), rgb(6,7,44) calc(50% + var(--gw) * 0.4330), rgb(5,6,42) calc(50% + var(--gw) * 0.5195), rgb(4,5,31) 100%); transition: opacity .45s ease; }
#studio.weg { opacity: 0; pointer-events: none; }
#studio img { display: block; width: var(--gw); height: auto; animation: studioIn .5s ease both; }
@keyframes studioIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }

</style>
</head>

    <p class="uitleg">Pc: Z en / voor de flippers, pijl omlaag vasthouden om de bal weg te schieten, X stoot.<br>Telefoon: tik links of rechts op de tafel, LANCEER vasthouden.</p>

<script>



const STUDIO_KLAAR = new Promise((klaar) => {
  const el = document.getElementById('studio');
  if (!el) { klaar(); return; }
  let weg = false;
  const sluit = () => { if (weg) return; weg = true; el.classList.add('weg'); setTimeout(() => { el.remove(); klaar(); }, 450); };
  el.addEventListener('click', sluit);

  c.fillStyle = '#242838'; c.fillRect(T.rand, 0, T.laanLinks - T.rand, T.H);
  c.fillStyle = '#15171f'; c.fillRect(T.laanLinks, T.poortY, T.laanRechts - T.laanLinks, T.H - T.poortY);
  c.strokeStyle = '#8a93a8'; c.lineWidth = 2; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const l of D.lijnen) { c.beginPath(); c.moveTo(l.punten[0][0], l.punten[0][1]); for (const p of l.punten.slice(1)) c.lineTo(p[0], p[1]); if (l.sling !== undefined) { c.fillStyle = '#c0392b'; c.fill(); } c.stroke(); }
  c.strokeStyle = '#4fd1c5'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(D.poort.a[0], D.poort.a[1]); c.lineTo(D.poort.b[0], D.poort.b[1]); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#6c7380'; for (const r of D.ronden) if (r.soort === 'paal') { c.beginPath(); c.arc(r.x, r.y, r.r, 0, 6.29); c.fill(); }
  c.fillStyle = '#0b0c12'; c.fillRect(T.rand, T.H - 4, T.laanLinks - T.rand, 4);
}


function gebeurd(g, nu) {
  const st = UI.st, D = tafelVan(st).delen;
  switch (g.soort) {
    case 'flipper': geluid('flipper'); break;
    case 'slag': geluid('slag'); break;
    case 'bumper': geluid('bumper', D.ronden.filter((r) => r.soort === 'bumper').findIndex((r) => r.id === g.wie)); punt(g.x, g.y - 16, '+' + g.punten, g.punten >= 1000, nu); tril(8); break;
    case 'sling': geluid('sling'); UI.flits[g.wie] = nu + 90; break;
    case 'wand': geluid('wand'); break;
    case 'lamp': geluid('lamp'); punt(D.lampen.find((l) => l.id === g.wie).x, 80, g.wie + ' +' + TAFEL.punten.lamp, false, nu); break;
    case 'letters': geluid('letters'); zegt(g.woord + '! Multiplier x' + g.multiplier, 2200); break;
    case 'doel': geluid('doel'); punt(g.x + (g.x < 160 ? 14 : -14), g.y, '+' + TAFEL.punten.doel, false, nu); break;
    case 'bank': geluid('bank'); zegt('BANK! +' + getal(TAFEL.punten.bank) + ' · bumpers x10 voor ' + TAFEL.opwindDuur + ' tellen', 3000); UI.schud = 0.25; break;
    case 'staand': geluid('staand'); punt(g.x + (g.x < 160 ? 14 : -14), g.y, '+' + TAFEL.punten.staand, false, nu); break;
    case 'staandPaar': geluid('staandPaar'); zegt('Beide doelen! +' + getal(TAFEL.punten.staandPaar) + (D.gaten.length ? ' · accu vol: het vanggat is ' + getal(TAFEL.punten.gatVol) + ' waard' : ''), 2600); break;
    case 'gat': geluid(g.vol ? 'bank' : 'gat'); punt(g.x + 20, g.y - 10, '+' + getal(g.punten), g.vol, nu); if (g.vol) { zegt('OPGELADEN! +' + getal(g.punten), 2500); UI.schud = 0.25; } break;
    case 'gatUit': geluid('lanceer'); break;
    case 'lanceer': geluid('lanceer'); tril(15); break;
    case 'terugInLaan': zegt('Te zacht. Nog eens.', 1500); break;
    case 'stoot': geluid('stoot'); UI.schud = 0.12; tril(20); break;
    case 'tilt': geluid('tilt'); zegt('TILT: de flippers zijn dood tot de volgende bal', 3000); tril(60); break;
    case 'los': zegt('De bal zat klem; een duwtje.', 1200); break;
    case 'balWeg': geluid('balWeg');
      if (g.bonus) { zegt('Bonus ' + getal(g.bonus) + ' (x' + g.multiplier + ')', 2200); for (let i = 0; i < 6; i++) setTimeout(() => geluid('bonus', i), 350 + i * 90); }
      if (st.fase !== 'klaar') setTimeout(() => zegt('Bal ' + st.balNr + ' · trek aan de veer', 2500), 2300);
      break;
    case 'extraBal': geluid('extraBal'); zegt('EXTRA BAL!', 2500); break;
    case 'klaar': muziekStop(); UI.laatste[st.tafel] = g.score; if (g.score > (UI.records[st.tafel] || 0)) { UI.records[st.tafel] = g.score; geluid('record'); } else geluid('klaar'); bewaarNu(); break;
  }
}
function punt(x, y, tekst, groot, nu) { UI.deeltjes.push({ x, y, tekst, groot, t0: nu, duur: groot ? 1400 : 900 }); }
function renderHud() {
  const st = UI.st;
  if (!st) return;
  const tafel = tafelVan(st);
  $('score').textContent = getal(st.score);
  $('bal').textContent = st.fase === 'klaar' ? '—' : st.balNr + '/' + (st.balNr + st.ballen - 1);
  $('multi').textContent = 'x' + st.multiplier;
  $('letters').innerHTML = tafel.letters.map((k) => '<i class="' + (st.lampen[k] ? 'aan' : '') + '">' + k + '</i>').join('');
  $('recordHud').textContent = UI.records[st.tafel] ? getal(UI.records[st.tafel]) : '0';
}







function toetsen() {
  const zet = (k, v) => { UI.toetsen[k] = v; };
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = e.key;
    if (UI.scherm === 'titel') { if (k === 'Enter' || k === ' ') { e.preventDefault(); audioStart(); nieuwSpel(); } return; }
    if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || k === 'a' || k === 'A') { e.preventDefault(); zet('links', true); }
    else if (k === 'ArrowRight' || k === '/' || k === 'l' || k === 'L') { e.preventDefault(); zet('rechts', true); }
    else if (k === ' ' || k === 'ArrowDown') { e.preventDefault(); if (UI.st && UI.st.fase === 'klaar') { audioStart(); nieuwSpel(); } else zet('trek', true); }
    else if (k === 'ArrowUp' || k === 'x' || k === 'X') { e.preventDefault(); UI.stoot = Math.random() < 0.5 ? -1 : 1; }
    else if (k === 'c' || k === 'C') UI.stoot = -1;
    else if (k === 'v' || k === 'V') UI.stoot = 1;
    else if (k === 'Enter') { if (UI.st && UI.st.fase === 'klaar') { audioStart(); nieuwSpel(); } }
    else if (k === 'Escape') { bewaarNu(); naarScherm('titel'); }
    audioStart();
  });
  document.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'z' || k === 'Z' || k === 'a' || k === 'A') zet('links', false);
    else if (k === 'ArrowRight' || k === '/' || k === 'l' || k === 'L') zet('rechts', false);
    else if (k === ' ' || k === 'ArrowDown') zet('trek', false);
  });
  const cv = UI.cv;
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault(); audioStart();
    if (!UI.st) return;
    if (UI.st.fase === 'klaar') { nieuwSpel(); return; }
    const r = cv.getBoundingClientRect(), kant = (e.clientX - r.left) / r.width < 0.5 ? 'links' : 'rechts';
    UI.vingers[e.pointerId] = kant; UI.toetsen[kant] = true;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {  }
  });
  const los = (e) => { const kant = UI.vingers[e.pointerId]; if (!kant) return; delete UI.vingers[e.pointerId]; if (!Object.values(UI.vingers).includes(kant)) UI.toetsen[kant] = false; };
  cv.addEventListener('pointerup', los); cv.addEventListener('pointercancel', los); cv.addEventListener('lostpointercapture', los);
  for (const [id, k] of [['knopLinks', 'links'], ['knopRechts', 'rechts'], ['knopLanceer', 'trek']]) {
    const b = $(id);
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); audioStart(); UI.toetsen[k] = true; try { b.setPointerCapture(e.pointerId); } catch (x) {  } });
    const laat = () => { UI.toetsen[k] = false; };
    b.addEventListener('pointerup', laat); b.addEventListener('pointercancel', laat); b.addEventListener('lostpointercapture', laat);
  }
  $('knopStoot').addEventListener('pointerdown', (e) => { e.preventDefault(); audioStart(); UI.stoot = Math.random() < 0.5 ? -1 : 1; });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    audioStart();
    if (t.dataset.tafel) nieuwSpel(t.dataset.tafel);
    else if (t.id === 'terug') { bewaarNu(); naarScherm('titel'); }
    else if (t.id === 'geluidKnop') { UI.instellingen.geluid = !UI.instellingen.geluid; bewaarInstellingen(); t.textContent = UI.instellingen.geluid ? '🔊' : '🔇'; if (UI.instellingen.geluid) { geluid('klik'); if (UI.scherm === 'tafel') muziekStart(); } else muziekStop(); }
    else if (t.id === 'muziekKnop') { UI.instellingen.muziek = !UI.instellingen.muziek; bewaarInstellingen(); t.setAttribute('aria-pressed', String(UI.instellingen.muziek)); if (UI.instellingen.muziek && UI.scherm === 'tafel') muziekStart(); else muziekStop(); }
  });
  window.addEventListener('resize', maatDoek);
}


let lusVorige = 0, trekToon = 0;
function lus(nu) {
  requestAnimationFrame(lus);
  if (document.hidden || UI.scherm !== 'tafel' || !UI.st) { lusVorige = nu; return; }
  const dt = Math.min(0.04, (nu - lusVorige) / 1000 || 0.016);
  lusVorige = nu;
  const st = UI.st, inv = { links: UI.toetsen.links, rechts: UI.toetsen.rechts, trek: UI.toetsen.trek, stoot: UI.stoot };
  UI.stoot = 0;
  tafelStap(st, dt, inv);
  if (st.fase === 'lanceer' && st.trekt && nu - trekToon > 90) { trekToon = nu; geluid('trek', st.trek); }
  for (const g of st.gebeurd) gebeurd(g, nu);
  if (st.gebeurd.length) renderHud();
  st.gebeurd = [];
  tekenTafel(nu, dt);
}




function geluid(soort, extra) {
  if (!UI.instellingen.geluid || !AC) return;
  try {
    switch (soort) {
      case 'flipper': ruis(0.03, 0.1, 1500, 0, 1.5); toon(140, 0.05, 'square', 0.035, 0, 90); break;
      case 'slag': ruis(0.04, 0.08, 2200, 0, 1.2); break;
      case 'bumper': toon(880 + (extra || 0) * 120, 0.07, 'square', 0.06); toon(1760, 0.05, 'triangle', 0.04, 0.02); ruis(0.03, 0.06, 3000, 0, 2); break;
      case 'sling': toon(520, 0.05, 'square', 0.045, 0, 700); ruis(0.03, 0.05, 2500, 0, 2); break;
      case 'wand': toon(2400, 0.012, 'square', 0.012); break;
      case 'lamp': toon(1319, 0.08, 'triangle', 0.05); toon(1760, 0.1, 'triangle', 0.05, 0.08); break;
      case 'letters': [784, 988, 1175, 1568].forEach((f, i) => toon(f, 0.14, 'square', 0.05, i * 0.08)); break;
      case 'doel': toon(330, 0.06, 'square', 0.05, 0, 220); ruis(0.05, 0.08, 900, 0, 1); break;
      case 'bank': [523, 659, 784, 1047, 1319].forEach((f, i) => toon(f, 0.2, 'triangle', 0.07, i * 0.07)); for (let i = 0; i < 10; i++) toon(1500 + (i % 4) * 150, 0.05, 'square', 0.03, 0.4 + i * 0.05); break;
      case 'staand': toon(440, 0.06, 'square', 0.045, 0, 330); break;
      case 'staandPaar': [659, 880, 1319].forEach((f, i) => toon(f, 0.15, 'triangle', 0.06, i * 0.07)); break;
      case 'trek': toon(90 + (extra || 0) * 120, 0.05, 'sawtooth', 0.02); break;
      case 'lanceer': ruis(0.12, 0.14, 1200, 0, 1); toon(220, 0.15, 'square', 0.05, 0, 60); toon(60, 0.25, 'sine', 0.08); break;
      case 'stoot': ruis(0.06, 0.1, 400, 0, 0.8, 'lowpass'); toon(70, 0.1, 'square', 0.05, 0, 40); break;
      case 'tilt': for (let i = 0; i < 3; i++) toon(200 - i * 40, 0.3, 'square', 0.06, i * 0.3, 120 - i * 30); break;
      case 'balWeg': toon(392, 0.15, 'triangle', 0.06); toon(294, 0.2, 'triangle', 0.06, 0.15); toon(196, 0.35, 'triangle', 0.06, 0.35); break;
      case 'bonus': toon(1047 + (extra || 0) * 60, 0.05, 'square', 0.04); break;
      case 'extraBal': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => toon(f, 0.16, 'square', 0.06, i * 0.1)); break;
      case 'klaar': [392, 349, 311, 262].forEach((f, i) => toon(f, 0.45, 'triangle', 0.07, i * 0.4)); break;
      case 'record': for (let r = 0; r < 3; r++) [659, 784, 988, 1319].forEach((f, i) => toon(f, 0.2, 'square', 0.06, r * 0.5 + i * 0.1)); break;
      case 'klik': toon(760, 0.03, 'square', 0.03); break;
    }
  } catch (e) { console.warn('geluid', soort, e); }
}


const Muziek = { aan: false, tot: 0, maat: 0, timer: 0 };
const MUZIEK_BAS = [110, 110, 131, 131, 98, 98, 87, 110];
const MUZIEK_MELODIE = [
  [440, 0, 523, 659, 0, 587, 523, 0], [440, 0, 523, 659, 784, 0, 659, 587], [392, 0, 494, 587, 0, 523, 494, 0], [349, 0, 440, 523, 0, 587, 659, 0],
  [440, 523, 659, 0, 880, 0, 784, 659], [587, 0, 523, 494, 523, 0, 587, 0], [392, 0, 494, 0, 587, 523, 494, 440], [349, 0, 440, 0, 523, 0, 440, 0],
];
function muziekStart() {
  if (!UI.instellingen.geluid || !UI.instellingen.muziek || !AC || Muziek.aan) return;
  Muziek.aan = true; Muziek.tot = AC.currentTime + 0.1; Muziek.maat = 0;
  muziekPlan();
}
function muziekStop() { Muziek.aan = false; clearTimeout(Muziek.timer); }
function muziekPlan() {
  if (!Muziek.aan || !AC) return;
  const tel = 0.22;
  while (Muziek.tot < AC.currentTime + 1.2) {
    const m = Muziek.maat % 8, t0 = Muziek.tot - AC.currentTime;
    for (let i = 0; i < 8; i++) {
      if (i % 2 === 0) toon(MUZIEK_BAS[m] / (i % 4 === 0 ? 1 : 2) * (i % 4 === 0 ? 1 : 1.5), tel * 0.9, 'triangle', 0.045, t0 + i * tel);
      const n = MUZIEK_MELODIE[m][i];
      if (n) toon(n, tel * 0.8, 'square', 0.022, t0 + i * tel);
    }
    Muziek.tot += 8 * tel; Muziek.maat++;
  }
  Muziek.timer = setTimeout(muziekPlan, 500);
}




const OPSLAG_SLEUTEL = 'flipperkast_staat_v2';

function laadStaat() {
  let tekst = '';
  try { if (window.DierApp) tekst = DierApp.laad(); } catch (e) { tekst = ''; }
  if (!tekst) { try { tekst = localStorage.getItem(OPSLAG_SLEUTEL) || localStorage.getItem('flipperkast_staat_v1') || ''; } catch (e) { tekst = ''; } }
  if (!tekst) return null;
  try { return JSON.parse(tekst); } catch (e) { return null; }
}
function bewaarNu() {
  const tekst = JSON.stringify({ v: 2, records: UI.records, laatste: UI.laatste, opgeslagen: Date.now() });
  try { if (window.DierApp) DierApp.bewaar(tekst); } catch (e) {  }
  try { localStorage.setItem(OPSLAG_SLEUTEL, tekst); } catch (e) {  }
}
function bewaarInstellingen() { try { localStorage.setItem('flipperkast_inst', JSON.stringify(UI.instellingen)); } catch (e) {  } }

async function start() {
  await laadSprites();
  try { const i = JSON.parse(localStorage.getItem('flipperkast_inst') || 'null'); if (i) Object.assign(UI.instellingen, i); } catch (e) {  }
  const S = laadStaat();
  if (S) {
    if (S.v === 2) { UI.records = S.records || {}; UI.laatste = S.laatste || {}; }
    else { UI.records = { uurwerk: S.record || 0 }; UI.laatste = { uurwerk: S.laatste || 0 }; }
  }
  UI.cv = $('doek'); UI.ctx = UI.cv.getContext('2d');
  $('geluidKnop').textContent = UI.instellingen.geluid ? '🔊' : '🔇';
  $('muziekKnop').setAttribute('aria-pressed', String(UI.instellingen.muziek));
  $('versie').textContent = 'Kogelkast ' + (window.DierApp && DierApp.versie ? DierApp.versie() : 'web') + ' · een hommage aan de flipperkasten van 1993';
  maatDoek(); toetsen();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { bewaarNu(); muziekStop(); } else if (UI.scherm === 'tafel') muziekStart(); });
  window.addEventListener('pagehide', bewaarNu);

  const lokaal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  naarScherm('titel');
  const demo = lokaal && location.hash.length > 1 ? location.hash.slice(1) : '';
  if (demo === 'spel') nieuwSpel(TAFELS[0].id);
  else if (demo && TAFELS.some((t) => t.id === demo)) nieuwSpel(demo);
  requestAnimationFrame(lus);
}
start();
